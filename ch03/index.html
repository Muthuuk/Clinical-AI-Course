const CH = {"id": "ch03", "num": "3", "title": "Data, Validation, and Evidence", "summary": "How to judge any clinical AI claim by asking where its data came from, how it was tested, and which number matters at the bedside.", "outcomes": ["Say why an AI tool is only as good as its data and its evidence", "Spot the common faults in clinical data that a headline accuracy figure hides", "Explain why accuracy misleads for rare events, and what to ask instead", "Ask which kind of testing a tool has had, and whether its risks match reality", "Choose the right bedside number for a decision, allowing for how common the condition is"], "starter": [{"q": "A tool for a rare condition says 'no disease' for everyone. Its accuracy is 95 per cent. How useful is it?", "o": ["Very useful, 95 per cent is high", "Useless, it catches no real cases", "Useful only at night"], "a": 1}, {"q": "A supplier says their tool is 'already used in 300 hospitals'. Is that proof it works?", "o": ["Yes, wide use is proof", "No, being in use is not evidence", "Only if the hospitals are in the UK"], "a": 1}, {"q": "A tool was tested only on the same hospital's data it learned from. What does that tell you about how it will do at your hospital?", "o": ["It will work just as well", "Very little, it has not been tested anywhere new", "It will certainly fail"], "a": 1}], "lessons": [{"title": "Two foundations", "minutes": 2, "slides": [{"img": 3, "say": ["Welcome to Chapter 3, Data, Validation, and Evidence. I'm Sam, your tutor.", "This chapter gives you a habit of mind for the whole course. You need no maths.", "Here is the big idea. An AI tool is only as good as two things. The data it learned from, and the evidence that it really works.", "A striking fact shows why. In 2020, researchers reviewed more than two hundred models that predicted COVID-19 outcomes. Almost all were judged unfit for clinical use.", "The maths was not the problem. The data and the testing were weak. So method, not maths, usually decides whether a tool helps a patient.", "The first foundation is data. Clinical data is a by-product of care. Busy people typed it into systems built for billing and booking, not for building models. So it is rich but messy.", "And more data does not fix this. A huge dataset from one unusual hospital simply repeats that hospital's habits more loudly.", "The second foundation is evidence. Testing a tool only on the data it was built from is like marking your own homework.", "Two traps to remember. A tool used in hundreds of hospitals is not proven by that. And regulatory approval is not clinical proof.", "If either foundation is weak, no clever algorithm can rescue the result."], "scene": {"type": "graph", "title": "Two foundations: the data a tool learned from, and the evidence it works", "nodes": [{"id": "tool", "label": "AI tool", "p": [0, 0.2, 1], "c": "cyan", "shape": "ico", "size": 1.2, "spin": true}, {"id": "data", "label": "Foundation 1:\ndata it learned from", "p": [-4.4, 1.9, -0.6], "c": "cyan", "shape": "cyl", "size": 1.0, "ls": 0.68}, {"id": "evid", "label": "Foundation 2:\nevidence it works", "p": [4.4, 1.9, -0.6], "c": "green", "shape": "shield", "size": 1.0, "ls": 0.68}, {"id": "covid", "label": "200+ COVID-19 models:\nalmost all unfit", "p": [0, 3.2, -1.6], "c": "red", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "messy", "label": "Typed in for billing\nand booking: messy", "p": [-4.4, -0.4, 0.8], "c": "amber", "shape": "slab", "size": 0.9, "ls": 0.68}, {"id": "traps", "label": "In use or approved\nis not proven", "p": [4.4, -0.4, 0.8], "c": "red", "shape": "torus", "size": 0.9, "ls": 0.68}], "links": [["data", "tool"], ["evid", "tool"], ["covid", "tool"], ["messy", "data"], ["traps", "evid"]], "steps": ["all", "all", "all", "all", ["tool"], ["tool", "data", "evid"], ["data", "evid"], ["covid"], ["covid"], ["covid"], ["covid"], ["covid", "data", "evid"], ["data", "evid"], ["data"], ["data", "messy"], ["messy"], ["messy"], ["data", "messy"], ["messy"], ["evid"], ["evid"], ["traps"], ["traps"], ["traps"], "all"]}}], "keyPoint": "A clinical AI tool is only as good as the data it learned from and the evidence that it works. Method, not maths, decides.", "plain": ["Two foundations: the data behind the tool, and the proof that it works.", "Clinical data was typed in for billing and booking, so it is messy.", "More data from the wrong place does not fix bias. It makes it louder.", "Being in use, or being approved, is not the same as being proven."], "check": {"q": "Why were most of the 200-plus COVID-19 prediction models judged unfit for use?", "o": ["The data and the testing behind them were weak", "The maths inside them was wrong", "They ran too slowly"], "a": 0, "e": "The review found weak data and weak testing, not bad maths. Method, not mathematics, decided.", "retry": {"q": "A tool learned from a huge dataset from one unusual hospital. What does the size of the data do to any bias in it?", "o": ["Removes it", "Makes it louder", "Has no effect"], "a": 1, "e": "Scale magnifies whatever is in the data, bias included. More data from the wrong place does not help."}}, "scenario": {"title": "The supplier's opening line", "setting": "A supplier presents a deterioration tool to your ward managers. Their first slide says: 'Used in 400 hospitals. CE marked. 94 per cent accurate.'", "steps": [{"prompt": "A colleague says 'four hundred hospitals, that settles it'. What do you say?", "choices": [{"t": "Agree. That many hospitals cannot be wrong", "s": 0, "fb": "Being in use is not evidence. A widely used sepsis tool did far worse when finally tested properly."}, {"t": "Ask what data it learned from and how it was tested", "s": 2, "fb": "Right. Those are the two foundations every claim rests on."}, {"t": "Ask how much it costs", "s": 1, "fb": "Fair to ask, but cost does not tell you whether it works."}]}, {"prompt": "The supplier says the CE mark proves it is clinically effective. Is that right?", "choices": [{"t": "Yes, approval is clinical proof", "s": 0, "fb": "No. Approval is not the same as proof that patients do better."}, {"t": "No, approval is not the same as evidence that patients do better", "s": 2, "fb": "Right. Keep the two questions separate: is it approved, and is it proven?"}, {"t": "Only if the approval is recent", "s": 0, "fb": "The date does not change the point. Approval is not clinical proof."}]}]}, "lab": {"type": "spot", "title": "The supplier's opening slide", "prompt": "A supplier pitches a deterioration tool to your ward managers. Tap every part that is a warning sign.", "parts": [{"lbl": "Supplier claim", "t": "Used in 400 hospitals.", "bad": true, "why": "Being used in many hospitals is not proof that the tool works."}, {"lbl": "Supplier claim", "t": "CE marked.", "bad": true, "why": "Regulatory approval is not clinical proof."}, {"lbl": "Supplier claim", "t": "94 per cent accurate, measured on the data the tool was built from.", "bad": true, "why": "Testing only on its own data is like marking your own homework."}, {"lbl": "Data", "t": "Trained on a huge dataset from one unusual hospital.", "bad": true, "why": "More data from one unusual place repeats that hospital's habits more loudly."}, {"lbl": "Ward manager", "t": "Asks: where did the data come from, and why was it collected?", "bad": false, "why": "Asking about the data checks the first foundation."}, {"lbl": "Ward manager", "t": "Asks to see testing on data the tool was not built from.", "bad": false, "why": "Asking for real evidence checks the second foundation."}], "explain": "A tool is only as good as its data and the evidence that it works. Wide use, approval and a headline figure prove neither."}}, {"title": "One patient, many systems", "minutes": 2, "slides": [{"img": 4, "say": ["Look at this picture from left to right.", "On the left is one patient. Their data is scattered across the GP system, the hospital record, the lab, the imaging archive, a wearable and a registry.", "Each system uses its own codes, its own patient numbers and its own units.", "In the middle is the fix. Think of it as a set of shared dictionaries, so every system means the same thing by the same word.", "You may hear the names. FHIR moves records between systems. SNOMED names clinical ideas. LOINC codes lab tests. ICD codes diagnoses. DICOM holds images.", "This is not just plumbing. Imagine a sepsis tool trained at a hospital that records lactate in one unit. A second hospital uses a different unit. The tool quietly gets every lactate wrong.", "Mapping both hospitals to the same code and the same unit is what lets the tool move safely.", "On the right is the prize. A clean, labelled, de-identified set of patients who look like the people the tool will serve.", "It is much harder to build than the mountain of raw data suggests. And notice the red dot. Bias can creep in at every arrow along the way."], "scene": {"type": "graph", "title": "One patient, many systems: shared codes join it up, but bias can enter at every arrow", "nodes": [{"id": "pt", "label": "One patient", "p": [-4.5, 1, 0.4], "c": "violet", "shape": "sphere", "size": 1.0}, {"id": "sys", "label": "GP, hospital, lab,\nimaging, wearable,\nregistry", "p": [-1.5, 1, 0], "c": "slate", "shape": "box", "size": 0.9, "ls": 0.62}, {"id": "std", "label": "Shared dictionaries:\nFHIR, SNOMED, LOINC,\nICD, DICOM", "p": [1.5, 1, 0], "c": "cyan", "shape": "ico", "size": 1.0, "ls": 0.62}, {"id": "ds", "label": "Clean, labelled,\nrepresentative set", "p": [4.5, 1, 0.4], "c": "green", "shape": "slab", "size": 1.0, "ls": 0.68}, {"id": "lac", "label": "Sepsis tool:\nlactate in two units", "p": [0, 3.2, -1.6], "c": "amber", "shape": "cyl", "size": 0.9, "ls": 0.68}, {"id": "bias", "label": "Bias can creep in\nat every arrow", "p": [0, -0.5, 1.3], "c": "red", "shape": "torus", "size": 0.8, "ls": 0.68}], "links": [["pt", "sys"], ["sys", "std"], ["std", "ds"], ["lac", "std"], ["bias", "sys"], ["bias", "ds"]], "steps": ["all", ["pt"], ["pt", "sys"], ["sys"], ["std"], ["std"], ["std"], ["std"], ["std"], ["std"], ["std"], ["std"], ["std", "lac"], ["lac"], ["lac"], ["lac"], ["lac", "std"], ["ds"], ["ds"], ["ds"], ["bias"], "all"]}}], "keyPoint": "One patient's data is scattered across many systems. Shared codes and units let it be joined up safely, but bias can enter at every step.", "plain": ["GP, hospital, lab, imaging, wearables and registries all hold bits of one patient.", "Shared dictionaries, such as SNOMED and LOINC, make them speak the same language.", "A lab unit that differs between hospitals can silently break a tool.", "The clean, representative dataset on the right is the hard part."], "check": {"q": "Two hospitals want to pool lab results, but each uses its own local test codes. Which standard is designed to code lab tests?", "o": ["DICOM", "ICD", "LOINC"], "a": 2, "e": "LOINC codes lab tests. DICOM is for images and ICD is for diagnoses.", "retry": {"q": "Why can a sepsis tool trained at one hospital fail at another?", "o": ["The second hospital may record a lab test in a different unit", "Sepsis is different in different towns", "Computers forget over time"], "a": 0, "e": "If lactate is recorded in a different unit, the tool reads every value wrongly. Shared codes and units fix this."}}, "scenario": {"title": "Sharing a tool across two trusts", "setting": "Your trust wants to adopt a kidney injury alert built by a neighbouring trust. Their lab reports creatinine in different units from yours.", "steps": [{"prompt": "What is the first risk to raise?", "choices": [{"t": "The tool may read your creatinine values wrongly", "s": 2, "fb": "Right. A unit mismatch can silently break every prediction."}, {"t": "The tool will be too slow", "s": 0, "fb": "Speed is not the issue. The units are."}, {"t": "Your patients are a different age mix", "s": 1, "fb": "Worth checking later, but the unit mismatch would break the tool outright."}]}, {"prompt": "The IT lead asks what would fix it. What do you suggest?", "choices": [{"t": "Ask staff to convert the numbers in their heads", "s": 0, "fb": "Unsafe. The tool reads the record directly, not the staff's conversions."}, {"t": "Map both labs to the same code and unit before the tool reads them", "s": 2, "fb": "Right. A shared code and a common unit let the tool move safely."}, {"t": "Switch the alert off for lab results", "s": 0, "fb": "That removes the main signal the tool depends on."}]}]}, "lab": {"type": "match", "title": "Shared dictionaries", "prompt": "Match each health data standard to the job it does.", "pairs": [{"a": "FHIR", "b": "Moves records between systems"}, {"a": "SNOMED", "b": "Names clinical ideas"}, {"a": "LOINC", "b": "Codes lab tests"}, {"a": "ICD", "b": "Codes diagnoses"}, {"a": "DICOM", "b": "Holds images"}], "explain": "Shared codes and units let one patient's scattered data be joined up, so a tool can move safely between hospitals."}}, {"title": "Six checks, three quiet faults", "minutes": 3, "slides": [{"img": 5, "say": ["Data quality sounds vague. Here it becomes six questions.", "Completeness. Are the values there? Accuracy. Are they right? A mis-typed weight, or a note copied forward, spreads silently.", "Consistency. Is the same thing recorded the same way? Two units for one lab test is the classic fault.", "Timeliness. Is it up to date? Think of an allergy list that is months old.", "Representativeness. Does the sample look like the people the tool will serve? Provenance. Do we know where each value came from?", "None of these faults shows up in a headline accuracy figure. Run through the six before trusting a dataset."], "scene": {"type": "stairs", "title": "Six questions to ask before trusting any dataset", "flat": true, "levels": [{"label": "Complete?", "c": "cyan"}, {"label": "Accurate?", "c": "cyan"}, {"label": "Consistent?", "c": "cyan"}, {"label": "Timely?", "c": "amber"}, {"label": "Representative?", "c": "violet"}, {"label": "Known origin?", "c": "violet"}], "steps": ["all", "all", 0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 5, 5, "all", "all"]}}, {"img": 6, "say": ["Three of these faults fool people most often.", "First, missing data. In medicine a gap is not neutral. A test is usually ordered because someone was worried. So whether a result exists at all carries meaning. Handled carelessly, that can mislead a tool.", "Second, provenance, the history of each value. If a hospital swaps its lab analyser mid-study, the inputs shift and no error message appears. The fix is to record every change.", "Third, ground truth. That is the answer key the tool learns from. It is often shakier than it looks. A billing code standing in for a diagnosis, or two experts who disagree.", "If the answer key is wrong, even a perfect tool learns the wrong lesson. Ask how the answers were decided."], "scene": {"type": "graph", "title": "Three quiet faults: missing data, provenance and the answer key", "nodes": [{"id": "tool", "label": "AI tool", "p": [0, 0.2, 1], "c": "cyan", "shape": "ico", "size": 1.1, "spin": true}, {"id": "miss", "label": "Missing data:\nthe gap has meaning", "p": [0, 3.2, -1.6], "c": "amber", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "prov", "label": "Provenance:\nanalyser swapped", "p": [-4.4, 1.9, -0.6], "c": "red", "shape": "cyl", "size": 0.9, "ls": 0.68}, {"id": "gt", "label": "Ground truth:\nthe answer key", "p": [4.4, 1.9, -0.6], "c": "red", "shape": "slab", "size": 0.9, "ls": 0.68}, {"id": "fixp", "label": "Fix: record\nevery change", "p": [-4.4, -0.4, 0.8], "c": "green", "shape": "shield", "size": 0.8, "ls": 0.68}, {"id": "fixg", "label": "Ask how answers\nwere decided", "p": [4.4, -0.4, 0.8], "c": "green", "shape": "shield", "size": 0.8, "ls": 0.68}], "links": [["miss", "tool"], ["prov", "tool"], ["gt", "tool"], ["fixp", "prov"], ["fixg", "gt"]], "steps": ["all", ["miss"], ["miss"], ["miss"], ["miss"], ["miss", "tool"], ["prov"], ["prov", "tool"], ["prov", "fixp"], ["gt"], ["gt"], ["gt"], ["gt"], ["gt", "tool"], ["gt", "fixg"]]}}], "keyPoint": "Six quality checks: complete, accurate, consistent, timely, representative, and with a known origin. Missing data, origin and the answer key fool people most.", "plain": ["Six checks: are values there, right, recorded the same way, up to date, like your patients, and traceable?", "A missing test often means nobody was worried. The gap itself carries meaning.", "Provenance: the history of each value. A swapped analyser shifts inputs silently.", "Ground truth is the answer key. If it is wrong, the tool learns the wrong lesson."], "check": {"q": "A tool learned its 'answers' from billing codes rather than confirmed diagnoses. What is the risk?", "o": ["The tool will run more slowly", "Billing codes are always more accurate", "The answer key may be wrong, so the tool learns the wrong lesson"], "a": 2, "e": "Ground truth is the answer key. A billing code is a weak stand-in for a diagnosis, so even a perfect tool can learn wrongly.", "retry": {"q": "Why is a missing blood result in a record not just an empty gap?", "o": ["Because the computer deletes old results", "Because tests are usually ordered when someone is worried, so the gap carries meaning", "Because missing results are always errors"], "a": 1, "e": "In medicine, whether a test was done at all tells you something about the patient."}}, "scenario": {"title": "The lab changed its machine", "setting": "You sit on a group reviewing a readmission tool built from three years of trust data. A pathology colleague mentions that the lab replaced its main analyser halfway through that period.", "steps": [{"prompt": "Why does this matter for the tool?", "choices": [{"t": "It does not. A machine is a machine", "s": 0, "fb": "It matters. Results from the two analysers may differ, shifting the tool's inputs silently."}, {"t": "Results may differ between the old and new analyser, without any warning", "s": 2, "fb": "Right. This is a provenance problem. Nothing flags it unless someone recorded the change."}, {"t": "Newer machines are always better, so later data is more trustworthy", "s": 1, "fb": "Perhaps, but the point is the shift between the two periods, which the tool was never told about."}]}, {"prompt": "What do you ask the data team?", "choices": [{"t": "Did you record when the analyser changed, and check the results before and after?", "s": 2, "fb": "Right. Recording every change to the data is the fix for provenance problems."}, {"t": "Can you make the tool run faster?", "s": 0, "fb": "Not relevant to this fault."}, {"t": "Can you add more years of data?", "s": 0, "fb": "More data does not fix a hidden shift. Recording the change does."}]}]}, "lab": {"type": "rush", "title": "Quiet faults speed round", "seconds": 60, "prompt": "Sort each card into the quiet fault it describes before the clock runs out.", "buckets": ["Missing data", "Provenance", "Ground truth"], "items": [{"t": "A test was never ordered because nobody was worried", "b": 0}, {"t": "Whether a result exists at all carries meaning", "b": 0}, {"t": "In medicine, a gap is not neutral", "b": 0}, {"t": "The lab swapped its analyser mid-study", "b": 1}, {"t": "Inputs shift and no error message appears", "b": 1}, {"t": "The fix is to record every change", "b": 1}, {"t": "A billing code standing in for a diagnosis", "b": 2}, {"t": "Two experts who disagree on the answer", "b": 2}, {"t": "The answer key the tool learns from", "b": 2}], "explain": "None of these faults shows up in a headline accuracy figure. Check the gaps, the history of each value and how the answers were decided."}}, {"title": "When accuracy fools you", "minutes": 2, "slides": [{"img": 7, "say": ["Here is the commonest way a bad tool looks good.", "Most clinical events are rare. In this picture, ninety-five in a hundred patients do not have the condition. Five do.", "A lazy tool that says no disease for everyone is right ninety-five times in a hundred. And it catches not a single real case. High accuracy, zero value. This is called the accuracy paradox.", "So for rare events we ask two better questions. Recall: of the patients who truly had it, how many did we catch? Precision: of the alarms we raised, how many were real?", "Let's work the example at the bottom. A ward of a thousand patients. Twenty will deteriorate.", "Tool A flags fifty patients and catches sixteen of the twenty. Its recall is eighty per cent. But its precision is only thirty-two per cent. Two in three of its alarms are false.", "Tool B flags eighteen and catches twelve. Its precision is higher, about two in three. But its recall is sixty per cent. It misses two in five of the patients who deteriorate.", "Which is better? Neither, on its own. It depends on whether a missed patient or a false alarm costs more on your ward.", "And both tools score well over ninety-five per cent accuracy. That one number hides the whole difference."], "scene": {"type": "bars", "title": "For rare events, accuracy fools you: ask recall and precision", "scale": 0.045, "bars": [{"id": "lacc", "label": "Lazy tool:\naccuracy %", "v": 95, "p": [-4.4, 0], "c": "amber"}, {"id": "lcau", "label": "Lazy tool:\ncases caught %", "v": 0, "p": [-2.2, 0], "c": "red"}, {"id": "arec", "label": "Tool A:\nrecall %", "v": 80, "p": [0, 0], "c": "green"}, {"id": "aprec", "label": "Tool A:\nprecision %", "v": 32, "p": [2.2, 0], "c": "red"}, {"id": "brec", "label": "Tool B:\nrecall %", "v": 60, "p": [4.4, 0], "c": "amber"}], "axes": [{"t": "Per cent", "p": [0, -2.2, 1.6]}], "steps": ["all", ["lacc", "lcau"], ["lacc"], ["lcau"], ["lacc"], ["lcau"], ["lacc", "lcau"], ["lacc", "lcau"], ["arec", "aprec", "brec"], ["arec", "brec"], ["aprec"], ["arec", "aprec", "brec"], ["arec", "aprec", "brec"], ["arec", "aprec", "brec"], ["arec"], ["arec"], ["aprec"], ["aprec"], ["brec"], ["brec"], ["brec"], ["brec"], ["arec", "aprec", "brec"], ["arec", "aprec", "brec"], ["arec", "aprec", "brec"], "all", "all"]}}], "keyPoint": "For rare events, accuracy misleads. Ask recall, how many real cases were caught, and precision, how many alarms were real.", "plain": ["Rare event plus lazy tool equals high accuracy and no value.", "Recall: of the real cases, how many did it catch?", "Precision: of its alarms, how many were real?", "Choosing between tools depends on whether a miss or a false alarm costs more."], "check": {"q": "On a ward of 1,000, 20 patients deteriorate. A tool flags 50 and catches 16. What is its precision?", "o": ["80 per cent", "96 per cent", "32 per cent"], "a": 2, "e": "Precision is the share of alarms that were real: 16 out of 50 is 32 per cent. Eighty per cent is its recall.", "retry": {"q": "A condition affects 5 in 100 patients. A tool says 'no disease' for everyone. What is its accuracy, and how many cases does it catch?", "o": ["95 per cent, and none", "5 per cent, and all of them", "50 per cent, and half"], "a": 0, "e": "It is right for the 95 who are well and wrong for the 5 who are ill. High accuracy, no cases caught."}}, "scenario": {"title": "Two deterioration tools", "setting": "Your acute medical unit is choosing between two deterioration tools. Tool A catches most deteriorating patients but two in three of its alarms are false. Tool B raises few false alarms but misses two in five deteriorating patients.", "steps": [{"prompt": "The supplier of each says 'over 96 per cent accurate'. What does that tell you?", "choices": [{"t": "They are equally good", "s": 0, "fb": "No. Accuracy hides the whole difference between them when the event is rare."}, {"t": "Almost nothing, because deterioration is rare", "s": 2, "fb": "Right. Both would score high even if they were poor. Look at recall and precision instead."}, {"t": "Tool A is better", "s": 0, "fb": "Accuracy alone cannot tell you that."}]}, {"prompt": "On your unit, a missed deterioration is far more serious than a false alarm, and staff can cope with extra checks. Which tool?", "choices": [{"t": "Tool A, with the higher recall", "s": 2, "fb": "Right. When a miss costs most and the team can absorb false alarms, recall should win."}, {"t": "Tool B, with the higher precision", "s": 1, "fb": "Fewer false alarms, but it misses two in five patients, which you said matters most."}, {"t": "Neither, because neither is perfect", "s": 0, "fb": "No tool is perfect. The choice depends on which error costs more here."}]}]}, "lab": {"type": "memory", "title": "Recall or precision?", "prompt": "Flip the cards and find each matching pair.", "pairs": [{"a": "Recall", "b": "Of the real cases, how many were caught?"}, {"a": "Precision", "b": "Of the alarms raised, how many were real?"}, {"a": "Accuracy paradox", "b": "High accuracy, zero value"}, {"a": "Tool A catches 16 of 20", "b": "Recall of 80 per cent"}, {"a": "16 of Tool A's 50 flags real", "b": "Precision of 32 per cent"}, {"a": "Tool B catches 12 of 20", "b": "Recall of 60 per cent"}], "explain": "For rare events, accuracy hides the difference. Which tool is better depends on whether a miss or a false alarm costs more on your ward."}}, {"title": "Bias is set in the design", "minutes": 2, "slides": [{"img": 8, "say": ["Imbalance is a numbers problem. Bias is different. It is a fairness problem, and it gets in at the design stage. There are four main routes.", "Selection bias is about who is in the data at all. People who never reach care are invisible to it.", "Label bias is about how the outcome was recorded. In a well known case, a tool used healthcare cost as a stand-in for healthcare need. Less had historically been spent on Black patients. So the tool decided they needed less help, and under-served them.", "Spectrum bias happens when the mix of patients in the data differs from your clinic. A referral clinic is not a screening population.", "Historical bias means past unfairness gets baked into future predictions.", "Here is an example. A tool flags patients for extra support. It learned from who received support in the past. If access was unequal, it learns to recommend support for those who already got it. It widens the very gap it was meant to close.", "Notice the fault is in the question the data answered, not in the algorithm. So bias must be checked at design. It cannot be patched on at the end.", "And always ask for results split by age, sex, ethnicity and site, not just one average."], "scene": {"type": "graph", "title": "Four routes for bias, all set at the design stage", "nodes": [{"id": "hub", "label": "Bias: set in\nthe design", "p": [0, 0.2, 1], "c": "red", "shape": "ico", "size": 1.1, "spin": true, "ls": 0.68}, {"id": "sel", "label": "Selection:\nwho is in the data", "p": [-4.4, 1.9, -0.6], "c": "amber", "shape": "cyl", "size": 0.9, "ls": 0.68}, {"id": "lab", "label": "Label: cost used as\na stand-in for need", "p": [-2.2, 3.3, -1.6], "c": "amber", "shape": "slab", "size": 0.9, "ls": 0.68}, {"id": "spec", "label": "Spectrum: case mix\nunlike your clinic", "p": [2.2, 3.3, -1.6], "c": "amber", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "hist", "label": "Historical: past\nunfairness repeated", "p": [4.4, 1.9, -0.6], "c": "amber", "shape": "torus", "size": 0.9, "ls": 0.68}, {"id": "chk", "label": "Results by age, sex,\nethnicity and site", "p": [-4.4, -0.4, 0.8], "c": "green", "shape": "shield", "size": 0.9, "ls": 0.68}], "links": [["sel", "hub"], ["lab", "hub"], ["spec", "hub"], ["hist", "hub"], ["chk", "hub"]], "steps": ["all", ["hub"], ["hub"], ["sel", "lab", "spec", "hist"], ["sel"], ["sel"], ["lab"], ["lab"], ["lab"], ["lab"], ["spec"], ["spec"], ["hist"], ["hist"], ["hist"], ["hist"], ["hist"], ["hist"], ["hub"], ["hub", "chk"], ["hub", "chk"], ["chk"]]}}], "keyPoint": "Bias enters through who is in the data and how the outcome was defined. Check it at design, and ask for results by group.", "plain": ["Selection: who is in the data at all?", "Label: was the outcome a fair stand-in? Cost is not the same as need.", "Spectrum: does the case mix match your clinic?", "Historical: past unfairness repeated as future predictions.", "Ask for results split by age, sex, ethnicity and site."], "check": {"q": "A tool used healthcare cost as a stand-in for need, and under-served Black patients. Which kind of bias is this?", "o": ["Label or measurement bias", "Selection bias", "Spectrum bias"], "a": 0, "e": "The outcome was defined badly. Cost stood in for need, and the two were not the same for every group.", "retry": {"q": "When is the best time to look for bias in an AI tool?", "o": ["After it has gone live", "At the design stage", "Never, bias cannot be found"], "a": 1, "e": "Bias comes from the question the data answered, so it must be examined at design, not patched at the end."}}, "scenario": {"title": "The community support tool", "setting": "Your integrated care board is offered a tool to pick patients for extra community support. It learned from five years of records of who received support in the past.", "steps": [{"prompt": "What is the main worry?", "choices": [{"t": "The tool may just recommend support for groups who already got it", "s": 2, "fb": "Right. If past access was unequal, the tool learns the unfairness and repeats it."}, {"t": "Five years is not enough data", "s": 0, "fb": "The amount is not the issue. The question the data answered is."}, {"t": "The tool may be slow", "s": 0, "fb": "Speed is not the concern here."}]}, {"prompt": "What do you ask the supplier for?", "choices": [{"t": "A faster version", "s": 0, "fb": "Not relevant."}, {"t": "Results split by age, sex, ethnicity and area", "s": 2, "fb": "Right. One average hides who the tool serves badly."}, {"t": "A promise that the algorithm is fair", "s": 1, "fb": "A promise is not evidence. Ask for the results by group."}]}]}, "lab": {"type": "sort", "title": "Name that bias", "prompt": "Drag each example into the type of bias it shows.", "buckets": ["Selection", "Label", "Spectrum", "Historical"], "items": [{"t": "People who never reach care are invisible to the data", "b": 0, "why": "Selection bias is about who is in the data at all."}, {"t": "Who is in the data at all?", "b": 0, "why": "This is the selection question."}, {"t": "Healthcare cost used as a stand-in for healthcare need", "b": 1, "why": "The outcome label was not a fair stand-in for need."}, {"t": "The outcome was recorded in a way that is not fair", "b": 1, "why": "Label bias is about how the outcome was recorded."}, {"t": "A tool built in a referral clinic used for screening", "b": 2, "why": "A referral clinic is not a screening population."}, {"t": "The mix of patients in the data differs from your clinic", "b": 2, "why": "That is the definition of spectrum bias."}, {"t": "Learns to recommend support for those who already got it", "b": 3, "why": "Past unequal access is repeated in future predictions."}, {"t": "Past unfairness baked into future predictions", "b": 3, "why": "That is the definition of historical bias."}], "explain": "The fault is in the question the data answered, not the algorithm. Check bias at design and ask for results by age, sex, ethnicity and site."}}, {"title": "Does it travel, and did it cheat?", "minutes": 3, "slides": [{"img": 9, "say": ["How do we know a tool really works? We test it on harder and harder data. Follow the pipeline from left to right.", "First, internal validation. The team splits its own data and tests on the part it held back. This only catches a tool that memorised its training cases. It cannot show whether the tool travels.", "External validation does. A different time, a different hospital, or a different system. Performance almost always drops here.", "A tool can pass one and fail another. Still accurate next year at the same hospital, yet failing today across the city. So when you hear externally validated, ask: which kind?", "Underneath sits reproducibility. Unless the data, code and settings are written down, nobody can rebuild or check the result."], "scene": {"type": "stairs", "title": "Test on harder and harder data: internal, then external, on a base of reproducibility", "levels": [{"label": "Base: data, code\nand settings written", "c": "slate"}, {"label": "Internal:\nown held-back data", "c": "amber"}, {"label": "External:\nnew time", "c": "cyan"}, {"label": "External:\nnew hospital", "c": "cyan"}, {"label": "External:\nnew system", "c": "green"}], "steps": ["all", "all", "all", 1, 1, 1, 1, 2, 4, 4, 2, 3, "all", 0, 0]}}, {"img": 11, "say": ["Now the commonest way good results mislead: leakage. Information the tool could not have at the moment of prediction sneaks into its training.", "Three forms. The same patient in both training and test data. Preparing the whole dataset before splitting it. And a clue that secretly holds the answer, like a treatment given only after the diagnosis.", "The defence: split first, by patient, site or time. Do everything else inside the training part only. Trust external testing most.", "If a result looks too good to be true, suspect leakage and ask how the data were divided."], "scene": {"type": "graph", "title": "Leakage: the answer sneaks into training, so results look too good", "nodes": [{"id": "leak", "label": "Leakage", "p": [0, 0.2, 1], "c": "red", "shape": "ico", "size": 1.1, "spin": true}, {"id": "same", "label": "Same patient in\ntraining and test", "p": [-4.4, 1.9, -0.6], "c": "red", "shape": "sphere", "size": 0.9, "ls": 0.68}, {"id": "prep", "label": "Whole dataset\nprepared, then split", "p": [0, 3.2, -1.6], "c": "red", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "clue", "label": "A clue that holds\nthe answer", "p": [4.4, 1.9, -0.6], "c": "red", "shape": "cyl", "size": 0.9, "ls": 0.68}, {"id": "def", "label": "Split first: by\npatient, site or time", "p": [-4.4, -0.4, 0.8], "c": "green", "shape": "shield", "size": 0.9, "ls": 0.68}, {"id": "ext", "label": "Trust external\ntesting most", "p": [4.4, -0.4, 0.8], "c": "green", "shape": "shield", "size": 0.9, "ls": 0.68}], "links": [["same", "leak"], ["prep", "leak"], ["clue", "leak"], ["def", "leak"], ["ext", "leak"]], "steps": [["leak"], ["leak"], ["same", "prep", "clue"], ["same"], ["prep"], ["clue"], ["def"], ["def"], ["ext"], "all"]}}], "keyPoint": "Internal testing only catches memorising. Ask which kind of external test was done, and if results look too good, suspect leakage.", "plain": ["Internal validation: tested on its own data. Proves little.", "External validation: a new time, a new place or a new system. Ask which.", "Leakage: the answer sneaks into training, so results look brilliant then collapse.", "Too good to be true? Ask how the data were split."], "check": {"q": "A tool still works well on next year's data at the hospital that built it. Your hospital across the city wants it. What should you ask?", "o": ["Has it been tested at a different site, not just a later time?", "Nothing, it is externally validated", "How many layers does it have?"], "a": 0, "e": "Passing a test over time is not the same as passing a test at a new place. Ask which kind of external test was done.", "retry": {"q": "A team reports near-perfect results. The same patients appear in both the training and the test data. What is this?", "o": ["Good practice", "Leakage", "External validation"], "a": 1, "e": "The tool memorised individuals. That is leakage, and the result is not real."}}, "scenario": {"title": "The 99 per cent paper", "setting": "At journal club a registrar presents a paper. A tool predicts a diagnosis with 99 per cent accuracy. One of its inputs is a drug that is only prescribed after that diagnosis is made.", "steps": [{"prompt": "What is your first thought?", "choices": [{"t": "Impressive, we should adopt it", "s": 0, "fb": "Too good to be true usually is. Look at how the result was produced."}, {"t": "That drug gives away the answer, so this is leakage", "s": 2, "fb": "Right. The tool would never have that information at the moment of prediction."}, {"t": "The sample was probably too small", "s": 1, "fb": "Maybe, but the bigger problem is a clue that holds the answer."}]}, {"prompt": "The authors say it was 'validated'. What do you ask?", "choices": [{"t": "Was it tested on data from another time or place, and how were the data split?", "s": 2, "fb": "Right. Internal testing cannot show whether a tool travels, and the split reveals leakage."}, {"t": "Which journal published it?", "s": 0, "fb": "Not a question about evidence."}, {"t": "Was it tested on the same data it learned from?", "s": 1, "fb": "Useful, but you also need to know whether it was tested anywhere new."}]}]}, "lab": {"type": "spot", "title": "The 99 per cent paper", "prompt": "A registrar presents this paper at journal club. Tap every part that is a warning sign.", "parts": [{"lbl": "Headline", "t": "The tool predicts the diagnosis with 99 per cent accuracy.", "bad": true, "why": "A result that looks too good to be true should make you suspect leakage."}, {"lbl": "Inputs", "t": "One input is a drug only prescribed after the diagnosis is made.", "bad": true, "why": "That clue secretly holds the answer, so the tool could not have it at the moment of prediction."}, {"lbl": "Methods", "t": "The whole dataset was prepared first, then split into training and test.", "bad": true, "why": "Preparing the whole dataset before splitting is a form of leakage."}, {"lbl": "Methods", "t": "Data were split by patient, so no patient is in both sets.", "bad": false, "why": "Splitting by patient is part of the defence against leakage."}, {"lbl": "Testing", "t": "Tested only on held-back data from the same hospital.", "bad": true, "why": "Internal validation cannot show whether the tool travels."}, {"lbl": "Methods", "t": "The data, code and settings are written down for others to check.", "bad": false, "why": "This makes the result reproducible, so others can rebuild and check it."}], "explain": "If a result looks too good to be true, ask how the data were divided, and trust external testing most."}}, {"title": "Do the risks match reality?", "minutes": 2, "slides": [{"img": 10, "say": ["There are two different ways a risk tool can be good.", "Discrimination asks: can it rank sicker patients above less sick ones? That is the area under the curve, the number people love to quote.", "Calibration asks something different. When it says ten per cent risk, does the event really happen to about ten in a hundred such patients?", "On the plot, the dashed diagonal is perfect calibration. Predicted risk equals what happened. The red curve is an over-confident tool. It says high risk, but the real rate is lower, so it sags below the line.", "Why does this matter at the bedside? Suppose a tool says ten per cent, but only three in a hundred patients actually have the event. The ranking may be fine. Yet every risk it quotes is about three times too high.", "A clinician counselling patients on those numbers acts on a false picture, and over-treats.", "The good news. You can recalibrate the tool to your local patients without rebuilding it. It is routine, but easily forgotten when a tool moves between hospitals.", "So never settle for the area under the curve alone. Ask whether the risks match reality."], "scene": {"type": "bars", "title": "Calibration: the tool says 10 per cent, but only 3 in 100 have the event", "scale": 0.4, "bars": [{"id": "said", "label": "Tool says\nrisk %", "v": 10, "p": [-2.2, 0], "c": "red"}, {"id": "real", "label": "Really happens\nper 100", "v": 3, "p": [2.2, 0], "c": "green"}], "axes": [{"t": "Same group of patients", "p": [0, -2.2, 1.6]}], "steps": ["all", "all", "all", "all", ["said", "real"], "all", "all", ["said"], ["said", "real"], "all", ["said", "real"], "all", ["said"], ["said"], "all", ["real"], "all", "all", "all"]}}], "keyPoint": "Ranking patients well is not the same as getting the risks right. A tool that says ten per cent should be right about ten times in a hundred.", "plain": ["Discrimination: can it put sicker patients above less sick ones?", "Calibration: when it says ten per cent, does it happen ten times in a hundred?", "A tool can rank perfectly and still overstate every risk.", "Recalibrate to local patients when a tool moves. No rebuild needed."], "check": {"q": "A tool predicts 10 per cent risk for a group in which only 3 per cent have the event. What is the problem?", "o": ["Poor discrimination", "Poor calibration, so the risks are overstated", "Leakage"], "a": 1, "e": "The ranking may be fine, but the risks are about three times too high. That is a calibration problem, fixed by recalibrating locally.", "retry": {"q": "A tool says a patient has a 70 per cent risk. If it is well calibrated, what should you expect?", "o": ["About 70 in 100 such patients have the event", "The tool is 70 per cent accurate", "The patient certainly has the event"], "a": 0, "e": "Calibration means the stated risk matches how often the event really happens."}}, "scenario": {"title": "Counselling on a risk score", "setting": "A new surgical risk tool, built in another country, tells patients their risk of a complication. The surgical audit lead notices it quotes 10 per cent for a group where your audit shows 3 per cent.", "steps": [{"prompt": "A consultant says 'but its area under the curve is excellent, so it must be fine'. What is wrong with that?", "choices": [{"t": "Nothing, a high area under the curve means the risks are right", "s": 0, "fb": "No. Ranking well and quoting the right number are different things."}, {"t": "Ranking well does not mean the quoted risks are right", "s": 2, "fb": "Right. Good discrimination with poor calibration still misleads patients."}, {"t": "The area under the curve must have been calculated wrongly", "s": 0, "fb": "No reason to think so. Ranking and calibration are separate."}]}, {"prompt": "What is the practical fix?", "choices": [{"t": "Scrap the tool and build a new one", "s": 0, "fb": "Not needed. The ranking is sound."}, {"t": "Recalibrate it to your own patients", "s": 2, "fb": "Right. Recalibration adjusts the numbers without rebuilding the tool."}, {"t": "Tell patients to divide the number by three", "s": 1, "fb": "Crude and error-prone. Recalibrate the tool properly instead."}]}]}, "lab": {"type": "sort", "title": "Ranking or risk?", "prompt": "Drag each card to discrimination (ranking) or calibration (are the risks right?).", "buckets": ["Discrimination", "Calibration"], "items": [{"t": "Can it rank sicker patients above less sick ones?", "b": 0}, {"t": "Area under the curve", "b": 0}, {"t": "The number people love to quote", "b": 0}, {"t": "Says 10 per cent: do about 10 in 100 have the event?", "b": 1}, {"t": "The dashed diagonal on the plot", "b": 1}, {"t": "An over-confident tool sags below the line", "b": 1}, {"t": "Every risk it quotes is about three times too high", "b": 1}, {"t": "Fixed for local patients without rebuilding the tool", "b": 1, "why": "Recalibration puts the risks right for your patients."}], "explain": "A tool can rank patients well and still get every risk wrong. Never settle for the area under the curve alone: ask whether the risks match reality."}}, {"title": "The ladder of evidence", "minutes": 3, "slides": [{"img": 12, "say": ["Medicine ranks evidence by how well a study controls bias. Clinical AI needs the same discipline. Read the pyramid from the bottom up.", "At the base, testing on past data the team already had. Necessary, but weak. Next, external validation at a new place or time.", "Then a silent trial. The tool runs on real patients in real time, but nobody acts on it yet.", "Above that, a randomised trial. Does using the tool improve what happens to patients? At the top, a review that pools good studies.", "Each rung has its own reporting checklist. TRIPOD plus AI and PROBAST for building and judging a model. DECIDE-AI for early live testing. SPIRIT-AI and CONSORT-AI for trials.", "A supplier's score of nought point nine four means very different things on different rungs. Ask where on the pyramid it sits.", "Most clinical AI never leaves the bottom rungs. One widely used sepsis tool, finally tested externally, did far worse than its reputation."], "scene": {"type": "stairs", "title": "The evidence ladder: ask which rung a study sits on", "levels": [{"label": "Past data the\nteam already had", "c": "slate"}, {"label": "External\nvalidation", "c": "cyan"}, {"label": "Silent trial", "c": "cyan"}, {"label": "Randomised trial", "c": "green"}, {"label": "Review pooling\ngood studies", "c": "green"}], "steps": ["all", "all", "all", 0, 0, 1, 2, 2, 3, 3, 4, "all", 0, 2, 3, "all", "all", 1, 1]}}, {"img": 15, "say": ["The checklists help a great deal. But a study can tick every box and still describe a biased tool tested only on its own data.", "The checklist makes that visible. You must act on it.", "Use them in order. Name the study design, apply the matching checklist, judge the risk of bias, then check the numbers against the decision. They shape judgement. They do not replace it."], "scene": {"type": "graph", "title": "Checklists make weaknesses visible: you must still act on them", "nodes": [{"id": "des", "label": "1. Name the\nstudy design", "p": [-4.5, 1, 0], "c": "cyan", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "chk", "label": "2. Apply the\nmatching checklist", "p": [-1.5, 1, 0], "c": "cyan", "shape": "slab", "size": 0.9, "ls": 0.68}, {"id": "bias", "label": "3. Judge the\nrisk of bias", "p": [1.5, 1, 0], "c": "amber", "shape": "cyl", "size": 0.9, "ls": 0.68}, {"id": "num", "label": "4. Check numbers\nagainst the decision", "p": [4.5, 1, 0], "c": "green", "shape": "shield", "size": 0.9, "ls": 0.68}, {"id": "jud", "label": "Your judgement:\nshaped, not replaced", "p": [0, 3.2, -1.6], "c": "violet", "shape": "ico", "size": 1.0, "spin": true, "ls": 0.68}], "links": [["des", "chk"], ["chk", "bias"], ["bias", "num"], ["jud", "chk"], ["jud", "num"]], "steps": ["all", ["chk"], ["chk"], ["jud"], ["des", "chk", "bias", "num"], ["des", "chk", "bias", "num"], ["jud"], "all"]}}], "keyPoint": "Ask where a study sits on the evidence ladder. Checklists make weaknesses visible, but you must act on them.", "plain": ["Bottom rung: tested on its own past data. Top rung: trials showing patients do better.", "The same score means different things on different rungs.", "A silent trial runs the tool live without acting on it.", "Checklists like TRIPOD plus AI make flaws visible. They do not remove them."], "check": {"q": "A tool runs silently on live admissions for three months without changing care. Where is this on the evidence ladder?", "o": ["Testing on past data", "A silent, prospective trial", "A randomised trial"], "a": 1, "e": "Running live without acting on it is a silent or shadow trial. It sits above past-data testing but below a randomised trial.", "retry": {"q": "Which study design shows whether using a tool actually improves patient outcomes?", "o": ["Testing on the team's own past data", "External validation", "A randomised trial"], "a": 2, "e": "Only a trial where the tool is used shows whether patients do better, not just whether predictions are accurate."}}, "scenario": {"title": "The board paper", "setting": "A board paper proposes buying a sepsis tool. Its evidence section says: 'Area under the curve 0.94, fully compliant with the TRIPOD plus AI reporting checklist.'", "steps": [{"prompt": "What does the checklist compliance tell you?", "choices": [{"t": "The tool is proven to work", "s": 0, "fb": "No. A checklist makes the study clear to read. It does not make the tool good."}, {"t": "The study is clearly reported, but could still describe a weak tool", "s": 2, "fb": "Right. Compliance is a floor, not a guarantee."}, {"t": "The tool has passed a randomised trial", "s": 0, "fb": "No. TRIPOD plus AI covers model development, not trials."}]}, {"prompt": "What do you ask before the vote?", "choices": [{"t": "Which rung of the ladder does the 0.94 come from?", "s": 2, "fb": "Right. The same number means very different things at different rungs."}, {"t": "Who designed the logo?", "s": 0, "fb": "Not relevant."}, {"t": "Is 0.94 higher than the competitor?", "s": 1, "fb": "Comparing scores is pointless until you know how each was obtained."}]}]}, "lab": {"type": "order", "title": "Climb the evidence ladder", "prompt": "Put these kinds of evidence in order, from the bottom rung (weakest) to the top.", "items": ["Testing on past data the team already had", "External validation at a new place or time", "Silent trial: runs live, but nobody acts on it", "Randomised trial: do patients do better?", "Review that pools good studies"], "explain": "The same score means very different things on different rungs, and most clinical AI never leaves the bottom rungs. Always ask where a study sits."}}, {"title": "Four bedside numbers", "minutes": 3, "slides": [{"img": 13, "say": ["Every number here comes from one table: what the tool predicted, against what was true.", "Sensitivity: of the people with the disease, how many did we catch? It matters most when missing a case is dangerous.", "Specificity: of the people without it, how many did we rightly clear? It matters when false alarms are costly.", "Positive predictive value: if the tool flags someone, how likely is it real? That is the bedside question when an alarm fires.", "Negative predictive value: if it clears someone, how safe is that reassurance?"], "scene": {"type": "graph", "title": "Four bedside numbers, all from one table: predicted against true", "nodes": [{"id": "tab", "label": "Predicted vs\nwhat was true", "p": [0, 0.2, 1], "c": "cyan", "shape": "slab", "size": 1.1, "ls": 0.68}, {"id": "sens", "label": "Sensitivity:\nill people caught", "p": [-4.4, 1.9, -0.6], "c": "green", "shape": "sphere", "size": 0.9, "ls": 0.68}, {"id": "spec", "label": "Specificity:\nwell people cleared", "p": [-2.2, 3.3, -1.6], "c": "amber", "shape": "sphere", "size": 0.9, "ls": 0.68}, {"id": "ppv", "label": "PPV: flagged, how\nlikely is it real?", "p": [2.2, 3.3, -1.6], "c": "violet", "shape": "ico", "size": 0.9, "ls": 0.68}, {"id": "npv", "label": "NPV: cleared, how\nsafe is that?", "p": [4.4, 1.9, -0.6], "c": "green", "shape": "shield", "size": 0.9, "ls": 0.68}], "links": [["tab", "sens"], ["tab", "spec"], ["tab", "ppv"], ["tab", "npv"]], "steps": ["all", ["sens"], ["sens"], ["spec"], ["spec"], ["ppv"], ["ppv"], ["npv"]]}}, {"img": 14, "say": ["The last two move with how common the condition is. Keep the test fixed at ninety per cent sensitivity and ninety per cent specificity.", "Where one in ten people have the condition, about half the alarms are real. Where one in a hundred have it, more than nine in ten alarms are false.", "The test has not changed. Only the patients have. So a tool proven in a referral clinic can mislead badly in screening. Always ask how common the condition was when that was measured."], "scene": {"type": "graph", "title": "Same test, different patients: rarer conditions mean more false alarms", "nodes": [{"id": "test", "label": "Same test: 90%\nsensitivity and\nspecificity", "p": [0, 0.2, 1], "c": "cyan", "shape": "ico", "size": 1.1, "spin": true, "ls": 0.62}, {"id": "ten", "label": "1 in 10 have it:\nabout half of\nalarms real", "p": [-4.4, 1.9, -0.6], "c": "amber", "shape": "cyl", "size": 0.9, "ls": 0.62}, {"id": "hund", "label": "1 in 100 have it:\nover 9 in 10\nalarms false", "p": [4.4, 1.9, -0.6], "c": "red", "shape": "cyl", "size": 0.9, "ls": 0.62}, {"id": "clin", "label": "Proven in a\nreferral clinic", "p": [-2.2, 3.4, -1.6], "c": "slate", "shape": "box", "size": 0.8, "ls": 0.68}, {"id": "scr", "label": "Can mislead\nbadly in screening", "p": [2.2, 3.4, -1.6], "c": "red", "shape": "torus", "size": 0.8, "ls": 0.68}], "links": [["test", "ten"], ["test", "hund"], ["clin", "scr"]], "steps": [["ten", "hund"], ["test"], ["test", "ten"], ["test", "hund"], ["test"], ["ten", "hund"], ["clin", "scr"], "all"]}}, {"img": 16, "say": ["To finish, six questions for any AI claim. Where did the data come from? Could imbalance or bias distort it? Was it tested where it will be used? Do its risks match reality? How strong is the evidence? Which number matters here?", "A modest tool, well tested for a narrow job and watched in use, beats an ambitious one resting on one past result.", "Well done. Now try the final case test."], "scene": {"type": "stairs", "title": "Six questions for any AI claim", "flat": true, "levels": [{"label": "Where did the\ndata come from?", "c": "cyan"}, {"label": "Imbalance\nor bias?", "c": "red"}, {"label": "Tested where\nit will be used?", "c": "amber"}, {"label": "Risks match\nreality?", "c": "amber"}, {"label": "How strong is\nthe evidence?", "c": "violet"}, {"label": "Which number\nmatters here?", "c": "green"}], "steps": ["all", 0, 1, 2, 3, 4, 5, "all", "all", "all"]}}], "keyPoint": "When an alarm fires, ask how likely it is real. That answer depends on how common the condition is where you work.", "plain": ["Sensitivity: of the ill, how many caught? Specificity: of the well, how many cleared?", "Positive predictive value: if flagged, how likely is disease?", "The rarer the condition, the more alarms are false, even with the same test.", "Six questions: data, bias, tested where used, risks match, evidence rung, right number at this prevalence."], "check": {"q": "A screening tool has 90 per cent sensitivity and specificity. Only 1 in 100 people have the disease. Roughly how many alarms are false?", "o": ["About one in ten", "About half", "More than nine in ten"], "a": 2, "e": "At one in a hundred, only about eight in a hundred alarms are real. The rest are false, though the test is unchanged.", "retry": {"q": "An alarm fires on your patient. Which number tells you how likely it is that the patient really has the condition?", "o": ["Positive predictive value", "Sensitivity", "Specificity"], "a": 0, "e": "Positive predictive value answers the bedside question: if flagged, how likely is disease?"}}, "scenario": {"title": "From the clinic to the screening van", "setting": "A heart failure detection tool worked well in a specialist clinic, where three in ten patients had the condition. Your practice wants to use it to screen everyone over 65, where about one in fifty has it.", "steps": [{"prompt": "What will happen to the alarms?", "choices": [{"t": "Most will still be real", "s": 0, "fb": "No. With a rare condition, false alarms outnumber real ones."}, {"t": "Most will be false, even though the tool is unchanged", "s": 2, "fb": "Right. Predictive value falls as the condition gets rarer."}, {"t": "The tool will stop working completely", "s": 0, "fb": "It still works. It just produces far more false alarms."}]}, {"prompt": "What do you ask the supplier?", "choices": [{"t": "What is the accuracy?", "s": 0, "fb": "Accuracy hides the problem."}, {"t": "Of people flagged in a practice like ours, how many really have it?", "s": 2, "fb": "Right. That is positive predictive value at your prevalence."}, {"t": "How quickly does it give a result?", "s": 1, "fb": "Useful later. First find out how many alarms will be false."}]}]}, "lab": {"type": "match", "title": "Four bedside numbers", "prompt": "Match each number to the question it answers.", "pairs": [{"a": "Sensitivity", "b": "Of the people with the disease, how many did we catch?"}, {"a": "Specificity", "b": "Of the people without it, how many did we rightly clear?"}, {"a": "Positive predictive value", "b": "If the tool flags someone, how likely is it real?"}, {"a": "Negative predictive value", "b": "If it clears someone, how safe is that reassurance?"}], "explain": "When an alarm fires, ask how likely it is real, and remember that answer depends on how common the condition is where you work."}}], "test": [{"q": "A supplier says their tool must be good because 400 hospitals use it. Best response?", "o": ["Ask for the data and the testing behind it, because being in use is not evidence", "Agree, wide use is proof", "Accept it if it is also approved"], "a": 0, "e": "Being in use and being approved are not the same as being proven.", "lesson": 0}, {"q": "A team adds five more years of data from the same unusual hospital to fix bias. What happens?", "o": ["The bias gets louder, not fixed", "The bias disappears", "The tool becomes fair"], "a": 0, "e": "Scale magnifies whatever is in the data, bias included.", "lesson": 0}, {"q": "A tool built at one trust reads a lab value in a unit your trust does not use. What is the risk?", "o": ["Nothing, computers convert units automatically", "It may read every value wrongly without any warning", "It will refuse to run"], "a": 1, "e": "A unit mismatch silently breaks the tool. Shared codes and units fix this.", "lesson": 1}, {"q": "A hospital changed its coding rules halfway through the data used to build a tool, and nobody recorded it. Which quality check has failed?", "o": ["Timeliness", "Completeness", "Provenance"], "a": 2, "e": "Provenance is knowing where each value came from and what changed. An unrecorded change shifts inputs silently.", "lesson": 2}, {"q": "A tool for a condition affecting 5 in 100 patients reports 95 per cent accuracy. What could explain this with no clinical value at all?", "o": ["It may simply say 'no disease' for everyone", "It must be very well calibrated", "It must have been tested externally"], "a": 0, "e": "Predicting the common answer scores high and catches no cases: the accuracy paradox.", "lesson": 3}, {"q": "A tool to pick patients for extra support learned from who got support in the past, when access was unequal. Most likely result?", "o": ["It may widen the existing gap", "It will close the gap", "Its only problem is class imbalance"], "a": 0, "e": "Historical bias in the data is repeated as future predictions.", "lesson": 4}, {"q": "A team fills in missing values across the whole dataset, then splits it into training and test, and reports near-perfect results. Suspect first…", "o": ["Spectrum bias", "Poor timeliness", "Leakage"], "a": 2, "e": "Preparing data before the split lets test information leak into training.", "lesson": 5}, {"q": "A tool was 'externally validated' on next year's data at the same hospital. A neighbouring trust wants it now. What should they ask?", "o": ["Nothing more, it is externally validated", "Was it cross-validated on its own data?", "Was it tested at a different site, not just a later time?"], "a": 2, "e": "A tool can pass a test over time and fail a test at a new place. Ask which kind was done.", "lesson": 5}, {"q": "A tool ranks patients very well but says 20 per cent risk where only 7 in 100 have the event. Main clinical risk?", "o": ["It will rank patients in the wrong order", "Over-treatment driven by wrong risk numbers", "It will run slowly"], "a": 1, "e": "Good ranking with poor calibration means the stated risks are wrong, so patients may be over-treated.", "lesson": 6}, {"q": "A team has run a randomised trial of an AI alert and is writing it up. Which checklist fits?", "o": ["CONSORT-AI", "TRIPOD plus AI", "PROBAST"], "a": 0, "e": "CONSORT-AI covers reports of AI trials. TRIPOD plus AI covers building and validating models.", "lesson": 7}, {"q": "A colleague says any randomised trial outranks any other study. What limit applies to the evidence ladder?", "o": ["It is coarse, so a poorly run trial can outrank a strong study of another kind", "It only applies to imaging tools", "It has been replaced by TRIPOD plus AI"], "a": 0, "e": "The ladder ranks designs, not quality. It shapes judgement but does not replace it.", "lesson": 7}, {"q": "An alarm fires on your patient. You want to know how likely it is that they really have the condition. Which number?", "o": ["Sensitivity", "Specificity", "Positive predictive value"], "a": 2, "e": "Positive predictive value answers: if flagged, how likely is disease?", "lesson": 8}, {"q": "A test with 90 per cent sensitivity and specificity moves from a clinic where 1 in 10 are ill to screening where 1 in 100 are ill. Its positive predictive value…", "o": ["Falls from about half to under one in ten", "Stays the same, the test is unchanged", "Rises, because fewer people are ill"], "a": 0, "e": "Predictive value depends on how common the condition is. Rarer means more false alarms.", "lesson": 8}]};
