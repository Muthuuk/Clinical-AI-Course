ed.", "Examples first: the machine learns from past cases. Powerful, but it can learn the wrong lesson.", "The 'ward seven' shortcut: a pattern that worked in one hospital and failed in another."], "check": {"q": "A sepsis model learned that 'ward seven' predicts sepsis. What is the best description?", "o": ["A shortcut that may fail at another hospital", "Proof that ward seven causes sepsis", "A typing error by the developers"], "a": 0, "e": "The model found a pattern, not a cause. Ward seven admitted the sickest patients at one hospital only.", "retry": {"q": "Why does a learned tool need watching after it goes live?", "o": ["Because computers wear out", "Because it may have learned patterns that do not hold for your patients", "It does not need watching"], "a": 1, "e": "A learned tool copies the patterns in its examples. Some may not hold in your setting."}}, "scenario": {"title": "Choosing a sepsis alert", "setting": "Your ward is choosing a sepsis alert. Option A is a rule set written by your consultants. Option B is a learned model from a large teaching hospital abroad.", "steps": [{"prompt": "The supplier of option B says it was 'trained on 40,000 admissions'. What do you ask first?", "choices": [{"t": "How fast does it run?", "s": 0, "fb": "Speed rarely matters here. The real question is whether its examples look like your patients."}, {"t": "Were those patients like ours?", "s": 2, "fb": "Right. A learned tool copies its examples. If they are not like your patients, it may fail."}, {"t": "What colour is the screen?", "s": 0, "fb": "No. Look at where the examples came from."}]}, {"prompt": "Nobody in your trust can monitor a learned model after go-live. Which option is safer?", "choices": [{"t": "Option A, the written rules", "s": 2, "fb": "Right. Rules do not drift. Without monitoring, a learned model can fail quietly."}, {"t": "Option B, the learned model", "s": 0, "fb": "Risky. A learned model needs someone watching it after go-live."}, {"t": "Either is equally safe", "s": 0, "fb": "No. The learned model needs ongoing checks that the rule set does not."}]}]}, "lab": {"type": "sort", "title": "Rules or examples?", "prompt": "Sort each card: does it describe rules-first software or a tool that learns from examples?", "buckets": ["Rules first (ordinary software)", "Examples first (machine learning)"], "items": [{"t": "A person writes every rule", "b": 0}, {"t": "Everything it does was decided in advance", "b": 0}, {"t": "Easy to check, but misses the unexpected", "b": 0}, {"t": "Often better where rules are known and stakes are high", "b": 0, "why": "Where the rules are known and stakes are high, hand-written rules are often better."}, {"t": "Works out the rules from thousands of examples", "b": 1}, {"t": "Learns the way a registrar learns from patients", "b": 1}, {"t": "Can read a chest film", "b": 1, "why": "Nobody could write those rules by hand, so it has to learn them from examples."}, {"t": "May learn that 'ward seven' means sepsis", "b": 1, "why": "A learned tool copies patterns in its examples, including shortcuts."}, {"t": "Needs watching after it goes live", "b": 1, "why": "A learned tool is only as good as its examples, so it must be watched."}], "explain": "Ordinary software is given the rules. Machine learning works them out from examples, so it is only as good as those examples."}}, {"title": "Three ways a machine learns", "minutes": 2, "slides": [{"img": 10, "say": ["Machines learn in three main ways.", "The first is supervised learning. It learns from examples that already have the right answer, like mammograms marked 'recall' or 'no recall'. Most diagnostic AI works this way. Ask: who marked the answers, and how carefully?", "The second is unsupervised learning. It gets no answers at all. It just looks for groups, such as types of heart failure nobody had named. Ask: do these groups mean anything for patients?", "The third is reinforcement learning. It learns by trying things and seeing what happens, a bit like adjusting insulin doses over time. Ask: where did it do its trying? If the answer is 'on real patients', stop.", "Knowing the type of learning tells you which question to ask."], "scene": {"type": "graph", "title": "Three ways a machine learns, and the question to ask for each", "nodes": [{"id": "sup", "label": "Supervised\nmarked answers", "p": [-4.2, 2.8, -0.8], "c": "cyan", "shape": "box", "size": 1.0, "ls": 0.7}, {"id": "uns", "label": "Unsupervised\nfinds groups", "p": [0, 2.8, -0.8], "c": "pink", "shape": "ico", "size": 1.0, "ls": 0.7}, {"id": "rl", "label": "Reinforcement\ntrial and error", "p": [4.2, 2.8, -0.8], "c": "amber", "shape": "torus", "size": 1.0, "ls": 0.7}, {"id": "qs", "label": "Who marked\nthe answers?", "p": [-4.2, 0.3, 0.8], "c": "slate", "shape": "cyl", "size": 0.9, "ls": 0.7}, {"id": "qu", "label": "Do the groups\nmean anything?", "p": [0, 0.3, 0.8], "c": "slate", "shape": "cyl", "size": 0.9, "ls": 0.7}, {"id": "qr", "label": "Where did it try?\nReal patients: stop", "p": [4.2, 0.3, 0.8], "c": "red", "shape": "shield", "size": 0.9, "ls": 0.65}], "links": [["sup", "qs"], ["uns", "qu"], ["rl", "qr"]], "steps": ["all", ["sup"], ["sup"], ["sup"], ["sup", "qs"], ["uns"], ["uns"], ["uns"], ["uns", "qu"], ["rl"], ["rl"], ["rl", "qr"], ["qr"], "all"]}}], "keyPoint": "Supervised learns from marked answers, unsupervised finds groups, reinforcement learns by trial and error. Each needs a different question.", "plain": ["Supervised: learns from examples with answers. Ask who marked them.", "Unsupervised: finds groups with no answers. Ask if the groups mean anything.", "Reinforcement: learns by trying. Ask where the trying happened."], "check": {"q": "A tool learns from 200,000 mammograms, each marked 'recall' or 'no recall'. What kind of learning is this?", "o": ["Unsupervised", "Reinforcement", "Supervised"], "a": 2, "e": "It learns from examples with the answer attached, so it is supervised. Ask who marked them.", "retry": {"q": "A tool groups patients with no answers given. What kind of learning is this?", "o": ["Supervised", "Unsupervised", "Reinforcement"], "a": 1, "e": "No answers, just finding groups: that is unsupervised learning."}}, "scenario": {"title": "The insulin dosing tool", "setting": "A company offers a tool that learned the best insulin doses by trying different doses and seeing glucose results.", "steps": [{"prompt": "What kind of learning is this?", "choices": [{"t": "Reinforcement learning", "s": 2, "fb": "Right. It learned by trying actions and seeing results."}, {"t": "Supervised learning", "s": 0, "fb": "No. Nobody gave it the right dose in advance."}, {"t": "Unsupervised learning", "s": 0, "fb": "No. It was not just finding groups."}]}, {"prompt": "Which question matters most?", "choices": [{"t": "How many doses did it try?", "s": 1, "fb": "Useful, but the key point is where it tried them."}, {"t": "Where did it do its trial and error?", "s": 2, "fb": "Right. If it experimented on real patients, that is a safety concern."}, {"t": "Is it cloud-based?", "s": 0, "fb": "Not the main issue. Ask how and where it learned."}]}]}, "lab": {"type": "rush", "title": "Name that learning", "seconds": 60, "prompt": "Beat the clock: drop each card on the type of learning it describes.", "buckets": ["Supervised", "Unsupervised", "Reinforcement"], "items": [{"t": "Mammograms marked 'recall' or 'no recall'", "b": 0}, {"t": "Learns from examples with the right answer", "b": 0}, {"t": "Most diagnostic AI works this way", "b": 0}, {"t": "Ask: who marked the answers?", "b": 0}, {"t": "Gets no answers at all", "b": 1}, {"t": "Finds types of heart failure nobody had named", "b": 1}, {"t": "Groups patients into new types", "b": 1}, {"t": "Ask: do the groups mean anything?", "b": 1}, {"t": "Learns by trying things and seeing what happens", "b": 2}, {"t": "Learns insulin doses by trying them", "b": 2}, {"t": "Ask: where did it do its trying?", "b": 2}, {"t": "Tried on real patients? Stop.", "b": 2}], "explain": "Supervised learns from marked answers, unsupervised finds groups, reinforcement learns by trial and error. Each needs a different question."}}, {"title": "A tool needs watching", "minutes": 2, "slides": [{"img": 12, "say": ["A clinical AI tool is built in six steps: collect the data, clean and label it, train the tool, test it on new data, put it into use, and then keep watching it.", "That last step, watching, is the one most often forgotten.", "Here is why it matters. A deterioration score learned from patients before 2020. In 2021 it started raising far too many alarms. Nothing in the software had changed. The patients and the way staff recorded things had changed.", "Someone was watching, so they spotted it and retrained the tool. Without that, staff would slowly have stopped trusting the alarms. That is the more dangerous failure.", "So when a tool arrives on your ward, ask one simple question. Who is watching it?"], "scene": {"type": "stairs", "title": "Six steps to build a tool, and the last one, watching, is most often forgotten", "flat": false, "levels": [{"label": "1. Collect\nthe data", "c": "slate"}, {"label": "2. Clean and\nlabel it", "c": "slate"}, {"label": "3. Train\nthe tool", "c": "cyan"}, {"label": "4. Test on\nnew data", "c": "cyan"}, {"label": "5. Put it\ninto use", "c": "green"}, {"label": "6. Keep\nwatching it", "c": "violet"}], "steps": ["all", 5, 5, 2, 4, 4, 4, 5, 5, 5, 4, 5]}}], "keyPoint": "A tool is never finished. Patients and practice change, so someone must watch it and retrain it when it slips.", "plain": ["Six steps: collect, prepare, train, test, use, watch.", "'Drift': the tool gets worse because the world changes, not the software.", "Always ask: who is watching it?"], "check": {"q": "A deterioration score started over-calling in 2021, though its software had not changed. Why?", "o": ["The patients and recording practice changed", "The computer was hacked", "Over-calling is normal and needs no action"], "a": 0, "e": "This is called drift. The world moved and the tool did not. Watching it catches this.", "retry": {"q": "How often should a tool be retrained?", "o": ["Every year, always", "When watching shows it has slipped", "Never, once tested"], "a": 1, "e": "There is no fixed timetable. Retrain when monitoring shows it has drifted."}}, "scenario": {"title": "The alarm nobody answers", "setting": "Nurses on your ward say the deterioration alert 'goes off all the time' and they have started ignoring it.", "steps": [{"prompt": "What is the most likely cause?", "choices": [{"t": "The nurses are careless", "s": 0, "fb": "Unlikely. Too many false alarms wear down any team."}, {"t": "The tool has drifted and now over-calls", "s": 2, "fb": "Right. If patients or recording changed, the tool may now raise too many alarms."}, {"t": "The screen is too small", "s": 0, "fb": "No. The pattern points to drift."}]}, {"prompt": "What do you do next?", "choices": [{"t": "Switch the alert off quietly", "s": 0, "fb": "Unsafe. Report it so the tool can be checked."}, {"t": "Report it to the person who owns monitoring the tool", "s": 2, "fb": "Right. They can check its accuracy and arrange retraining."}, {"t": "Tell nurses to respond to every alarm anyway", "s": 1, "fb": "Safe for now, but the tool still needs fixing."}]}]}, "lab": {"type": "order", "title": "Build it, then watch it", "prompt": "Put the six steps for building a clinical AI tool in the right order.", "items": ["Collect the data", "Clean and label it", "Train the tool", "Test it on new data", "Put it into use", "Keep watching it"], "explain": "A tool is never finished. Watching is the step most often forgotten, and it is how drift is caught and the tool retrained."}}, {"title": "Inside a neural network", "minutes": 2, "slides": [{"img": 14, "say": ["Let's look inside a neural network. You need no maths for this.", "Patient details come in on the left: age, blood pressure, a blood result, a symptom score.", "Each line in the picture carries a number. It says how much that signal counts. We call it a weight.", "The signals pass through the middle layers and come out on the right as one answer, here a risk score.", "Learning simply means showing the network thousands of cases, comparing its answer with the truth, and nudging the numbers until it gets them right.", "This picture has 45 lines. A tool that reads chest films has millions. That is why nobody can explain exactly why a big network gave its answer."], "scene": {"type": "graph", "title": "Inside a neural network: numbers on lines, nudged until the answers come out right", "nodes": [{"id": "in", "label": "Patient details in:\nage, blood pressure,\nbloods, symptoms", "p": [-4.5, 1.0, 0.4], "c": "cyan", "shape": "box", "size": 0.9, "ls": 0.6}, {"id": "w", "label": "Weight: how much\na signal counts", "p": [-1.5, 3.0, -1.2], "c": "amber", "shape": "cyl", "size": 0.8, "ls": 0.65}, {"id": "mid", "label": "Middle layers", "p": [-1.5, 0.4, 0.8], "c": "cyan", "shape": "ico", "size": 1.1, "spin": true, "ls": 0.7}, {"id": "out", "label": "One answer:\na risk score", "p": [1.5, 1.0, 0.8], "c": "green", "shape": "sphere", "size": 1.0, "ls": 0.7}, {"id": "train", "label": "Learning: compare\nwith truth, nudge", "p": [4.5, 3.0, -1.2], "c": "violet", "shape": "torus", "size": 0.9, "ls": 0.65}, {"id": "scale", "label": "45 lines here;\nmillions in a\nchest film tool", "p": [4.5, 0.2, 0.6], "c": "amber", "shape": "slab", "size": 0.9, "ls": 0.6}, {"id": "why", "label": "Nobody can explain\nexactly why", "p": [1.5, 3.3, -1.8], "c": "red", "shape": "shield", "size": 0.8, "ls": 0.65}], "links": [["in", "mid"], ["mid", "out"], ["w", "mid"], ["out", "train"], ["train", "w"], ["scale", "why"]], "steps": ["all", "all", ["in"], ["w"], ["w"], ["w"], ["in", "mid", "out"], ["train", "w", "out"], ["scale"], ["scale"], ["why"]]}}], "keyPoint": "A network is lots of numbers on lines. Learning means nudging those numbers. Big networks have millions, so their reasoning cannot be read.", "plain": ["Inputs go in, one answer comes out.", "Each line carries a number, called a weight.", "Training nudges the weights until answers match the truth.", "'Deep' means many middle layers."], "check": {"q": "In a neural network, what is a weight?", "o": ["The patient's body weight", "A number saying how much a signal counts", "How heavy the computer is"], "a": 1, "e": "Each line carries a weight. Training nudges the weights until the answers come out right.", "retry": {"q": "Why can't we easily explain a big network's answer?", "o": ["It has millions of numbers, none of which means a clinical idea", "It is kept secret by law", "It changes every second"], "a": 0, "e": "No single number means 'pneumonia' or 'sepsis', so the reasoning can't be read like a rule."}}, "scenario": {"title": "The unexplained risk score", "setting": "A deep learning tool gives your patient a high risk score of 0.82. Your clinical judgement says the risk is low.", "steps": [{"prompt": "Can the tool tell you exactly why it gave 0.82?", "choices": [{"t": "Yes, every network explains itself", "s": 0, "fb": "No. A large network's millions of numbers do not map to clinical reasons."}, {"t": "No, not in a way you could check", "s": 2, "fb": "Right. That is the price of a big, flexible model."}, {"t": "Only on Mondays", "s": 0, "fb": "No."}]}, {"prompt": "What should you do?", "choices": [{"t": "Follow the score, the computer knows best", "s": 0, "fb": "No. You remain accountable. Use the score as one input."}, {"t": "Review the patient, record your reasoning, and decide", "s": 2, "fb": "Right. The tool supports your decision; it does not replace it."}, {"t": "Ignore all scores from now on", "s": 0, "fb": "Too far. Weigh it, don't discard the tool entirely."}]}]}, "lab": {"type": "memory", "title": "Network pairs", "prompt": "Flip the cards and find each matching pair.", "pairs": [{"a": "Inputs", "b": "Patient details, like age and blood pressure"}, {"a": "Weight", "b": "A number saying how much a signal counts"}, {"a": "Output", "b": "One answer, such as a risk score"}, {"a": "Learning", "b": "Nudging the weights until answers match the truth"}, {"a": "'Deep'", "b": "Many middle layers"}, {"a": "Millions of weights", "b": "Why a big network can't explain its answer"}], "explain": "A network is lots of numbers on lines. Learning nudges them, and big networks have millions, so their reasoning cannot be read."}}, {"title": "Simple or complex models", "minutes": 2, "slides": [{"img": 16, "say": ["Models sit on a line. On the left are simple models, like a risk score where you can see every factor. On the right are complex ones, like deep networks and chatbots.", "Moving right lets a tool catch subtler patterns. But you lose the ability to see why it decided.", "Right is not better. It is a trade."], "scene": {"type": "graph", "title": "Simple to complex: you gain subtlety but lose the 'why'. It is a trade", "nodes": [{"id": "simple", "label": "Simple models:\nsee every factor", "p": [-4.5, 1.2, 0.4], "c": "green", "shape": "box", "size": 1.0, "ls": 0.7}, {"id": "complex", "label": "Complex: deep\nnetworks, chatbots", "p": [4.5, 1.2, 0.4], "c": "cyan", "shape": "ico", "size": 1.1, "spin": true, "ls": 0.65}, {"id": "subtle", "label": "Catches subtler\npatterns", "p": [1.5, 3.1, -1.2], "c": "green", "shape": "sphere", "size": 0.8, "ls": 0.7}, {"id": "why", "label": "Loses the 'why'", "p": [1.5, -0.3, 1.0], "c": "red", "shape": "shield", "size": 0.8, "ls": 0.7}, {"id": "trade", "label": "Right is not better:\nit is a trade", "p": [-1.5, 3.1, -1.2], "c": "amber", "shape": "cyl", "size": 0.9, "ls": 0.65}], "links": [["simple", "complex"], ["complex", "subtle"], ["complex", "why"], ["trade", "subtle"], ["trade", "why"]], "steps": ["all", ["simple"], ["complex"], ["complex", "subtle"], ["complex", "why"], ["trade"], ["trade", "subtle", "why"]]}}, {"img": 18, "say": ["To choose a starting point, ask two questions. What is the data? And must the reasoning be visible?", "Numbers in a table, and the reasoning must be shown: start simple, with logistic regression. Images: a network built for images. Free text like letters: a language model, with a person checking it.", "The rule of thumb: start with the simplest model that could work."], "scene": {"type": "graph", "title": "Pick a start by the data and by whether the reasoning must be visible", "nodes": [{"id": "q1", "label": "What is\nthe data?", "p": [-3, 3.2, -1.6], "c": "amber", "shape": "cyl", "size": 0.9, "ls": 0.7}, {"id": "q2", "label": "Must the reasoning\nbe visible?", "p": [3, 3.2, -1.6], "c": "amber", "shape": "cyl", "size": 0.9, "ls": 0.65}, {"id": "table", "label": "Table, reasoning\nshown: logistic\nregression", "p": [-4.5, 0.4, 0.6], "c": "green", "shape": "box", "size": 0.9, "ls": 0.6}, {"id": "img", "label": "Images: a network\nbuilt for images", "p": [0, 0.0, 1.2], "c": "cyan", "shape": "ico", "size": 1.0, "ls": 0.65}, {"id": "text", "label": "Free text: language\nmodel, a person\nchecking it", "p": [4.5, 0.4, 0.6], "c": "violet", "shape": "sphere", "size": 0.9, "ls": 0.6}, {"id": "rule", "label": "Start with the\nsimplest that\ncould work", "p": [0, 2.1, -0.4], "c": "white", "shape": "slab", "size": 0.8, "ls": 0.6}], "links": [["q1", "table"], ["q1", "img"], ["q1", "text"], ["q2", "table"], ["rule", "img"]], "steps": [["q1", "q2"], ["q1"], ["q2"], ["table"], ["img"], ["text"], ["rule"]]}}], "keyPoint": "Complex models catch more but explain less. Start with the simplest model that could work.", "plain": ["Simple model: you can see why it decided.", "Complex model: catches subtler patterns, can't explain itself.", "Pick by the data: tables, images or free text."], "check": {"q": "A board must see the reasoning behind a readmission score built from coded data. Which start makes most sense?", "o": ["A simple model, like logistic regression", "A large chatbot", "A deep image network"], "a": 0, "e": "Tables of numbers, and the reasoning must be visible: start simple.", "retry": {"q": "Moving from simple to complex models means…", "o": ["Always better accuracy", "Catching subtler patterns but losing the 'why'", "Easier checking"], "a": 1, "e": "It is a trade: subtlety for transparency."}}, "scenario": {"title": "Three in the morning", "setting": "At 3 a.m. a junior doctor sees a high discharge-risk score. She knows the sodium result was from a damaged sample.", "steps": [{"prompt": "The score comes from a simple model showing that sodium drives most of it. What can she do?", "choices": [{"t": "Override it and record why", "s": 2, "fb": "Right. She can see the faulty sodium is driving the score."}, {"t": "Nothing, scores can't be overridden", "s": 0, "fb": "No. Clinicians can and should override with a recorded reason."}, {"t": "Wait for the morning team", "s": 1, "fb": "Possible, but she has enough to act now."}]}, {"prompt": "If the score came from a complex model with no reasons shown, what changes?", "choices": [{"t": "Nothing changes", "s": 0, "fb": "It does. She can't see that the sodium is the driver."}, {"t": "She cannot tell what drove the score, so overriding is harder to justify", "s": 2, "fb": "Right. That is the hidden cost of complex models."}, {"t": "The complex model must be right", "s": 0, "fb": "No. Complex does not mean correct."}]}]}, "lab": {"type": "sort", "title": "Simple or complex?", "prompt": "Sort each card: does it describe a simple model or a complex one?", "buckets": ["Simple model", "Complex model"], "items": [{"t": "A risk score where you can see every factor", "b": 0}, {"t": "Logistic regression", "b": 0}, {"t": "Best start for table data when reasoning must show", "b": 0}, {"t": "Shows that a faulty sodium result is driving the score", "b": 0, "why": "With a simple model you can see which factor drives the score, so you can override it with a reason."}, {"t": "Deep networks and chatbots", "b": 1}, {"t": "Catches subtler patterns", "b": 1}, {"t": "Cannot show why it decided", "b": 1}, {"t": "Overriding it is harder to justify", "b": 1, "why": "If you can't see what drove the score, it is harder to explain why you overrode it."}], "explain": "Complex models catch more but explain less. Right is not better, it is a trade: start with the simplest model that could work."}}, {"title": "How AI reads a scan", "minutes": 2, "slides": [{"img": 20, "say": ["How does AI read a scan? The image arrives as a grid of dots.", "The first layers spot simple edges, like rib margins. Later layers combine edges into shapes. The last layers spot things that matter, like a round shadow.", "At the end it gives a probability, say 0.87 for a nodule, and often a heat map showing where it looked.", "Here is the warning. A heat map shows where the tool looked, not why. Tools have been caught looking at chest drains, at the 'R' side marker, or at which hospital took the film.", "One pneumonia tool partly learned to recognise the hospital. It tested brilliantly, then failed elsewhere.", "So treat a heat map as a hint, never as proof."], "scene": {"type": "stairs", "title": "Image AI: edges, then shapes, then findings. A heat map shows where it looked, not why", "flat": false, "levels": [{"label": "Grid of dots", "c": "slate"}, {"label": "Simple edges\n(rib margins)", "c": "cyan"}, {"label": "Shapes", "c": "cyan"}, {"label": "Findings\n(round shadow)", "c": "cyan"}, {"label": "Probability\n+ heat map", "c": "green"}, {"label": "Heat map: where,\nnot why", "c": "red"}], "steps": ["all", 0, 1, 2, 3, 4, 5, 5, 5, 5, 5, 5]}}], "keyPoint": "Image AI learns edges, then shapes, then findings. A heat map shows where it looked, not why.", "plain": ["Early layers find edges; later layers find shapes and findings.", "The answer is a probability, plus a heat map.", "Heat map = where it looked. It may be looking at a drain or a marker."], "check": {"q": "What does a heat map on an AI-read scan show?", "o": ["Why the tool decided", "Where the tool looked most", "That the finding is definitely real"], "a": 1, "e": "It shows where the tool looked, which may be a lesion, a drain or a marker.", "retry": {"q": "A pneumonia tool tested brilliantly at one hospital and failed elsewhere. A likely reason?", "o": ["It learned to recognise the hospital", "The other hospitals had faster computers", "Pneumonia looks different abroad"], "a": 0, "e": "It used a shortcut: the hospital, not the disease."}}, "scenario": {"title": "The heat map on the marker", "setting": "An AI tool flags a nodule with probability 0.85. The heat map sits over the 'R' side marker in the corner, not over the lung.", "steps": [{"prompt": "What does this suggest?", "choices": [{"t": "The tool may be using a shortcut, not the lung", "s": 2, "fb": "Right. It is looking at the marker, not at a lesion."}, {"t": "The nodule is in the corner of the film", "s": 0, "fb": "No. The marker is outside the lung."}, {"t": "The heat map is decoration", "s": 0, "fb": "No. It shows where the tool looked, and that is the warning."}]}, {"prompt": "What do you do?", "choices": [{"t": "Report a nodule as the tool says", "s": 0, "fb": "No. The evidence points to a shortcut."}, {"t": "Read the film yourself and report the concern about the tool", "s": 2, "fb": "Right. Your own read decides, and the tool's behaviour needs reporting."}, {"t": "Delete the tool", "s": 0, "fb": "Too far. Report it so it can be checked."}]}]}, "lab": {"type": "spot", "title": "Look where it looked", "prompt": "Read this fictional reporting note and tap every warning sign.", "parts": [{"lbl": "Tool output", "t": "The AI tool flags a possible nodule with probability 0.85.", "bad": false, "why": "A probability is the normal output; what matters is what it was based on."}, {"lbl": "Heat map", "t": "The heat map sits over the 'R' side marker in the corner, not over the lung.", "bad": true, "why": "The tool looked at the marker, which suggests a shortcut, not a lesion."}, {"lbl": "Junior's note", "t": "Heat map shows why the tool decided, so the nodule is confirmed.", "bad": true, "why": "A heat map shows where the tool looked, not why. Treat it as a hint, never as proof."}, {"lbl": "Supplier claim", "t": "'It tested brilliantly at the hospital where it was built, so it will work anywhere.'", "bad": true, "why": "One pneumonia tool tested brilliantly, then failed elsewhere because it partly learned to recognise the hospital."}, {"lbl": "How it works", "t": "The tool reads the film as a grid of dots: edges first, then shapes, then findings.", "bad": false, "why": "This is how image AI works; it is not a warning sign."}, {"lbl": "Your read", "t": "The consultant reads the film herself before anything is reported.", "bad": false, "why": "Your own read decides, not the tool."}, {"lbl": "Next step", "t": "The concern about the tool's heat map is reported so it can be checked.", "bad": false, "why": "Reporting the tool's behaviour is the right response to a possible shortcut."}], "explain": "Image AI learns edges, then shapes, then findings. A heat map shows where it looked, not why, so it is a hint, never proof."}}, {"title": "Several models, one answer", "minutes": 2, "slides": [{"img": 22, "say": ["Serious imaging tools often use several models together. Think of it as a multidisciplinary team meeting.", "Here one scan goes to three different models. They say 0.91, 0.62 and 0.79. The average is 0.77.", "But look at the middle one. It disagrees. That disagreement is useful. A good system sends a disputed case to a human reader.", "This works only if the models are truly different. Three copies of the same model, trained on the same scanner, make the same mistakes together.", "So when a supplier quotes one number, ask: is that one model or several, and how are they different?"], "scene": {"type": "bars", "title": "One scan, three models: 0.91, 0.62 and 0.79. The disagreement is the signal", "scale": 4, "bars": [{"id": "m1", "label": "Model 1", "v": 0.91, "p": [-3.6, 0], "c": "cyan"}, {"id": "m2", "label": "Model 2\ndisagrees", "v": 0.62, "p": [-1.2, 0], "c": "red"}, {"id": "m3", "label": "Model 3", "v": 0.79, "p": [1.2, 0], "c": "cyan"}, {"id": "avg", "label": "Average", "v": 0.77, "p": [3.6, 0], "c": "amber"}], "axes": [{"t": "Each model's score for the same scan", "p": [0, -2.2, 1.6]}], "steps": ["all", "all", ["m1", "m2", "m3"], ["m1", "m2", "m3"], ["avg"], ["m2"], ["m2"], ["m2"], ["m2"], ["m1", "m2", "m3"], ["m1", "m2", "m3"], ["avg"]]}}], "keyPoint": "Combining different models is like an MDT. When they disagree, a person should look.", "plain": ["Several models each give an opinion.", "They are combined into one answer.", "Disagreement means: send it to a human.", "Only helps if the models are genuinely different."], "check": {"q": "Three models score a scan 0.91, 0.62 and 0.79. What should a good system do?", "o": ["Recall automatically, because the average is 0.77", "Send the case to a human reader, because they disagree", "Ignore the middle model"], "a": 1, "e": "The disagreement is the signal. A person should review disputed cases.", "retry": {"q": "When does combining models help most?", "o": ["When they are copies of each other", "When they are genuinely different", "When they all use the same scanner"], "a": 1, "e": "Different models make different mistakes, so combining them cancels some out."}}, "scenario": {"title": "The supplier's single number", "setting": "A supplier says their mammography tool is '96 per cent accurate'.", "steps": [{"prompt": "Which question helps most?", "choices": [{"t": "Is that one model or several, and how do they differ?", "s": 2, "fb": "Right. A single number can hide a committee of models."}, {"t": "Can it run on a tablet?", "s": 0, "fb": "Not the key question."}, {"t": "Has it won any awards?", "s": 0, "fb": "Awards are not evidence for your patients."}]}, {"prompt": "The models were all trained on one hospital's scanner. What is the risk?", "choices": [{"t": "None, more models is always safer", "s": 0, "fb": "No. Similar models fail together."}, {"t": "They may all make the same mistake on a different scanner", "s": 2, "fb": "Right. Diversity is the whole point."}, {"t": "They will run too slowly", "s": 1, "fb": "Possible, but the bigger risk is shared mistakes."}]}]}, "lab": {"type": "spot", "title": "One number, many models", "prompt": "Read these fictional notes from a supplier meeting and tap every warning sign.", "parts": [{"lbl": "Supplier claim", "t": "'Our mammography tool is 96 per cent accurate.' No more detail is given.", "bad": true, "why": "A single number can hide several models. Ask whether it is one model or several, and how they differ."}, {"lbl": "Design", "t": "Each scan is scored by three models and the results are combined.", "bad": false, "why": "Serious imaging tools often combine several models, like an MDT."}, {"lbl": "Training", "t": "All three models were trained on the same scanner at one hospital.", "bad": true, "why": "Similar models make the same mistakes together; combining only helps if they are truly different."}, {"lbl": "Supplier's rule", "t": "'If the models disagree, we just take the average and recall automatically.'", "bad": true, "why": "Disagreement is the signal: a good system sends a disputed case to a human reader."}, {"lbl": "Our plan", "t": "Disputed cases will go to a human reader before any decision.", "bad": false, "why": "This is what a good system does with disagreement."}, {"lbl": "Our question", "t": "Ask the supplier how the models differ from one another.", "bad": false, "why": "Combining models only helps if they are genuinely different."}], "explain": "Combining different models is like an MDT. It only helps if they are truly different, and when they disagree, a person should look."}}, {"title": "Reading the evidence", "minutes": 3, "slides": [{"img": 24, "say": ["This is the most useful lesson in the course.", "Imagine 1,000 patients. 50 have the disease. That is five per cent, typical of screening.", "A tool catches 45 of the 50. It also flags 95 people who are well. It is ninety per cent accurate. Sounds good.", "Now, of everyone it flags, how many are really ill? 45 out of 140. About one in three. Two out of three people it flags are well.", "Nothing is wrong with the tool. It is because the disease is rare here.", "Use the same tool in a clinic where 30 per cent are ill, and about four in five flagged people are really ill.", "So never ask only 'how accurate is it?' Ask: of the people it flags, how many will really be ill, in my clinic?", "One more idea. If a tool says '70 per cent risk', it should happen about 70 times in 100. That is called calibration."], "scene": {"type": "bars", "title": "1,000 patients, 50 ill: the tool flags 140, but only 45 of them are really ill", "sq": 0.13, "bars": [{"id": "pts", "label": "All patients", "v": 1000, "p": [-4.8, 0], "c": "slate"}, {"id": "ill", "label": "Have the\ndisease", "v": 50, "p": [-2.4, 0], "c": "amber"}, {"id": "caught", "label": "Caught\n(really ill)", "v": 45, "p": [0, 0], "c": "green"}, {"id": "well", "label": "Flagged\nbut well", "v": 95, "p": [2.4, 0], "c": "red"}, {"id": "flag", "label": "All flagged", "v": 140, "p": [4.8, 0], "c": "cyan"}], "axes": [{"t": "Number of patients", "p": [0, -2.2, 1.6]}], "steps": ["all", ["pts"], ["ill"], ["pts", "ill"], ["caught"], ["well"], ["ill", "caught"], "all", ["flag"], ["caught", "flag"], ["caught", "flag"], ["well", "flag"], ["caught"], ["pts", "ill"], "all", "all", ["caught", "flag"], "all", "all", "all"]}}], "keyPoint": "Accuracy alone misleads. Ask: of the people it flags, how many are really ill in my setting?", "plain": ["Rare disease + good test = many false alarms.", "Ask for the 'positive predictive value': of those flagged, how many are really ill.", "The same tool works differently in different clinics.", "Calibration: when it says 70%, it should happen 70% of the time."], "check": {"q": "A tool is 90% accurate and used where 5% have the disease. Of those it flags, roughly how many are really ill?", "o": ["About 9 in 10", "About 1 in 3", "About 3 in 4"], "a": 1, "e": "45 true cases among 140 flagged: about one in three. Rare disease means many false alarms.", "retry": {"q": "The same tool moves to a clinic where 30% are ill. What happens?", "o": ["More of the people it flags are really ill", "Fewer of the people it flags are really ill", "Nothing changes"], "a": 0, "e": "About four in five flagged people are ill there. Same tool, different setting."}}, "scenario": {"title": "The screening pilot", "setting": "Your practice pilots an AI screening tool. The supplier says: '90 per cent sensitivity, 90 per cent specificity'. About 2 in 100 of your patients have the condition.", "steps": [{"prompt": "What will most people it flags turn out to be?", "choices": [{"t": "Ill", "s": 0, "fb": "No. With a rare condition, false alarms outnumber true cases."}, {"t": "Well", "s": 2, "fb": "Right. At 2 in 100, most flags will be false alarms."}, {"t": "Exactly half ill", "s": 0, "fb": "No. It depends on how rare the condition is."}]}, {"prompt": "What should you ask the supplier?", "choices": [{"t": "What is the accuracy?", "s": 0, "fb": "That is the number that hides the problem."}, {"t": "Of people flagged in a practice like ours, how many are really ill?", "s": 2, "fb": "Right. That is the positive predictive value at your prevalence."}, {"t": "How quickly does it give results?", "s": 1, "fb": "Useful later, but ask about false alarms first."}]}]}, "lab": {"type": "order", "title": "Follow the flags", "prompt": "Put the reasoning in order to find how many flagged people are really ill.", "items": ["Start with 1,000 patients", "50 have the disease (five per cent)", "The tool catches 45 of the 50", "It also flags 95 people who are well", "So 140 people are flagged in all", "Only 45 of the 140 are ill: about one in three"], "explain": "Accuracy alone misleads. When the disease is rare, false alarms outnumber true cases, so ask how many flagged people are really ill in your setting."}}, {"title": "Chatbots: fluent but not always right", "minutes": 2, "slides": [{"img": 27, "say": ["Chatbots, or large language models, work differently. They write new text.", "Try this. 'The patient was commenced on…' You probably thought 'antibiotics'. That is exactly what a chatbot does. It guesses the likely next word, then the next, and so on. It does not look anything up.", "Nothing in the chatbot checks if its words are true. So it can be confident, fluent and wrong. This is called hallucination.", "Ask it for evidence, and it may give you a perfect-looking reference to a paper that does not exist.", "But it can write a good first draft of a clinic letter, because a clinician reads it before it goes anywhere.", "Use chatbots for drafting. Never treat them as a source of truth."], "scene": {"type": "graph", "title": "A chatbot guesses the next likely word. Nothing checks that it is true", "nodes": [{"id": "prompt", "label": "'The patient was\ncommenced on…'", "p": [-4.5, 1.2, 0.4], "c": "slate", "shape": "slab", "size": 0.9, "ls": 0.65}, {"id": "guess", "label": "Guesses the likely\nnext word", "p": [-1.5, 1.2, 0.8], "c": "cyan", "shape": "ico", "size": 1.1, "spin": true, "ls": 0.65}, {"id": "check", "label": "No look-up,\nno fact check", "p": [1.5, 1.2, 0.8], "c": "red", "shape": "shield", "size": 0.9, "ls": 0.7}, {"id": "hall", "label": "Hallucination:\nfluent and wrong", "p": [4.5, 1.2, 0.4], "c": "red", "shape": "sphere", "size": 0.9, "ls": 0.7}, {"id": "draft", "label": "Good first draft\na clinician reads", "p": [-3, 3.2, -1.6], "c": "green", "shape": "box", "size": 0.9, "ls": 0.65}, {"id": "ref", "label": "Perfect-looking\nreference that\ndoesn't exist", "p": [3, 3.2, -1.6], "c": "red", "shape": "slab", "size": 0.8, "ls": 0.6}, {"id": "truth", "label": "Never a source\nof truth", "p": [0, -0.4, 1.4], "c": "amber", "shape": "cyl", "size": 0.8, "ls": 0.7}], "links": [["prompt", "guess"], ["guess", "check"], ["check", "hall"], ["hall" stairs", "title": "Five questions for any clinical AI tool. None of them needs maths", "flat": true, "levels": [{"label": "1. Trained on\npatients like mine?", "c": "cyan"}, {"label": "2. Who marked\nthe answers?", "c": "cyan"}, {"label": "3. Tested on\nseparate data?", "c": "amber"}, {"label": "4. How many flags\nare real here?", "c": "amber"}, {"label": "5. Who is\nwatching it?", "c": "violet"}], "steps": ["all", 0, 0, 1, 1, 2, 2, 3, 3, 4, 4, "all", "all", "all", "all", "all"]}}], "keyPoint": "Five questions: trained on whom, labelled by whom, tested where, how many flags are real, and who is watching.", "plain": ["Trained on patients like mine?", "Who marked the answers?", "Tested on separate data?", "How many flags are real here?", "Who is watching it?"], "check": {"q": "A supplier can't say how their tool was tested or who monitors it. What should you conclude?", "o": ["It's fine, approved tools don't need monitoring", "That is your answer: be cautious", "Buy it and ask later"], "a": 1, "e": "If the makers can't answer the five questions, that tells you what you need to know.", "retry": {"q": "Who stays accountable for a decision supported by AI?", "o": ["The supplier", "The clinician", "The AI tool"], "a": 1, "e": "AI supports decisions; the clinician remains accountable."}}, "scenario": {"title": "The ten-minute meeting", "setting": "A supplier visits with a chest film triage tool. You have time for two questions.", "steps": [{"prompt": "First question?", "choices": [{"t": "Is it powered by the latest AI?", "s": 0, "fb": "That tells you nothing about your patients."}, {"t": "What was it trained on, and were those patients like ours?", "s": 2, "fb": "Right. The training population sets the limit of the tool."}, {"t": "How many hospitals use it?", "s": 1, "fb": "Popular is not the same as proven for your patients."}]}, {"prompt": "They say: 'monitoring is the hospital's job'. What do you do?", "choices": [{"t": "Accept it and buy", "s": 0, "fb": "Not until someone in your trust owns monitoring."}, {"t": "Agree a named monitoring owner before any go-live", "s": 2, "fb": "Right. No owner means nobody is watching."}, {"t": "Ask for a discount", "s": 0, "fb": "Price is not the safety issue."}]}]}, "lab": {"type": "spot", "title": "The supplier visit", "prompt": "Read these fictional notes from a supplier's visit about a chest film triage tool and tap every warning sign.", "parts": [{"lbl": "Training data", "t": "The supplier showed which patients it was trained on, and they are like ours.", "bad": false, "why": "This answers question one: were those patients like mine?"}, {"lbl": "Labelling", "t": "The supplier could not say who marked the answers it learned from.", "bad": true, "why": "Question two: who marked the answers, and how carefully? No answer is a warning."}, {"lbl": "Testing", "t": "It was only tested on the same data it learned from.", "bad": true, "why": "Question three asks for testing on truly separate data, from another hospital or another time."}, {"lbl": "Real flags", "t": "They showed how many flagged patients were really ill in a setting like ours.", "bad": false, "why": "This answers question four for your setting."}, {"lbl": "Monitoring", "t": "'Monitoring is the hospital's job.' No named owner has been agreed.", "bad": true, "why": "Question five: who is watching it? No owner means nobody is watching."}, {"lbl": "Accountability", "t": "The clinician reviewing each flag stays accountable for the decision.", "bad": false, "why": "You, not the tool, stay accountable. This is correct."}], "explain": "Ask five questions: trained on whom, labelled by whom, tested where, how many flags are real, and who is watching. If a supplier can't answer, you have learned what you need to know."}}], "test": [{"q": "A tool learned from labelled chest films at one hospital. Before using it, the most important question is…", "o": ["Were those patients and scanners like ours?", "How many layers does it have?", "Is it made by
