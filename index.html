<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Ward Round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a ward-round workbook. Left rail lists the stations (a real sequence), main column holds one station at a time:
   plain-words brief -> live simulation -> check question -> bedside takeaway. */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --surface-2:#E9EFEF; --ink:#14232A; --muted:#55686D; --line:#D2DCDD;
  --accent:#0E6B66; --accent-soft:#D6ECEA; --signal:#B97A06; --signal-soft:#F7EBD2;
  --good:#2C7A4B; --good-soft:#DCEFE3; --bad:#AE3434; --bad-soft:#F6DEDE; --info:#2D5B8A;
  --img-bg:#0B0F10;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1618; --surface:#142124; --surface-2:#1B2B2E; --ink:#E3ECEC; --muted:#92A6A9; --line:#2A3C3F;
  --accent:#4DB6AC; --accent-soft:#183A38; --signal:#E3A53A; --signal-soft:#3A2E17;
  --good:#5CBB84; --good-soft:#18352A; --bad:#E27474; --bad-soft:#3D1F1F; --info:#7FA9D8; --img-bg:#050708;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#142124; --surface-2:#1B2B2E; --ink:#E3ECEC; --muted:#92A6A9; --line:#2A3C3F;
  --accent:#4DB6AC; --accent-soft:#183A38; --signal:#E3A53A; --signal-soft:#3A2E17;
  --good:#5CBB84; --good-soft:#18352A; --bad:#E27474; --bad-soft:#3D1F1F; --info:#7FA9D8; --img-bg:#050708;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.45rem}
.brand span{color:var(--muted);font-size:.85rem}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.prog-bar{width:120px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* shell */
.shell{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
.rail-label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
.rail button{display:grid;grid-template-columns:28px 1fr 16px;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink);font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.rail .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.rail .tick{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.rail .tick.done{background:var(--good);border-color:var(--good)}
.mob-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mob-nav{display:flex;gap:8px;align-items:center}
  .mob-nav select{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
}

/* station */
.station{display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.st-head h2{font-size:2.1rem;margin-top:4px}
.st-head .lede{margin-top:10px;max-width:68ch;color:var(--muted);font-size:1.02rem}
.plain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;max-width:820px}
.plain b.k{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.plain p{max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:1.2rem;margin-bottom:4px}
.panel .hint{color:var(--muted);font-size:.9rem;margin-bottom:14px;max-width:72ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl{display:grid;grid-template-columns:minmax(110px,150px) 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl output{font-family:var(--f-mono);text-align:right;font-size:.88rem}
.ctls{display:flex;flex-direction:column;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface-2);min-width:0}
.stat small{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:1.35rem;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.82rem;font-weight:600;background:var(--surface-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--signal-soft);color:var(--signal)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:8px;padding:10px 14px;font-size:.92rem;background:var(--surface-2)}
.note.warn{background:var(--signal-soft)}
.note.bad{background:var(--bad-soft)}
.note.good{background:var(--good-soft)}
.svgwrap{overflow-x:auto}
svg text{font-family:var(--f-body)}
select.sel{padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);max-width:100%}

/* check question */
.check{border:1px solid var(--accent);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.check .q{font-weight:600;margin:4px 0 12px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:10px;font-size:.93rem;max-width:72ch}
.take{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--signal-soft);border-radius:var(--r);padding:14px 18px}
.take b{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--signal);padding-top:3px;white-space:nowrap}
.take p{max-width:72ch;font-weight:500}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* specific */
.toolcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.toolcard h4{margin:0;font-size:.98rem}
.toolcard p{font-size:.88rem;color:var(--muted)}
.toolcard label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.verdict{font-size:.85rem;font-weight:600}
.sortitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:.83rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stage{border-radius:8px;padding:8px;font-size:.8rem;text-align:center;background:var(--surface-2);border:1px solid var(--line);line-height:1.3}
.stage b{display:block;font-size:.88rem}
.stage.live{background:var(--accent-soft);border-color:var(--accent)}
.stage.dim{opacity:.45}
@media (max-width:640px){.stages{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.cx{grid-template-columns:minmax(0,1fr)}}
canvas{display:block;max-width:100%}
.film{width:100%;max-width:420px;aspect-ratio:1/1;border-radius:8px;background:var(--img-bg)}
.steps{display:flex;flex-direction:column;gap:6px}
.steps button{text-align:left}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:.85rem;max-width:420px}
.cm div{padding:8px;border-radius:6px;text-align:center}
.cm .h{background:transparent;color:var(--muted);font-weight:600}
.cm .tp{background:var(--accent);color:var(--surface)}
.cm .fn{background:var(--accent-soft);color:var(--accent)}
.cm .fp{background:var(--signal);color:var(--surface)}
.cm .tn{background:var(--surface-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;gap:8px;align-items:center;font-size:.86rem}
.barrow .track{height:14px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.barrow .fill{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.barrow .fill.neg{background:var(--signal)}
.barrow output{font-family:var(--f-mono);text-align:right;font-size:.82rem}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:4px}
.msg{max-width:84%;padding:10px 13px;border-radius:12px;font-size:.92rem}
.msg.you{align-self:flex-end;background:var(--accent);color:var(--surface);border-bottom-right-radius:3px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:3px}
.msg .flag{display:block;margin-top:6px;font-size:.82rem;font-weight:600;color:var(--bad)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qlist button{text-align:left}
.fam{display:flex;flex-wrap:wrap;gap:8px}
.fam button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.fam button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.tokens{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-display);font-size:1.25rem}
.gloss{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 16px;font-size:.92rem}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:760px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(5,12,14,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.dlg-body{padding:16px 18px;max-height:70vh;overflow-y:auto}
.ten{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;counter-reset:t}
.ten li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 44px;position:relative;font-size:.93rem}
.ten li::before{counter-increment:t;content:counter(t);position:absolute;left:12px;top:9px;font-family:var(--f-mono);color:var(--accent);font-weight:600}
.ten li.hi{background:var(--signal-soft);border-color:var(--signal)}
@media (max-width:640px){.ten{grid-template-columns:minmax(0,1fr)}}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.route button{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer}
.route button:hover{border-color:var(--accent)}
.route .n{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.route b{font-size:.95rem}
.route span{font-size:.82rem;color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted);max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body style="margin:0">
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>AI Ward Round</h1><span>Fundamentals of AI for clinicians</span></div>
    <div class="top-right">
      <div class="prog"><span id="progTxt">0 of 11 stations</span><div class="prog-bar"><i id="progBar"></i></div></div>
      <a class="btn ghost" href="lectures/index.html" style="text-decoration:none">Lectures</a>
      <button class="btn ghost" id="glossBtn" type="button">Glossary</button>
    </div>
    <div class="mob-nav" style="width:100%"><select id="mobSel" aria-label="Go to station"></select></div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Stations"><div class="rail-label">Stations</div></nav>
  <main id="main" class="station" aria-live="polite"></main>
</div>

<dialog id="glossDlg" aria-labelledby="glossTitle">
  <div class="dlg-head"><h3 id="glossTitle">Glossary</h3>
    <div class="row"><input id="glossQ" type="search" placeholder="Search terms" aria-label="Search glossary" style="padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg)">
    <button class="btn" type="button" id="glossClose">Close</button></div></div>
  <div class="dlg-body"><dl class="gloss" id="glossList"></dl></div>
</dialog>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids){
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u=0,v=0; while(!u)u=r(); while(!v)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const sig = z => 1/(1+Math.exp(-z));
const pct = (x,d=0) => (100*x).toFixed(d)+'%';
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
function slider(label, id, min, max, step, val, fmt, onInput){
  const out = h('output', {for:id});
  const inp = h('input', {type:'range', id, min, max, step, value:val, 'aria-label':label});
  const upd = () => { out.textContent = fmt(+inp.value); onInput && onInput(+inp.value); };
  inp.addEventListener('input', upd);
  const row = h('div', {class:'ctl'}, h('label', {for:id}, label), inp, out);
  out.textContent = fmt(+val);
  row.input = inp; row.update = upd;
  return row;
}
function seg(options, value, onChange, label){
  const wrap = h('div', {class:'seg', role:'group', 'aria-label':label||''});
  const btns = options.map(([v,t]) => {
    const b = h('button', {type:'button', 'aria-pressed': String(v===value)}, t);
    b.addEventListener('click', () => { btns.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onChange(v); });
    return b;
  });
  wrap.append(...btns); return wrap;
}
const themeListeners = [];
function onTheme(fn){ themeListeners.push(fn); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>themeListeners.forEach(f=>f()));
new MutationObserver(()=>themeListeners.forEach(f=>f())).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- progress ---------- */
let done = {};
try { done = JSON.parse(localStorage.getItem('aiwr-done') || '{}') || {}; } catch(e){ done = {}; }
function markDone(id){
  done[id] = true;
  try { localStorage.setItem('aiwr-done', JSON.stringify(done)); } catch(e){}
  renderProgress();
}

/* ---------- check question ---------- */
function check(id, q, options, correct, explain){
  const fb = h('div', {class:'fb'});
  const box = h('section', {class:'check', 'aria-label':'Check your understanding'},
    h('div', {class:'eyebrow'}, 'Check your understanding'), h('p', {class:'q'}, q));
  const opts = h('div', {class:'opts'});
  options.forEach((o,i) => {
    const b = h('button', {class:'opt', type:'button'}, o);
    b.addEventListener('click', () => {
      opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));
      if (i === correct){ b.classList.add('right'); fb.innerHTML = '<b>Right.</b> ' + explain; markDone(id); }
      else { b.classList.add('wrong'); fb.innerHTML = '<b>Not quite.</b> Think about it once more, then try another answer.'; }
    });
    opts.append(b);
  });
  box.append(opts, fb);
  return box;
}
function takeaway(text){ return h('div', {class:'take'}, h('b', null, 'At the bedside'), h('p', null, text)); }
function plain(rows){
  const d = h('div', {class:'plain'});
  rows.forEach(([k,v]) => d.append(h('b', {class:'k'}, k), h('p', {html:v})));
  return d;
}

/* ---------- small line chart ---------- */
function lineChart({w=640, hgt=240, xs, series, ymin=0, ymax=1, yfmt=v=>v, xlabels=[], marks=[], ylab=''}){
  const m = {l:46, r:14, t:12, b:30};
  const X = i => m.l + (w-m.l-m.r) * (i/(xs-1||1));
  const Y = v => m.t + (hgt-m.t-m.b) * (1 - (v-ymin)/(ymax-ymin));
  const g = s('svg', {viewBox:`0 0 ${w} ${hgt}`, width:'100%', role:'img'});
  for (let k=0;k<=4;k++){ const v = ymin + (ymax-ymin)*k/4;
    g.append(s('line',{x1:m.l,x2:w-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    g.append(s('text',{x:m.l-6,y:Y(v)+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'}, yfmt(v))); }
  xlabels.forEach(([i,t]) => g.append(s('text',{x:X(i),y:hgt-8,'text-anchor':'middle','font-size':11,fill:'var(--muted)'}, t)));
  if (ylab) g.append(s('text',{x:12,y:m.t+4,'font-size':11,fill:'var(--muted)'}, ''));

function makeSepsis(n, site, seed){
  const r = mulberry32(seed), out = [];
  for (let i=0;i<n;i++){
    const ward7 = r() < 0.18 ? 1 : 0;
    const p = site==='A' ? (ward7 ? 0.42 : 0.06) : (ward7 ? 0.02 : 0.09);
    const y = r() < p ? 1 : 0;
    const hr = (y?97:87) + gauss(r)*15, rr = (y?20.5:17.5) + gauss(r)*4.5, temp = (y?37.9:37.2) + gauss(r)*0.9, lac = Math.max(0.4,(y?2.3:1.5) + gauss(r)*1.0);
    out.push({hr,rr,temp,lac,ward7,y});
  }
  return out;
}
function trainLR(data, feats, iters=500, lr=0.4){
  const n = data.length, k = feats.length;
  const mu = feats.map(f => data.reduce((a,d)=>a+d[f],0)/n);
  const sd = feats.map((f,j) => Math.sqrt(data.reduce((a,d)=>a+(d[f]-mu[j])**2,0)/n) || 1);
  const X = data.map(d => feats.map((f,j)=>(d[f]-mu[j])/sd[j]));
  let w = new Array(k).fill(0), b = 0;
  for (let it=0; it<iters; it++){
    const gw = new Array(k).fill(0); let gb = 0;
    for (let i=0;i<n;i++){ let z=b; for(let j=0;j<k;j++) z+=w[j]*X[i][j]; const e = sig(z)-data[i].y; for(let j=0;j<k;j++) gw[j]+=e*X[i][j]; gb+=e; }
    for (let j=0;j<k;j++) w[j]-=lr*gw[j]/n; b-=lr*gb/n;
  }
  return {w,b,mu,sd,feats, predict(d){ let z=b; feats.forEach((f,j)=>z+=w[j]*(d[f]-mu[j])/sd[j]); return sig(z); }};
}
function auc(scores, ys){
  const idx = scores.map((s,i)=>[s,ys[i]]).sort((a,b)=>a[0]-b[0]);
  let rank=0, pos=0, sumR=0; idx.forEach(([s,y],i)=>{ if(y){pos++; sumR+=i+1;} });
  const neg = ys.length-pos; return (sumR - pos*(pos+1)/2)/(pos*neg);
}
function confusion(scores, ys, thr){
  let tp=0,fp=0,fn=0,tn=0; scores.forEach((s,i)=>{ const a = s>=thr; if(ys[i]){a?tp++:fn++;} else {a?fp++:tn++;} });
  return {tp,fp,fn,tn, sens: tp/(tp+fn||1), ppv: tp/(tp+fp||1), spec: tn/(tn+fp||1)};
}

  main.append(check('evidence','A model with 90% sensitivity and 90% specificity is used where 5% of patients have the disease. Of those it flags, roughly how many truly have it?',
    ['About 90%','About 75%','About a third'],2,

STATIONS.push({id:'llm', n:'10', title:'Generative AI and LLMs', short:'Fluent, confident and sometimes wrong',

    const w = d.map(([t,p])=>[t, Math.pow(p, 1/temp)]); const Z = w.reduce((a,x)=>a+x[1],0); return w.map(([t,p])=>[t,p/Z]); }

/* ---------- glossary ---------- */
const GLOSS = [
 ['Artificial intelligence (AI)','Computer systems performing tasks that normally require human intelligence.'],
 ['Machine learning (ML)','AI that learns rules from data and examples rather than being programmed by hand.'],
 ['Model','The set of learned rules produced by training, which is then applied to new data.'],
 ['Supervised learning','Learning from labelled examples to predict the label of new cases.'],
 ['Unsupervised learning','Finding structure or groups in data that has no labels.'],
 ['Reinforcement learning','Learning a policy by acting, receiving feedback, and improving.'],
 ['Training','The process of adjusting a model so its outputs match the example answers.'],
 ['Validation','Testing a model on data it has not seen, to estimate real-world performance.'],
 ['Neural network','A model of interconnected units arranged in layers, with learnable weights.'],
 ['Deep learning','Machine learning using neural networks with many hidden layers.'],
 ['CNN (convolutional neural network)','A neural network specialised for images.'],
 ['Transformer / LLM','A model for language; a large language model (LLM) generates fluent text.'],
 ['Ensemble','Several different models combined into one answer, so their errors partly cancel.'],
 ['Sensitivity','The proportion of true cases the model correctly identifies.'],
 ['Specificity','The proportion of non-cases the model correctly clears.'],
 ['Positive predictive value (PPV)','Of those the model flags, the proportion who truly have the condition.'],
 ['AUC','Area under the receiver operating characteristic (ROC) curve: how well a model separates cases from non-cases.'],
 ['Calibration','Whether a model\'s stated probabilities match observed event rates.'],
 ['Hallucination','A confident but false output, characteristic of generative models.'],
 ['Drift','The decline in a model\'s performance as the world changes over time.'],
 ['RLHF','Reinforcement learning from human feedback: people rank outputs and the model is rewarded for preferred ones.']];
function renderGloss(q=''){
  const dl = $('#glossList'); dl.innerHTML=''; const ql = q.toLowerCase();
  GLOSS.filter(([t,d])=>!ql || t.toLowerCase().includes(ql) || d.toLowerCase().includes(ql)).forEach(([t,d])=>dl.append(h('dt',null,t),h('dd',null,d)));
}
$('#glossBtn').onclick = () => { renderGloss($('#glossQ').value); try{ $('#glossDlg').showModal(); }catch(e){ $('#glossDlg').setAttribute('open',''); } };
$('#glossClose').onclick = () => { try{ $('#glossDlg').close(); }catch(e){ $('#glossDlg').removeAttribute('open'); } };
$('#glossQ').addEventListener('input', e=>renderGloss(e.target.value));
