p{margin:0}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.menu{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}

main{padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}

.lede{color:var(--muted);max-width:68ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:.84rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}

.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.steps span.ok{background:var(--good-soft);color:var(--good);font-weight:600}
.stage{position:relative;aspect-ratio:16/9;width:100%;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slidetag{position:absolute;left:10px;top:10px;background:rgba(10,30,34,.78);color:#fff;font-size:.75rem;padding:3px 9px;border-radius:99px;font-family:var(--f-mono)}

.speaker{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}

.q{font-weight:600;font-size:1.04rem;max-width:72ch;margin-bottom:8px}

.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 13px;cursor:pointer}

.fb{font-size:.94rem;max-width:72ch;margin-top:8px}
.case-set{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted);margin-bottom:12px;max-width:75ch}
.stepbox{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.gauge{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.dims{display:flex;flex-direction:column;gap:9px;flex:1;min-width:240px}
.dim{display:grid;grid-template-columns:minmax(120px,170px) 1fr 48px;gap:10px;align-items:center;font-size:.9rem}

.dim .fill{height:100%;background:var(--accent);border-radius:99px}
.dim output{font-family:var(--f-mono);text-align:right;font-size:.85rem}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}

.tablewrap{overflow-x:auto}
.pill{display:inline-flex;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:600;background:var(--surface-2)}

.advice{display:flex;flex-direction:column;gap:8px}
.advice div{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:8px;padding:9px 12px}
.plan{display:flex;flex-direction:column;gap:6px}
.plan div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.plan b{min-width:90px}
.foot{font-size:.8rem;color:var(--muted);max-width:80ch}

@media (max-width:600px){.bar{gap:8px;padding-block:6px}.bar h1{font-size:1rem;flex-basis:150px}.bar h1 small{font-size:.66rem}.idx span{display:none}.bar .home{font-size:.78rem}}

question: how was the tool taught? We will come to that in lesson three.", "For now, remember two questions. What kind of tool is it? And how was it taught? The answers tell you what proof to ask for."]}], "keyPoint": "AI, machine learning, deep learning and chatbots sit inside each other like rings. How a tool was taught is a separate question.", "plain": ["AI: any computer doing a 'thinking' job, even simple hand-written rules.", "Machine learning: works out its own rules from examples.", "Deep learning: machine learning with many layers. It reads scans.", "Generative AI, like a chatbot: writes new content."], "check": {"q": "A consultant writes a list of rules for an early-warning score. Is this AI?", "o": ["Yes, hand-written rules still count as AI", "No, it must learn from data to be AI", "Only if it uses a chatbot"], "a": 0, "e": "AI is the widest word. Hand-written rules count as AI, but they are not machine learning.", "retry": {"q": "Which of these learns its rules from examples?", "o": ["A paper flowchart", "A machine learning model", "A hand-written alert"], "a": 1, "e": "Machine learning is the kind of AI that works out rules from examples."}}, "scenario": {"title": "Your trust's three 'AI tools'", "setting": "Your trust says it uses AI in three places: a hand-written sepsis score, a readmission model that learned from 30,000 discharges, and a chatbot that drafts clinic letters.", "steps": [{"prompt": "Which one could write a sentence that nobody actually said?", "choices": [{"t": "The sepsis score", "s": 0, "fb": "No. It only follows rules someone wrote down."}, {"t": "The readmission model", "s": 0, "fb": "No. It gives a risk number, not new text."}, {"t": "The letter-drafting chatbot", "s": 2, "fb": "Right. A chatbot writes new content, so it can invent things. Someone must read every draft."}]}, {"prompt": "Which one could you check line by line?", "choices": [{"t": "The sepsis score", "s": 2, "fb": "Right. Hand-written rules can be read and audited."}, {"t": "The readmission model", "s": 1, "fb": "Partly. Simple learned models show what they weigh, but less plainly than written rules."}, {"t": "The chatbot", "s": 0, "fb": "No. Nobody can read how a chatbot chooses its words."}]}]}}, {"title": "Rules first, or examples first", "minutes": 2, "slides": [{"img": 7, "say": ["This is the single most useful idea in the course.", "On the left is ordinary software. A person writes the rules. The computer follows them. Everything it does, someone decided in advance.", "On the right is machine learning. You give it thousands of examples with the right answers, and it works out the rules for itself.", "Think of how a registrar learns. Not from a rulebook, but from seeing thousands of patients.", "That is why a computer can now read a chest film. Nobody could write down those rules by hand."]}, {"img": 9, "say": ["But there is a catch. The tool is only as good as the examples it saw.", "Imagine a sepsis alert that learned from one hospital, where ward seven admits the sickest patients. It may learn that 'ward seven' means sepsis. Take it to another hospital, and that shortcut fails.", "So a learned tool needs watching after it goes live. A hand-written rule is often better where the rules are known and the stakes are high."]}], "keyPoint": "Ordinary software is given the rules. Machine learning works them out from examples, so it is only as good as those examples.", "plain": ["Rules first: a person writes every rule. Easy to check, but misses the unexpected.", "Examples first: the machine learns from past cases. Powerful, but it can learn the wrong lesson.", "The 'ward seven' shortcut: a pattern that worked in one hospital and failed in another."], "check": {"q": "A sepsis model learned that 'ward seven' predicts sepsis. What is the best description?", "o": ["A shortcut that may fail at another hospital", "Proof that ward seven causes sepsis", "A typing error by the developers"], "a": 0, "e": "The model found a pattern, not a cause. Ward seven admitted the sickest patients at one hospital only.", "retry": {"q": "Why does a learned tool need watching after it goes live?", "o": ["Because computers wear out", "Because it may have learned patterns that do not hold for your patients", "It does not need watching"], "a": 1, "e": "A learned tool copies the patterns in its examples. Some may not hold in your setting."}}, "scenario": {"title": "Choosing a sepsis alert", "setting": "Your ward is choosing a sepsis alert. Option A is a rule set written by your consultants. Option B is a learned model from a large teaching hospital abroad.", "steps": [{"prompt": "The supplier of option B says it was 'trained on 40,000 admissions'. What do you ask first?", "choices": [{"t": "How fast does it run?", "s": 0, "fb": "Speed rarely matters here. The real question is whether its examples look like your patients."}, {"t": "Were those patients like ours?", "s": 2, "fb": "Right. A learned tool copies its examples. If they are not like your patients, it may fail."}, {"t": "What colour is the screen?", "s": 0, "fb": "No. Look at where the examples came from."}]}, {"prompt": "Nobody in your trust can monitor a learned model after go-live. Which option is safer?", "choices": [{"t": "Option A, the written rules", "s": 2, "fb": "Right. Rules do not drift. Without monitoring, a learned model can fail quietly."}, {"t": "Option B, the learned model", "s": 0, "fb": "Risky. A learned model needs someone watching it after go-live."}, {"t": "Either is equally safe", "s": 0, "fb": "No. The learned model needs ongoing checks that the rule set does not."}]}]}}, {"title": "Three ways a machine learns", "minutes": 2, "slides": [{"img": 10, "say": ["Machines learn in three main ways.", "The first is supervised learning. It learns from examples that already have the right answer, like mammograms marked 'recall' or 'no recall'. Most diagnostic AI works this way. Ask: who marked the answers, and how carefully?", "The second is unsupervised learning. It gets no answers at all. It just looks for groups, such as types of heart failure nobody had named. Ask: do these groups mean anything for patients?", "The third is reinforcement learning. It learns by trying things and seeing what happens, a bit like adjusting insulin doses over time. Ask: where did it do its trying? If the answer is 'on real patients', stop.", "Knowing the type of learning tells you which question to ask."]}], "keyPoint": "Supervised learns from marked answers, unsupervised finds groups, reinforcement learns by trial and error. Each needs a different question.", "plain": ["Supervised: learns from examples with answers. Ask who marked them.", "Unsupervised: finds groups with no answers. Ask if the groups mean anything.", "Reinforcement: learns by trying. Ask where the trying happened."], "check": {"q": "A tool learns from 200,000 mammograms, each marked 'recall' or 'no recall'. What kind of learning is this?", "o": ["Unsupervised", "Reinforcement", "Supervised"], "a": 2, "e": "It learns from examples with the answer attached, so it is supervised. Ask who marked them.", "retry": {"q": "A tool groups patients with no answers given. What kind of learning is this?", "o": ["Supervised", "Unsupervised", "Reinforcement"], "a": 1, "e": "No answers, just finding groups: that is unsupervised learning."}}, "scenario": {"title": "The insulin dosing tool", "setting": "A company offers a tool that learned the best insulin doses by trying different doses and seeing glucose results.", "steps": [{"prompt": "What kind of learning is this?", "choices": [{"t": "Reinforcement learning", "s": 2, "fb": "Right. It learned by trying actions and seeing results."}, {"t": "Supervised learning", "s": 0, "fb": "No. Nobody gave it the right dose in advance."}, {"t": "Unsupervised learning", "s": 0, "fb": "No. It was not just finding groups."}]}, {"prompt": "Which question matters most?", "choices": [{"t": "How many doses did it try?", "s": 1, "fb": "Useful, but the key point is where it tried them."}, {"t": "Where did it do its trial and error?", "s": 2, "fb": "Right. If it experimented on real patients, that is a safety concern."}, {"t": "Is it cloud-based?", "s": 0, "fb": "Not the main issue. Ask how and where it learned."}]}]}}, {"title": "A tool needs watching", "minutes": 2, "slides": [{"img": 12, "say": ["A clinical AI tool is built in six steps: collect the data, clean and label it, train the tool, test it on new data, put it into use, and then keep watching it.", "That last step, watching, is the one most often forgotten.", "Here is why it matters. A deterioration score learned from patients before 2020. In 2021 it started raising far too many alarms. Nothing in the software had changed. The patients and the way staff recorded things had changed.", "Someone was watching, so they spotted it and retrained the tool. Without that, staff would slowly have stopped trusting the alarms. That is the more dangerous failure.", "So when a tool arrives on your ward, ask one simple question. Who is watching it?"]}], "keyPoint": "A tool is never finished. Patients and practice change, so someone must watch it and retrain it when it slips.", "plain": ["Six steps: collect, prepare, train, test, use, watch.", "'Drift': the tool gets worse because the world changes, not the software.", "Always ask: who is watching it?"], "check": {"q": "A deterioration score started over-calling in 2021, though its software had not changed. Why?", "o": ["The patients and recording practice changed", "The computer was hacked", "Over-calling is normal and needs no action"], "a": 0, "e": "This is called drift. The world moved and the tool did not. Watching it catches this.", "retry": {"q": "How often should a tool be retrained?", "o": ["Every year, always", "When watching shows it has slipped", "Never, once tested"], "a": 1, "e": "There is no fixed timetable. Retrain when monitoring shows it has drifted."}}, "scenario": {"title": "The alarm nobody answers", "setting": "Nurses on your ward say the deterioration alert 'goes off all the time' and they have started ignoring it.", "steps": [{"prompt": "What is the most likely cause?", "choices": [{"t": "The nurses are careless", "s": 0, "fb": "Unlikely. Too many false alarms wear down any team."}, {"t": "The tool has drifted and now over-calls", "s": 2, "fb": "Right. If patients or recording changed, the tool may now raise too many alarms."}, {"t": "The screen is too small", "s": 0, "fb": "No. The pattern points to drift."}]}, {"prompt": "What do you do next?", "choices": [{"t": "Switch the alert off quietly", "s": 0, "fb": "Unsafe. Report it so the tool can be checked."}, {"t": "Report it to the person who owns monitoring the tool", "s": 2, "fb": "Right. They can check its accuracy and arrange retraining."}, {"t": "Tell nurses to respond to every alarm anyway", "s": 1, "fb": "Safe for now, but the tool still needs fixing."}]}]}}, {"title": "Inside a neural network", "minutes": 2, "slides": [{"img": 14, "say": ["Let's look inside a neural network. You need no maths for this.", "Patient details come in on the left: age, blood pressure, a blood result, a symptom score.", "Each line in the picture carries a number. It says how much that signal counts. We call it a weight.", "The signals pass through the middle layers and come out on the right as one answer, here a risk score.", "Learning simply means showing the network thousands of cases, comparing its answer with the truth, and nudging the numbers until it gets them right.", "This picture has 45 lines. A tool that reads chest films has millions. That is why nobody can explain exactly why a big network gave its answer."]}], "keyPoint": "A network is lots of numbers on lines. Learning means nudging those numbers. Big networks have millions, so their reasoning cannot be read.", "plain": ["Inputs go in, one answer comes out.", "Each line carries a number, called a weight.", "Training nudges the weights until answers match the truth.", "'Deep' means many middle layers."], "check": {"q": "In a neural network, what is a weight?", "o": ["The patient's body weight", "A number saying how much a signal counts", "How heavy the computer is"], "a": 1, "e": "Each line carries a weight. Training nudges the weights until the answers come out right.", "retry": {"q": "Why can't we easily explain a big network's answer?", "o": ["It has millions of numbers, none of which means a clinical idea", "It is kept secret by law", "It changes every second"], "a": 0, "e": "No single number means 'pneumonia' or 'sepsis', so the reasoning can't be read like a rule."}}, "scenario": {"title": "The unexplained risk score", "setting": "A deep learning tool gives your patient a high risk score of 0.82. Your clinical judgement says the risk is low.", "steps": [{"prompt": "Can the tool tell you exactly why it gave 0.82?", "choices": [{"t": "Yes, every network explains itself", "s": 0, "fb": "No. A large network's millions of numbers do not map to clinical reasons."}, {"t": "No, not in a way you could check", "s": 2, "fb": "Right. That is the price of a big, flexible model."}, {"t": "Only on Mondays", "s": 0, "fb": "No."}]}, {"prompt": "What should you do?", "choices": [{"t": "Follow the score, the computer knows best", "s": 0, "fb": "No. You remain accountable. Use the score as one input."}, {"t": "Review the patient, record your reasoning, and decide", "s": 2, "fb": "Right. The tool supports your decision; it does not replace it."}, {"t": "Ignore all scores from now on", "s": 0, "fb": "Too far. Weigh it, don't discard the tool entirely."}]}]}}, {"title": "Simple or complex models", "minutes": 2, "slides": [{"img": 16, "say": ["Models sit on a line. On the left are simple models, like a risk score where you can see every factor. On the right are complex ones, like deep networks and chatbots.", "Moving right lets a tool catch subtler patterns. But you lose the ability to see why it decided.", "Right is not better. It is a trade."]}, {"img": 18, "say": ["To choose a starting point, ask two questions. What is the data? And must the reasoning be visible?", "Numbers in a table, and the reasoning must be shown: start simple, with logistic regression. Images: a network built for images. Free text like letters: a language model, with a person checking it.", "The rule of thumb: start with the simplest model that could work."]}], "keyPoint": "Complex models catch more but explain less. Start with the simplest model that could work.", "plain": ["Simple model: you can see why it decided.", "Complex model: catches subtler patterns, can't explain itself.", "Pick by the data: tables, images or free text."], "check": {"q": "A board must see the reasoning behind a readmission score built from coded data. Which start makes most sense?", "o": ["A simple model, like logistic regression", "A large chatbot", "A deep image network"], "a": 0, "e": "Tables of numbers, and the reasoning must be visible: start simple.", "retry": {"q": "Moving from simple to complex models means…", "o": ["Always better accuracy", "Catching subtler patterns but losing the 'why'", "Easier checking"], "a": 1, "e": "It is a trade: subtlety for transparency."}}, "scenario": {"title": "Three in the morning", "setting": "At 3 a.m. a junior doctor sees a high discharge-risk score. She knows the sodium result was from a damaged sample.", "steps": [{"prompt": "The score comes from a simple model showing that sodium drives most of it. What can she do?", "choices": [{"t": "Override it and record why", "s": 2, "fb": "Right. She can see the faulty sodium is driving the score."}, {"t": "Nothing, scores can't be overridden", "s": 0, "fb": "No. Clinicians can and should override with a recorded reason."}, {"t": "Wait for the morning team", "s": 1, "fb": "Possible, but she has enough to act now."}]}, {"prompt": "If the score came from a complex model with no reasons shown, what changes?", "choices": [{"t": "Nothing changes", "s": 0, "fb": "It does. She can't see that the sodium is the driver."}, {"t": "She cannot tell what drove the score, so overriding is harder to justify", "s": 2, "fb": "Right. That is the hidden cost of complex models."}, {"t": "The complex model must be right", "s": 0, "fb": "No. Complex does not mean correct."}]}]}}, {"title": "How AI reads a scan", "minutes": 2, "slides": [{"img": 20, "say": ["How does AI read a scan? The image arrives as a grid of dots.", "The first layers spot simple edges, like rib margins. Later layers combine edges into shapes. The last layers spot things that matter, like a round shadow.", "At the end it gives a probability, say 0.87 for a nodule, and often a heat map showing where it looked.", "Here is the warning. A heat map shows where the tool looked, not why. Tools have been caught looking at chest drains, at the 'R' side marker, or at which hospital took the film.", "One pneumonia tool partly learned to recognise the hospital. It tested brilliantly, then failed elsewhere.", "So treat a heat map as a hint, never as proof."]}], "keyPoint": "Image AI learns edges, then shapes, then findings. A heat map shows where it looked, not why.", "plain": ["Early layers find edges; later layers find shapes and findings.", "The answer is a probability, plus a heat map.", "Heat map = where it looked. It may be looking at a drain or a marker."], "check": {"q": "What does a heat map on an AI-read scan show?", "o": ["Why the tool decided", "Where the tool looked most", "That the finding is definitely real"], "a": 1, "e": "It shows where the tool looked, which may be a lesion, a drain or a marker.", "retry": {"q": "A pneumonia tool tested brilliantly at one hospital and failed elsewhere. A likely reason?", "o": ["It learned to recognise the hospital", "The other hospitals had faster computers", "Pneumonia looks different abroad"], "a": 0, "e": "It used a shortcut: the hospital, not the disease."}}, "scenario": {"title": "The heat map on the marker", "setting": "An AI tool flags a nodule with probability 0.85. The heat map sits over the 'R' side marker in the corner, not over the lung.", "steps": [{"prompt": "What does this suggest?", "choices": [{"t": "The tool may be using a shortcut, not the lung", "s": 2, "fb": "Right. It is looking at the marker, not at a lesion."}, {"t": "The nodule is in the corner of the film", "s": 0, "fb": "No. The marker is outside the lung."}, {"t": "The heat map is decoration", "s": 0, "fb": "No. It shows where the tool looked, and that is the warning."}]}, {"prompt": "What do you do?", "choices": [{"t": "Report a nodule as the tool says", "s": 0, "fb": "No. The evidence points to a shortcut."}, {"t": "Read the film yourself and report the concern about the tool", "s": 2, "fb": "Right. Your own read decides, and the tool's behaviour needs reporting."}, {"t": "Delete the tool", "s": 0, "fb": "Too far. Report it so it can be checked."}]}]}}, {"title": "Several models, one answer", "minutes": 2, "slides": [{"img": 22, "say": ["Serious imaging tools often use several models together. Think of it as a multidisciplinary team meeting.", "Here one scan goes to three different models. They say 0.91, 0.62 and 0.79. The average is 0.77.", "But look at the middle one. It disagrees. That disagreement is useful. A good system sends a disputed case to a human reader.", "This works only if the models are truly different. Three copies of the same model, trained on the same scanner, make the same mistakes together.", "So when a supplier quotes one number, ask: is that one model or several, and how are they different?"]}], "keyPoint": "Combining different models is like an MDT. When they disagree, a person should look.", "plain": ["Several models each give an opinion.", "They are combined into one answer.", "Disagreement means: send it to a human.", "Only helps if the models are genuinely different."], "check": {"q": "Three models score a scan 0.91, 0.62 and 0.79. What should a good system do?", "o": ["Recall automatically, because the average is 0.77", "Send the case to a human reader, because they disagree", "Ignore the middle model"], "a": 1, "e": "The disagreement is the signal. A person should review disputed cases.", "retry": {"q": "When does combining models help most?", "o": ["When they are copies of each other", "When they are genuinely different", "When they all use the same scanner"], "a": 1, "e": "Different models make different mistakes, so combining them cancels some out."}}, "scenario": {"title": "The supplier's single number", "setting": "A supplier says their mammography tool is '96 per cent accurate'.", "steps": [{"prompt": "Which question helps most?", "choices": [{"t": "Is that one model or several, and how do they differ?", "s": 2, "fb": "Right. A single number can hide a committee of models."}, {"t": "Can it run on a tablet?", "s": 0, "fb": "Not the key question."}, {"t": "Has it won any awards?", "s": 0, "fb": "Awards are not evidence for your patients."}]}, {"prompt": "The models were all trained on one hospital's scanner. What is the risk?", "choices": [{"t": "None, more models is always safer", "s": 0, "fb": "No. Similar models fail together."}, {"t": "They may all make the same mistake on a different scanner", "s": 2, "fb": "Right. Diversity is the whole point."}, {"t": "They will run too slowly", "s": 1, "fb": "Possible, but the bigger risk is shared mistakes."}]}]}}, {"title": "Reading the evidence", "minutes": 3, "slides": [{"img": 24, "say": ["This is the most useful lesson in the course.", "Imagine 1,000 patients. 50 have the disease. That is five per cent, typical of screening.", "A tool catches 45 of the 50. It also flags 95 people who are well. It is ninety per cent accurate. Sounds good.", "Now, of everyone it flags, how many are really ill? 45 out of 140. About one in three. Two out of three people it flags are well.", "Nothing is wrong with the tool. It is because the disease is rare here.", "Use the same tool in a clinic where 30 per cent are ill, and about four in five flagged people are really ill.", "So never ask only 'how accurate is it?' Ask: of the people it flags, how many will really be ill, in my clinic?", "One more idea. If a tool says '70 per cent risk', it should happen about 70 times in 100. That is called calibration."]}], "keyPoint": "Accuracy alone misleads. Ask: of the people it flags, how many are really ill in my setting?", "plain": ["Rare disease + good test = many false alarms.", "Ask for the 'positive predictive value': of those flagged, how many are really ill.", "The same tool works differently in different clinics.", "Calibration: when it says 70%, it should happen 70% of the time."], "check": {"q": "A tool is 90% accurate and used where 5% have the disease. Of those it flags, roughly how many are really ill?", "o": ["About 9 in 10", "About 1 in 3", "About 3 in 4"], "a": 1, "e": "45 true cases among 140 flagged: about one in three. Rare disease means many false alarms.", "retry": {"q": "The same tool moves to a clinic where 30% are ill. What happens?", "o": ["More of the people it flags are really ill", "Fewer of the people it flags are really ill", "Nothing changes"], "a": 0, "e": "About four in five flagged people are ill there. Same tool, different setting."}}, "scenario": {"title": "The screening pilot", "setting": "Your practice pilots an AI screening tool. The supplier says: '90 per cent sensitivity, 90 per cent specificity'. About 2 in 100 of your patients have the condition.", "steps": [{"prompt": "What will most people it flags turn out to be?", "choices": [{"t": "Ill", "s": 0, "fb": "No. With a rare condition, false alarms outnumber true cases."}, {"t": "Well", "s": 2, "fb": "Right. At 2 in 100, most flags will be false alarms."}, {"t": "Exactly half ill", "s": 0, "fb": "No. It depends on how rare the condition is."}]}, {"prompt": "What should you ask the supplier?", "choices": [{"t": "What is the accuracy?", "s": 0, "fb": "That is the number that hides the problem."}, {"t": "Of people flagged in a practice like ours, how many are really ill?", "s": 2, "fb": "Right. That is the positive predictive value at your prevalence."}, {"t": "How quickly does it give results?", "s": 1, "fb": "Useful later, but ask about false alarms first."}]}]}}, {"title": "Chatbots: fluent but not always right", "minutes": 2, "slides": [{"img": 27, "say": ["Chatbots, or large language models, work differently. They write new text.", "Try this. 'The patient was commenced on…' You probably thought 'antibiotics'. That is exactly what a chatbot does. It guesses the likely next word, then the next, and so on. It does not look anything up.", "Nothing in the chatbot checks if its words are true. So it can be confident, fluent and wrong. This is called hallucination.", "Ask it for evidence, and it may give you a perfect-looking reference to a paper that does not exist.", "But it can write a good first draft of a clinic letter, because a clinician reads it before it goes anywhere.", "Use chatbots for drafting. Never treat them as a source of truth."]}], "keyPoint": "A chatbot predicts likely words. It does not check facts, so it can sound sure and be wrong.", "plain": ["It guesses the next likely word, again and again.", "It does not look anything up.", "'Hallucination': confident but false.", "Good for drafts a clinician reads. Not a source of truth."], "check": {"q": "How does a chatbot produce its answer?", "o": ["It looks up facts in a medical database", "It predicts likely next words, one after another", "It copies a textbook"], "a": 1, "e": "It predicts words. Nothing in that process checks whether they are true.", "retry": {"q": "A chatbot gives you a neat reference. What should you do?", "o": ["Trust it", "Check the paper exists", "Ask the chatbot again"], "a": 1, "e": "Chatbots can invent realistic references. Always check."}}, "scenario": {"title": "The ambient scribe", "setting": "Your clinic uses an AI scribe that listens to consultations and drafts the letter.", "steps": [{"prompt": "The draft says the patient 'denies chest pain'. You never asked about chest pain. What happened?", "choices": [{"t": "The scribe invented a likely-sounding phrase", "s": 2, "fb": "Right. That is hallucination: fluent, plausible and false."}, {"t": "The patient said it when you weren't listening", "s": 0, "fb": "Unlikely. Chatbots often add phrases that usually appear in letters."}, {"t": "It is a spelling error", "s": 0, "fb": "No. It is an invented statement."}]}, {"prompt": "What is the safe way to use the scribe?", "choices": [{"t": "Send drafts without reading to save time", "s": 0, "fb": "Unsafe. Invented statements would reach the record."}, {"t": "Read and correct every draft before signing", "s": 2, "fb": "Right. The clinician stays accountable for the letter."}, {"t": "Stop using all AI", "s": 0, "fb": "Too far. Used with checking, it saves time."}]}]}}, {"title": "Five questions for any AI tool", "minutes": 2, "slides": [{"img": 32, "say": ["To finish, here are five questions to ask about any clinical AI tool.", "One. What was it trained on, and were those patients like mine?", "Two. Who marked the answers it learned from, and how carefully?", "Three. Was it tested on truly separate data, from another hospital or another time?", "Four. Of the people it flags, how many are really ill, in my setting?", "Five. Who is watching it now, and what triggers a review?", "None of these needs maths. If a supplier can't answer them, you have learned what you need to know.", "And remember: you, not the tool, stay accountable. Well done. Now try the final case."]}], "keyPoint": "Five questions: trained on whom, labelled by whom, tested where, how many flags are real, and who is watching.", "plain": ["Trained on patients like mine?", "Who marked the answers?", "Tested on separate data?", "How many flags are real here?", "Who is watching it?"], "check": {"q": "A supplier can't say how their tool was tested or who monitors it. What should you conclude?", "o": ["It's fine, approved tools don't need monitoring", "That is your answer: be cautious", "Buy it and ask later"], "a": 1, "e": "If the makers can't answer the five questions, that tells you what you need to know.", "retry": {"q": "Who stays accountable for a decision supported by AI?", "o": ["The supplier", "The clinician", "The AI tool"], "a": 1, "e": "AI supports decisions; the clinician remains accountable."}}, "scenario": {"title": "The ten-minute meeting", "setting": "A supplier visits with a chest film triage tool. You have time for two questions.", "steps": [{"prompt": "First question?", "choices": [{"t": "Is it powered by the latest AI?", "s": 0, "fb": "That tells you nothing about your patients."}, {"t": "What was it trained on, and were those patients like ours?", "s": 2, "fb": "Right. The training population sets the limit of the tool."}, {"t": "How many hospitals use it?", "s": 1, "fb": "Popular is not the same as proven for your patients."}]}, {"prompt": "They say: 'monitoring is the hospital's job'. What do you do?", "choices": [{"t": "Accept it and buy", "s": 0, "fb": "Not until someone in your trust owns monitoring."}, {"t": "Agree a named monitoring owner before any go-live", "s": 2, "fb": "Right. No owner means nobody is watching."}, {"t": "Ask for a discount", "s": 0, "fb": "Price is not the safety issue."}]}]}}], "test": [{"q": "A tool learned from labelled chest films at one hospital. Before using it, the most important question is…", "o": ["Were those patients and scanners like ours?", "How many layers does it have?", "Is it made by a big company?"], "a": 0, "e": "A learned tool is only as good as its examples.", "lesson": 1}, {"q": "Which tool is most likely to invent a statement nobody made?", "o": ["A hand-written early-warning score", "A chatbot that drafts letters", "A risk score from coded data"], "a": 1, "e": "Generative tools write new text and can hallucinate.", "lesson": 0}, {"q": "A tool groups diabetes patients into four new types with no outcomes given. What should you ask?", "o": ["Who marked the answers?", "Do these groups mean anything for patients?", "Where did it do its trial and error?"], "a": 1, "e": "Unsupervised tools find groups; the question is whether they matter clinically.", "lesson": 2}, {"q": "Since a new admissions policy, an alert fires twice as often but finds no more sick patients. This is most likely…", "o": ["Drift", "A better tool", "Normal behaviour"], "a": 0, "e": "The world changed and the tool did not: drift.", "lesson": 3}, {"q": "Why can't a deep network explain exactly why it gave its answer?", "o": ["It has millions of numbers, none meaning a clinical idea", "The supplier hides it", "It has no numbers inside"], "a": 0, "e": "Its reasoning is spread across millions of weights.", "lesson": 4}, {"q": "For coded data where the reasoning must be shown, the best starting model is…", "o": ["A large chatbot", "A simple model like logistic regression", "Three deep networks combined"], "a": 1, "e": "Start with the simplest model that could work, especially when reasoning must be visible.", "lesson": 5}, {"q": "The heat map on a flagged film sits over a chest drain. What does that mean?", "o": ["The tool may be reacting to the drain, not disease", "The drain is diseased", "The finding is confirmed"], "a": 0, "e": "Heat maps show where the tool looked, which can be a shortcut.", "lesson": 6}, {"q": "An ensemble of models strongly disagrees on a scan. The safest action is…", "o": ["Take the average", "Send it to a human reader", "Use the highest score"], "a": 1, "e": "Disagreement is a signal for human review.", "lesson": 7}, {"q": "In screening, where disease is rare, a 90% accurate tool will…", "o": ["Mostly flag ill people", "Flag many well people", "Never give false alarms"], "a": 1, "e": "When disease is rare, false alarms outnumber true cases.", "lesson": 8}, {"q": "A tool says '70% risk'. Calibration means…", "o": ["About 70 in 100 such patients have the event", "The tool is 70% accurate", "The tool was tested 70 times"], "a": 0, "e": "Stated risks should match what actually happens.", "lesson": 8}, {"q": "A chatbot gives a confident answer with a reference. The reference…", "o": ["Must be real because it is formatted correctly", "May not exist and should be checked", "Was checked by the chatbot"], "a": 1, "e": "Chatbots can invent realistic references.", "lesson": 9}, {"q": "A supplier cannot name who will monitor their tool after go-live. You should…", "o": ["Agree a named owner before any go-live", "Go ahead; monitoring is optional", "Ask the tool to monitor itself"], "a": 0, "e": "No owner means no-one is watching.", "lesson": 10}]};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){ const e=document.createElement(tag); if(attrs) for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v);} for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k.nodeType?k:document.createTextNode(k)); return e; }
const pad = n => String(n).padStart(2,'0');
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const pct = x => Math.round(100*x);
function seg(options, value, onChange, label){ const w = h('div',{class:'seg',role:'group','aria-label':label||''}); const bs = options.map(([v,t]) => { const b = h('button',{type:'button','aria-pressed':String(v===value)}, t); b.onclick = () => { bs.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onChange(v); }; return b; }); w.append(...bs); return w; }

/* ---------------- learner state ---------------- */
const KEY = 'cg:' + CH.id;
const blank = () => ({ v:2, starter:null, plan:null, lessons:{}, test:null, secs:0, updated:0, name:'' });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch(e){ S = blank(); }
function save(){ S.updated = Date.now(); S.meta = {title:CH.title, num:CH.num, index:metrics().index, level:metrics().level, lessons:CH.lessons.length, done:Object.values(S.lessons).filter(l=>l.done).length, test:!!S.test};
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} renderChip(); renderMenu(); }
function L(i){ return S.lessons[i] || (S.lessons[i] = {watched:false, check:null, retry:null, caseScore:0, caseMax:0, caseDone:false, done:false, secs:0}); }

/* ---------------- metrics (Learning Index) ----------------
   Knowledge 35%: first-attempt quick checks + latest final-test answers correct
   Application 35%: points earned in case simulations (each choice 0–2)
   Self-awareness 15%: how often your confidence matched your answer (sure & right, or unsure & wrong)
   Completion 15%: lessons completed + final test taken
   Levels follow Benner's novice-to-expert stages (shortened for a short course). */
const LEVELS = [[0,'Novice','Starting out: knows the words, needs support to apply them'],[40,'Advanced beginner','Recognises the main ideas in familiar cases'],[60,'Competent','Applies the ideas to new cases and asks the right questions'],[80,'Proficient','Judges tools confidently and explains why to colleagues']];
function metrics(){
  const n = CH.lessons.length; let kOk=0,kN=0,aPts=0,aMax=0,cal=0,calN=0,done=0;
  for (let i=0;i<n;i++){ const l = S.lessons[i]; if (!l) continue;
    if (l.check){ kN++; if (l.check.ok) kOk++; if (l.check.conf){ calN++; if ((l.check.conf==='sure')===l.check.ok) cal++; } }

    if (st.caseDone){ host.append(h('p',{class:'fb'}, h('span',{class: st.caseScore>=maxPts*0.75?'pill good':st.caseScore>=maxPts/2?'pill warn':'pill bad'}, `You scored ${st.caseScore} of ${maxPts}`), ' ', h('button',{class:'btn small',type:'button',onclick:()=>{ st.caseDone=false; st.caseScore=0; save(); renderCase(); }},'Try the case again'))); finishRow(); return; }
    function step(){
      const s = sc.steps[k]; const box = h('div',{class:'stepbox'}, h('p',{class:'q'}, `${k+1}. ${s.prompt}`)); const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
      s.choices.forEach(ch => { const b = h('button',{class:'opt',type:'button'}, ch.t); b.onclick = () => {
        opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ch.s===2?'right':ch.s===1?'part':'wrong');
        if (ch.s<2){ const best = s.choices.find(c=>c.s===2); if (best) [...opts.children].find(x=>x.textContent===best.t).classList.add('right'); }
        pts += ch.s; fb.innerHTML = `<b>${ch.s===2?'Good call.':ch.s===1?'Partly.':'Not the best choice.'}</b> ${ch.fb}`;
        k++; if (k < sc.steps.length) step(); else { st.caseDone = true; st.caseScore = pts; st.caseMax = maxPts; st.done = st.done || !!st.check; save(); renderSteps();
          host.append(h('p',{class:'fb',style:'margin-top:12px'}, h('span',{class: pts>=maxPts*0.75?'pill good':pts>=maxPts/2?'pill warn':'pill bad'}, `Case score: ${pts} of ${maxPts}`))); finishRow(); } };
        opts.append(b); });
      box.append(opts, fb); host.append(box);
    }
    step();
  }
  function finishRow(){
    st.done = !!(st.check && st.caseDone); save();
    const next = i < CH.lessons.length-1 ? h('button',{class:'btn primary',type:'button',onclick:()=>go('l'+(i+1))}, `Next: lesson ${i+2}`) : h('button',{class:'btn primary',type:'button',onclick:()=>go('final')}, 'Go to the final case test');
    caseCard.append(h('div',{class:'row',style:'margin-top:14px'}, next, h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my progress')));
  }
  renderCheck(); renderCase(); layout();
}

/* generic question with confidence rating */
function askQuestion(host, q, practice, onDone, isRetry){
  const box = h('div'); host.append(box);
  if (!isRetry || true) box.append(h('p',{class:'q'}, q.q));
  let conf = null;
  const confSeg = seg([['sure','I\'m sure'],['unsure','I\'m not sure']], null, v=>conf=v, 'Confidence');
  if (!practice) box.append(h('div',{class:'conf'}, h('span',null,'Before you answer, how sure are you?'), confSeg, h('span',{style:'font-size:.8rem'},'(optional, helps your self-awareness score)')));
  const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
  q.o.forEach((o,j)=>{ const b = h('button',{class:'opt',type:'button'}, o); b.onclick = () => {
    const ok = j===q.a; opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ok?'right':'wrong'); if (!ok) opts.children[q.a].classList.add('right');
    fb.innerHTML = `<b>${ok?'Right.':'Not quite.'}</b> ${q.e}`; onDone(ok, conf); };
    opts.append(b); });
  box.append(opts, fb);
}

/* ---------------- FINAL case test ---------------- */
function renderFinal(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'Final case test'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Check your learning path'), h('p',{class:'lede',style:'margin-top:6px'}, `${CH.test.length} short questions across all ${CH.lessons.length} lessons. You see the answer after each one. Your latest attempt counts towards your learning index, and the results show which lessons to revisit.`)));
  if (M.done < CH.lessons.length) main.append(h('div',{class:'card',style:'background:var(--signal-soft)'}, h('p',null, `You have finished ${M.done} of ${CH.lessons.length} lessons. You can take the test now, but you will probably score higher after finishing them.`)));
  const host = h('div',{class:'card'}); main.append(host);
  if (S.test) { host.append(h('p',null, h('span',{class:'pill acc'}, `Last attempt: ${S.test.score} of ${CH.test.length}`), ` · ${S.test.attempts} attempt${S.test.attempts>1?'s':''}`), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Take the test again'), h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my results'))); return; }
  host.append(h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Start the test'));
}
function runTest(host){
  const answers = []; let k = 0;
  const prog = h('p',{class:'eyebrow'}); host.append(prog); const qhost = h('div'); host.append(qhost);
  function next(){
    qhost.innerHTML=''; prog.textContent = `Question ${k+1} of ${CH.test.length} · from lesson ${CH.test[k].lesson+1}: ${CH.lessons[CH.test[k].lesson].title}`;
    askQuestion(qhost, CH.test[k], false, (ok, conf) => { answers.push({ok, conf, lesson: CH.test[k].lesson});
      qhost.append(h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ k++; if (k<CH.test.length) next(); else finish(); }}, k<CH.test.length-1?'Next question':'See my results'))); });
  }
  function finish(){ const score = answers.filter(a=>a.ok).length; S.test = {answers, score, attempts:(S.test?S.test.attempts:0)+1, at:Date.now()}; save(); go('progress'); }
  next();
}

/* ---------------- PROGRESS: learning index, advice, certificate ---------------- */
function gaugeSVG(v){
  const r=60, c=2*Math.PI*r, f=c*v/100;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Learning index ${v} out of 100"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${v}</text><text x="75" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">out of 100</text></svg>`;
}
function advice(){
  const out = []; const n = CH.lessons.length;
  const testBy = {}; if (S.test) S.test.answers.forEach(a=>{ (testBy[a.lesson] = testBy[a.lesson]||{ok:0,n:0}); testBy[a.lesson].n++; if (a.ok) testBy[a.lesson].ok++; });
  const weak = [];
  for (let i=0;i<n;i++){ const l = S.lessons[i]; const reasons = [];
    if (l && l.check && !l.check.ok) reasons.push('missed the quick check');
    if (l && l.caseDone && l.caseScore < l.caseMax*0.5) reasons.push(`scored ${l.caseScore} of ${l.caseMax} on the case`);
    if (testBy[i] && testBy[i].ok < testBy[i].n) reasons.push(`${testBy[i].n-testBy[i].ok} final-test question${testBy[i].n-testBy[i].ok>1?'s':''} wrong`);
    if (reasons.length) weak.push([i, reasons]); }
  weak.sort((a,b)=>b[1].length-a[1].length).slice(0,3).forEach(([i,r])=>out.push(['Revisit', `Lesson ${i+1}, ${CH.lessons[i].title}: you ${r.join(', ')}. Try it in Read mode and open "Explain more simply".`, 'l'+i]));
  const nf = [...Array(n).keys()].find(i=>!(S.lessons[i]&&S.lessons[i].done));
  if (nf!==undefined) out.push(['Next', `Carry on with lesson ${nf+1}, ${CH.lessons[nf].title}.`, 'l'+nf]);
  else if (!S.test) out.push(['Next', 'All lessons done. Take the final case test to check your learning path.', 'final']);
  const M = metrics();
  if (M.calN >= 4 && M.C < 0.6) out.push(['Self-awareness', 'Your confidence often did not match your answers. In clinical work, knowing when you are unsure matters as much as knowing the answer. Keep rating your confidence.', null]);
  if (S.plan && S.secs > 0){ const done = Object.values(S.lessons).filter(l=>l.done); const avg = done.length ? done.reduce((a,l)=>a+l.secs,0)/done.length/60 : 0;
    if (avg >= 0.5) out.push(['Your pace', `You spend about ${avg.toFixed(1)} minutes per lesson. ${avg > 6 ? 'Taking your time is fine. Shorter sittings may suit you better: try 5-minute sittings on the Start page.' : avg < 2.5 ? 'You move quickly. If the cases feel easy, the Fast track path lets you skip straight to them.' : 'That fits your plan well.'}`, null]); }
  if (!out.length) out.push(['Well done', 'No gaps found. You could teach this chapter to a colleague.', null]);
  return out;
}
function renderProgress(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'My progress'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Your learning index'), h('p',{class:'lede',style:'margin-top:6px'}, S.test ? 'Based on your lessons, cases and final test.' : 'Provisional until you take the final case test.')));
  const dims = [['Knowledge', M.K, 'Quick checks right first time, plus final-test answers'], ['Applying it', M.A, 'Points from the case simulations'], ['Self-awareness', M.C, 'How often your confidence matched your answer'], ['Completion', M.P, 'Lessons finished and final test taken']];
  const dimsEl = h('div',{class:'dims'}, dims.map(([n,v,d])=>h('div',null, h('div',{class:'dim'}, h('span',null,n), h('div',{class:'track'}, h('div',{class:'fill',style:`width:${v==null?0:pct(v)}%`})), h('output',null, v==null?'—':pct(v)+'%')), h('div',{style:'font-size:.78rem;color:var(--muted);margin:-4px 0 0'}, d))));
  const ladder = h('div',{class:'ladder'}, LEVELS.map(l=>h('div',{class: l[1]===M.level?'on':''}, l[1], h('br'), `${l[0]}+`)));
  main.append(h('div',{class:'card'}, h('div',{class:'gauge'}, h('div',{html:gaugeSVG(M.index)}), h('div',{style:'flex:1;min-width:240px'}, h('h3',null, M.level), h('p',{class:'lede'}, M.levelText), ladder)), h('div',{style:'margin-top:16px'}, dimsEl),
    h('p',{class:'foot',style:'margin-top:12px'},'How it is worked out: knowledge 35%, applying it 35%, self-awareness 15%, completion 15%. Levels follow Benner\'s "novice to expert" stages used in clinical education.')));
  const adv = h('div',{class:'advice'}, advice().map(([t,txt,v])=>h('div',null, h('span',{class:'pill acc',style:'flex:none'},t), h('span',{style:'flex:1'},txt), v ? h('button',{class:'btn small',type:'button',onclick:()=>go(v)},'Go') : null)));
  main.append(h('div',{class:'card'}, h('h3',null,'What to do next'), adv));
  const rows = CH.lessons.map((les,i)=>{ const l = S.lessons[i]||{}; return h('tr',null, h('td',null, `${i+1}. ${les.title}`), h('td',null, l.watched?'✓':'—'), h('td',null, l.check ? (l.check.ok ? h('span',{class:'pill good'},'Right') : h('span',{class:'pill warn'},'Missed')) : '—'), h('td',null, l.caseDone ? `${l.caseScore}/${l.caseMax}` : '—'), h('td',{class:'mono'}, l.secs ? (l.secs<60 ? '<1 min' : Math.round(l.secs/60)+' min') : '—')); });
  main.append(h('div',{class:'card'}, h('h3',null,'Lesson by lesson'), h('div',{class:'tablewrap'}, h('table',{class:'t'}, h('thead',null,h('tr',null, ['Lesson','Watched','Check','Case','Time'].map(t=>h('th',null,t)))), h('tbody',null,rows))),
    S.test ? h('p',{style:'margin-top:10px'}, h('span',{class:'pill acc'}, `Final test: ${S.test.score} of ${CH.test.length}`)) : null));
  // certificate
  const nameIn = h('input',{type:'text',id:'certName',placeholder:'Your name as it should appear',value:S.name||''});
  const certBtn = h('button',{class:'btn primary',type:'button'},'Download certificate');
  const note = h('p',{class:'foot'});
  const eligible = S.test && M.index >= 60;
  certBtn.disabled = !eligible; note.textContent = eligible ? 'Saves a picture of your certificate. Your score is calculated in your own browser, so keep the file as your record.' : 'Available once you have taken the final case test and reached Competent (60 or more).';
  certBtn.onclick = () => { S.name = nameIn.value.trim(); save(); makeCert(S.name || 'Learner', M); };
  main.append(h('div',{class:'card'}, h('h3',null,'Certificate'), h('div',{class:'row'}, nameIn, certBtn), note,
    h('div',{class:'row',style:'margin-top:14px'}, h('button',{class:'btn small',type:'button',onclick:()=>{ resetBox.hidden = false; }},'Start this chapter again'))));
  const resetBox = h('div',{class:'card',hidden:true,style:'background:var(--bad-soft)'}, h('p',null,'This clears your plan, answers and scores for this chapter in this browser. It cannot be undone.'), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn',type:'button',onclick:()=>{ S = blank(); save(); go('start'); }},'Yes, clear this chapter'), h('button',{class:'btn',type:'button',onclick:()=>{ resetBox.hidden=true; }},'Keep my progress')));
  main.append(resetBox);
}
function makeCert(name, M){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1130; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0,0,1600,1130); x.strokeStyle = '#0E6B66'; x.lineWidth = 14; x.strokeRect(40,40,1520,1050); x.lineWidth = 2; x.strokeRect(70,70,1460,990);
  x.fillStyle = '#0E6B66'; x.textAlign = 'center'; x.font = '600 30px Georgia, serif'; x.fillText('A CLINICAL GUIDE TO AI IN HEALTHCARE', 800, 180);
  x.fillStyle = '#14232A'; x.font = '600 72px Georgia, serif'; x.fillText('Certificate of learning', 800, 290);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('This is to record that', 800, 380);
  x.fillStyle = '#14232A'; x.font = '600 64px Georgia, serif'; x.fillText(name.slice(0,48), 800, 470);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('has completed', 800, 550);
  x.fillStyle = '#14232A'; x.font = '600 40px Georgia, serif'; x.fillText((CH.num==='A'?'Appendix A: ':'Chapter '+CH.num+': ') + CH.title, 800, 620, 1400);
  x.fillStyle = '#0E6B66'; x.font = '600 46px Arial, sans-serif'; x.fillText(`Learning index ${M.index} / 100  ·  ${M.level}`, 800, 740);
  x.fillStyle = '#55686D'; x.font = '24px Arial, sans-serif';
  x.fillText(`Knowledge ${pct(M.K)}%   ·   Applying it ${pct(M.A)}%   ·   Self-awareness ${M.C==null?'—':pct(M.C)+'%'}   ·   Final test ${S.test.score}/${CH.test.length}`, 800, 800);
  x.fillText('Issued ' + new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) + '  ·  Self-assessed online course record, calculated in the learner\'s browser', 800, 980);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `certificate-${CH.id}.png`; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); });
}

/* ---------------- boot ---------------- */
$('#chNum').textContent = CH.num==='A' ? 'Appendix A' : 'Chapter '+CH.num;
$('#chTitle span').textContent = CH.title;
const hv = (location.hash||'').slice(1);
go(views().includes(hv) ? hv : (S.plan ? 'l'+firstUnfinished() : 'start'));
</script>
