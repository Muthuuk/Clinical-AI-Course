?", "choices": [{"t": "The sepsis alert", "s": 0, "fb": "No. It produces a score and stops."}, {"t": "The letter drafter", "s": 1, "fb": "It needs every draft read, but it does not act on patients."}, {"t": "The work-up assistant", "s": 2, "fb": "Right. It acts across steps, so every action must pass a human gate."}]}]}}, {"title": "What they all share", "minutes": 2, "slides": [{"img": 7, "say": ["Before we look at each family, let's see what they have in common. Read this picture from top to bottom.", "At the top is machine learning. That means a computer that learns patterns from examples, instead of following rules someone wrote by hand.", "Inside it are three ways of learning: supervised, unsupervised and reinforcement. We will come to those next.", "Below that is deep learning. It is the most powerful kind of machine learning. It uses many layers of calculation and works out for itself which features in the data matter.", "A common mix-up: deep learning is not something separate from machine learning. It is one kind of it.", "The stack then splits into two applied fields. Natural language processing works with text, such as notes and letters. Computer vision works with images, such as scans and slides.", "At the bottom are everyday clinical tasks: triage, help with diagnosis, documentation, monitoring and decision support.", "Here is one path through the stack. An early-warning tool learns from past cases where the outcome is known. It is built as a deep network. It reads numbers, not pictures. And it feeds the monitoring task.", "The one-line takeaway: deep learning is the shared engine. The families differ only in what they are asked to produce."]}], "keyPoint": "All three families rest on machine learning and deep learning. They differ only in what they are asked to produce.", "plain": ["Machine learning: learns patterns from examples, not hand-written rules.", "Deep learning: the most powerful kind of machine learning, with many layers. It is part of machine learning, not separate.", "Language processing works with text; computer vision works with images.", "Same engine, different jobs."], "check": {"q": "How does deep learning relate to machine learning?", "o": ["It is one kind of machine learning", "It replaced machine learning", "It is a kind of computer vision"], "a": 0, "e": "Deep learning is the most powerful kind of machine learning. It sits inside it, not beside it.", "retry": {"q": "Which applied field works with scans and slides?", "o": ["Natural language processing", "Computer vision", "Reinforcement learning"], "a": 1, "e": "Computer vision works with images. Natural language processing works with text."}}, "scenario": {"title": "The supplier's buzzwords", "setting": "A supplier presents a tool that reads pathology slides. The brochure says it uses 'deep learning, not machine learning' and 'natural language processing'.", "steps": [{"prompt": "What is wrong with 'deep learning, not machine learning'?", "choices": [{"t": "Nothing, they are rivals", "s": 0, "fb": "No. Deep learning is one kind of machine learning."}, {"t": "Deep learning is part of machine learning, so the claim does not make sense", "s": 2, "fb": "Right. It is a sign the brochure is using words loosely."}, {"t": "Deep learning is older and weaker", "s": 0, "fb": "No. Deep learning is the most powerful kind of machine learning."}]}, {"prompt": "A tool that reads slides belongs to which applied field?", "choices": [{"t": "Computer vision", "s": 2, "fb": "Right. Slides are images, so this is computer vision, not language processing."}, {"t": "Natural language processing", "s": 0, "fb": "No. That works with text, not pictures."}, {"t": "Both equally", "s": 1, "fb": "Only if it also reads the written report. Reading slides is computer vision."}]}]}}, {"title": "Three ways to learn", "minutes": 2, "slides": [{"img": 9, "say": ["A machine can be taught in three ways. The only real difference is the kind of feedback it gets.", "Supervised learning learns from labelled examples. Labelled just means past cases where we already know the answer. Show it thousands of scans marked normal or abnormal, and it learns to label new ones.", "This is the workhorse of clinical AI, because medical records already contain the answers: a confirmed diagnosis, a known length of stay.", "The catch: it needs accurate labels, and lots of them. A supervised tool is only ever as good as its labels.", "If past labels were skewed, the tool learns the skew. One real tool under-served Black patients this way, because it leaned on health-cost data that tracked race.", "Unsupervised learning gets no labels. It just groups similar cases, for example sorting patients into subtypes. A person still has to work out what the groups mean.", "Reinforcement learning learns by trial and feedback. It suits decisions made in sequence, such as adjusting a treatment over time. But it is hard to test safely on real patients.", "One more warning. A tool that shines on tidy study data can stumble on messy real-world data.", "For the ward, the lesson is this. Knowing how a tool learned is your first clue to where it might go wrong."]}], "keyPoint": "Supervised learns from labelled answers, unsupervised finds groups, reinforcement learns by trial. A supervised tool is only as good as its labels.", "plain": ["Supervised: learns from past cases with known answers. Most clinical AI.", "Unsupervised: groups similar cases. A person must say what the groups mean.", "Reinforcement: learns by trial and feedback. Hard to test safely on patients.", "Skewed labels teach a skewed tool."], "check": {"q": "Why is supervised learning the workhorse in hospitals?", "o": ["It needs no data", "Records already contain the answers, such as confirmed diagnoses", "It is the only kind that works with images"], "a": 1, "e": "Supervised learning needs past cases with known answers, and medical records naturally provide them.", "retry": {"q": "A tool groups patients into subtypes without being told any answers. Which way of learning is this?", "o": ["Supervised", "Reinforcement", "Unsupervised"], "a": 2, "e": "No labels, just finding groups: that is unsupervised learning."}}, "scenario": {"title": "The research proposal", "setting": "A research team asks your ethics committee to approve a tool that learns the best insulin doses by trying doses on patients and watching the results.", "steps": [{"prompt": "Which way of learning is this, and what is the concern?", "choices": [{"t": "Reinforcement learning, and it is hard to test safely on real patients", "s": 2, "fb": "Right. Learning by trial and feedback on patients is the chapter's named concern."}, {"t": "Supervised learning, and the labels may be wrong", "s": 0, "fb": "No. Nobody gives it the right dose in advance. It learns by trying."}, {"t": "Unsupervised learning, and the groups may mean nothing", "s": 0, "fb": "No. It is not grouping cases."}]}, {"prompt": "The team also offers a supervised tool that learned from past records of which patients were readmitted. What do you ask first?", "choices": [{"t": "How accurate are the labels, and were they skewed?", "s": 2, "fb": "Right. A supervised tool is only as good as its labels, and skewed labels teach a skewed tool."}, {"t": "How fast does it run?", "s": 0, "fb": "Speed is not the key question."}, {"t": "How many records did it use?", "s": 1, "fb": "Useful, but quality of the labels matters more than their number."}]}]}}, {"title": "Predictive: they sort", "minutes": 3, "slides": [{"img": 10, "say": ["Now the first family in detail: predictive systems. This is the oldest and best-tested family.", "Follow the boxes left to right. An input arrives, such as an eye photograph. It is turned into numbers. The model scores them. Out comes a probability or a label.", "In the example, the tool gives a 0.93 chance of disease needing referral. The clinician confirms. It scored the image. It did not write anything.", "One key idea is calibration. If the tool says ninety per cent, about ninety in a hundred such patients should really have the condition.", "Calibration is not accuracy. Accuracy is how often it is right. Calibration is whether its stated chances come true. A tool can have one without the other."]}, {"img": 12, "say": ["How do predictive tools fail? The key word is silent.", "They never crash or refuse. They answer every input. They look just as confident when wrong as when right. So a wrong label arrives with no flag.", "Two forces cause this. The world shifts: new patients, a new scanner, a new way of coding. Or the labels were skewed, as in the cost-based tool.", "The watching needed is specific. Not reading every output. Three habits instead. Test it on your own patients first. Check its numbers stay calibrated. Keep monitoring for drift.", "Done this way, this is the safest family of the three."]}], "keyPoint": "Predictive tools sort an input into a label or score and never create anything. They fail silently, so test locally, check calibration and keep monitoring.", "plain": ["Input goes in, a score or label comes out. It sorts; it never writes.", "Calibration: if it says ninety per cent, about ninety in a hundred should have the condition.", "The failure is silent: a wrong answer looks just as confident as a right one.", "Three habits: test locally, check calibration, monitor for drift."], "check": {"q": "A well-calibrated tool gives a group of patients a score of 0.9. What should you expect?", "o": ["About 90 in every 100 of them have the condition", "The tool is right 90 per cent of the time on all tasks", "90 per cent of the data was used"], "a": 0, "e": "Calibration means stated chances match what really happens. A score of 0.9 should come true about nine times in ten.", "retry": {"q": "What is the defining limit of a predictive tool?", "o": ["It cannot work with images", "It sorts what it is given but never creates new content", "It needs a human gate before every action"], "a": 1, "e": "A predictive tool draws a line between classes. It sorts, it does not write."}}, "scenario": {"title": "The early-warning tool", "setting": "A supplier's deterioration tool scored brilliantly in a published study at a large hospital abroad. Your district general hospital serves an older population and uses different monitors.", "steps": [{"prompt": "What is your main concern?", "choices": [{"t": "The tool will start writing false notes", "s": 0, "fb": "No. Predictive tools do not write anything."}, {"t": "The shift in patients and equipment could undo its published performance, silently", "s": 2, "fb": "Right. Different population, different monitors: the classic cause of silent failure."}, {"t": "The tool will refuse to give answers", "s": 0, "fb": "No. The danger is the opposite: it answers confidently even when it should not."}]}, {"prompt": "The supplier says it is '92 per cent accurate'. What do you ask?", "choices": [{"t": "Is it also calibrated? When it says 80 per cent, do about 80 in 100 deteriorate?", "s": 2, "fb": "Right. Accuracy and calibration are different, and a tool can have one without the other."}, {"t": "Can it run on tablets?", "s": 0, "fb": "Not the key question."}, {"t": "How many hospitals use it?", "s": 1, "fb": "Popularity is weak evidence. Ask about calibration on patients like yours."}]}, {"prompt": "Your IT lead suggests a nurse reads every score before it is shown. Is that the right oversight?", "choices": [{"t": "Yes, review everything", "s": 0, "fb": "No. That defeats the purpose of an alert. The habits are test, calibrate and monitor."}, {"t": "No. Test it on your own patients first, then check calibration and monitor for drift", "s": 2, "fb": "Right. Predictive tools need specific, ongoing checks, not a reader for every output."}, {"t": "Just switch it on and see", "s": 0, "fb": "Unsafe. Silent errors would go unnoticed."}]}]}}, {"title": "Generative: they write", "minutes": 2, "slides": [{"img": 13, "say": ["The second family does something the first cannot. It produces new material: text, a summary, an answer.", "Compare it with the eye tool. That one scored an image and wrote nothing. This one writes something that did not exist before. That is both its value and its danger.", "Follow the flow. A huge amount of text is used to train a foundation model. That is a big, general-purpose model that can later be adapted to many jobs.", "The engine inside is surprisingly simple. It predicts the next word. Then the next. Again and again.", "The foundation model is then adapted to a clinical purpose, either by extra training or by careful instructions.", "Now it can draft a note, summarise a record, or answer a question.", "Look at the amber gate. Every one of those outputs passes a human review before it reaches the record. The gate is drawn as part of the system, not as an extra.", "The red note names the hazard: hallucination. Ask the tool to summarise a clinic letter, and it may quietly invent a medicine the patient never took. Fluent, confident, and wrong."]}], "keyPoint": "A generative tool predicts the next word, over and over, to write new text. A human review gate is part of the system, not an optional extra.", "plain": ["It writes something new, unlike a predictive tool which only sorts.", "Underneath, it guesses the next word, again and again.", "Hallucination: a fluent, confident sentence that is false.", "Every output passes a human reader before it reaches the record."], "check": {"q": "In plain terms, how does a large language model produce text?", "o": ["It looks up answers in a medical database", "It copies paragraphs from the record", "It predicts the next word, again and again"], "a": 2, "e": "The engine is next-word prediction, repeated. Nothing in that checks whether the words are true.", "retry": {"q": "What is hallucination?", "o": ["A fluent, confident output that is false", "A tool refusing to answer", "A crash caused by too much data"], "a": 0, "e": "Hallucination is a believable but untrue output, stated as confidently as a true one."}}, "scenario": {"title": "The invented medicine", "setting": "A language model summarises a long clinic letter for the ward. The summary lists a blood thinner that the patient has never taken.", "steps": [{"prompt": "What happened?", "choices": [{"t": "The patient forgot to mention stopping it", "s": 0, "fb": "Unlikely. The medicine appears nowhere in the source letter."}, {"t": "The tool hallucinated a plausible medicine", "s": 2, "fb": "Right. It predicted likely words, and a blood thinner often appears in such letters."}, {"t": "A typing error", "s": 0, "fb": "No. A whole invented medicine is not a typo."}]}, {"prompt": "Which safeguard would have caught this?", "choices": [{"t": "Trusting the summary because it reads well", "s": 0, "fb": "No. Reading well is exactly what makes hallucination dangerous."}, {"t": "A clinician checking the summary against the source letter before it enters the record", "s": 2, "fb": "Right. The human review gate is part of the system for this reason."}, {"t": "Asking a second language model to check it", "s": 1, "fb": "It may help, but a second writer is not a reader. A person must check against the source."}]}]}}, {"title": "Plausible is not true", "minutes": 2, "slides": [{"img": 15, "say": ["Let's look harder at the risk. The headline is: plausibility is not truth.", "The tool's strength and its danger are the same thing. It is built to produce language that sounds right. When it has no good answer, it does not fall silent. It produces a confident one anyway.", "There is a human half to this risk too. We call it automation bias. It is our habit of waving through a smooth, confident answer without checking. It gets worse under time pressure on a busy ward.", "So the risk is part machine, part human. And because it is built into how these tools work, not an occasional glitch, several authors argue they need their own stricter rules.", "The safeguard is simple to say. Every clinically important output is read by a competent person, ideally against the source, before it counts.", "And design the workflow so that review is easy. A rushed review becomes a rubber stamp.", "Try this in your head. A fluent discharge summary with one invented medicine. Skimming it at the end of a long shift, would you spot it?", "Here is the rule. A system that writes must be checked by a reader, every time."]}], "keyPoint": "Generative tools are built to sound right, and busy people tend to wave through confident text. So a system that writes must be checked by a reader, every time.", "plain": ["Sounding right and being right are different things.", "Automation bias: we accept smooth, confident text without checking, especially when busy.", "The risk is built in, so review is built in too.", "Make review easy, or it becomes a rubber stamp."], "check": {"q": "What is automation bias?", "o": ["A tool favouring certain patients", "Our tendency to accept smooth, confident output without checking", "Bias caused by automated data entry"], "a": 1, "e": "Automation bias is the human half of the risk. It gets worse under time pressure.", "retry": {"q": "A generative tool has no good answer to your question. What does it usually do?", "o": ["Says it does not know", "Crashes", "Produces a confident answer anyway"], "a": 2, "e": "It is built to sound plausible, so it fills the gap with confident text rather than staying silent."}}, "scenario": {"title": "The end-of-shift letters", "setting": "Your clinic has introduced an AI letter drafter. Doctors are asked to approve twenty drafts in the last ten minutes of the day.", "steps": [{"prompt": "What is the problem with this arrangement?", "choices": [{"t": "Twenty letters is too few to be worth it", "s": 0, "fb": "No. The problem is the review, not the number."}, {"t": "Rushed review becomes a rubber stamp, so invented details will slip through", "s": 2, "fb": "Right. Automation bias is worst under time pressure. Review must be real."}, {"t": "The tool should write fewer letters", "s": 0, "fb": "No. The fix is in how review is done."}]}, {"prompt": "A consultant says the drafts 'always read perfectly' so a quick skim is enough. What do you say?", "choices": [{"t": "Agree, good writing means good content", "s": 0, "fb": "No. Plausible is not true. Smooth text is exactly what hides a hallucination."}, {"t": "Reading well is not the same as being right. Each letter should be checked against the notes", "s": 2, "fb": "Right. A system that writes must be checked by a reader, every time."}, {"t": "Suggest checking one letter in five", "s": 1, "fb": "Better than nothing, but four in five would reach patients unchecked."}]}]}}, {"title": "Agentic: they act", "minutes": 3, "slides": [{"img": 16, "say": ["The third family is the newest and least settled. If a predictive tool judges and a generative tool writes, an agent acts.", "An agent does not stop at an answer. It works towards a goal across several steps.", "Three ingredients make it agentic. A goal, not just a question. Tools, such as searching a guideline or querying the record. And memory, so it can plan ahead.", "Follow the loop. The agent looks at the chart. It plans. It acts, using a tool. It checks the result and remembers it. And round again.", "Now the amber gate at the bottom. A triage assistant spots a rising early-warning score. It plans an escalation and drafts the orders. Then it stops and waits for a clinician to approve."]}, {"img": 18, "say": ["The signature danger here is the snowball. The agent misreads one result. It plans on that mistake. It orders on that mistake. Then it acts on it, several times over.", "A single score or draft contains its own mistake. A chain of actions does not. The error feeds the next step and grows as it travels.", "So the rule is firm. Any step that touches a patient passes a human gate first. That gate is a hard boundary, not a suggestion.", "Agentic systems are still immature. Almost all real deployments keep a person firmly in the loop."]}], "keyPoint": "An agent pursues a goal across steps using tools and memory. One early error can snowball, so any step that touches a patient passes a human gate first.", "plain": ["Three ingredients: a goal, tools, and memory.", "The loop: look, plan, act, check, and round again.", "An early mistake feeds every later step and grows.", "Gate every action that touches a patient. Agents are still immature."], "check": {"q": "Which three ingredients make a system agentic?", "o": ["A goal, tools and memory", "Labels, features and a classifier", "A text corpus and careful instructions"], "a": 0, "e": "An agent pursues a goal, uses tools such as record queries, and keeps a memory so it can plan over several steps.", "retry": {"q": "Why are mistakes by agentic systems especially dangerous?", "o": ["They are always large and dramatic", "One early mistake feeds the next step and grows", "They only happen during training"], "a": 1, "e": "A chain of actions lets an early error travel and snowball before anyone notices."}}, "scenario": {"title": "Where to put the gate", "setting": "Your trust is piloting a triage assistant. It reads vital signs, plans an escalation, drafts orders, and can send them to pharmacy. The project lead wants it fully automatic to save time.", "steps": [{"prompt": "Where must a human gate sit?", "choices": [{"t": "Before any step that acts on the patient, such as sending orders", "s": 2, "fb": "Right. The gate stops an early misreading from travelling into orders and treatment."}, {"t": "Only at the end of the week, in an audit", "s": 0, "fb": "Too late. By then an error has acted on the patient many times."}, {"t": "Before it reads the vital signs", "s": 0, "fb": "Reading data is harmless. The gate belongs before actions."}]}, {"prompt": "The lead says the assistant 'is autonomous, so it replaces the clinician'. What is the right correction?", "choices": [{"t": "Agreed, that is what agentic means", "s": 0, "fb": "No. Agentic does not mean unsupervised."}, {"t": "Responsible deployments keep a person firmly in the loop; the technology is still immature", "s": 2, "fb": "Right. More autonomy demands tighter oversight, not less."}, {"t": "It can replace junior staff but not consultants", "s": 1, "fb": "No. The gate is about patient safety, not seniority."}]}]}}, {"title": "Match the tool to the task", "minutes": 3, "slides": [{"img": 19, "say": ["Now a method you can use on any proposed tool. Ask three questions, in order.", "First, what output does the task need? A score points to predictive. New text points to generative. A chain of actions points to agentic.", "Second, how does that kind of tool fail? A quiet wrong number, a confident wrong sentence, or a snowballing mistake.", "Third, how much watching does that demand? Decide before go-live.", "The table shows it in action. Flagging deterioration from vital signs: predictive, so monitor its numbers. Drafting a discharge summary: generative, so a clinician reads every draft.", "Answering a patient's medicine question: generative, so human review, and the answer should show its sources. Organising a multi-step work-up: agentic, so gate every action.", "The rule at the bottom is one of modesty. Choose the least autonomous tool that does the job."]}, {"img": 20, "say": ["If you remember one sentence from this chapter, make it this. More autonomy demands tighter oversight. That is not negotiable.", "A tool that predicts can fail silently, so monitor. A tool that writes can fail fluently, so review. A tool that acts can fail repeatedly, so gate."]}, {"img": 21, "say": ["So here is the skill to keep. Name the system. Work out from its family how it will fail. Demand the watching its autonomy deserves.", "Well done. Now try the final case test."]}], "keyPoint": "Ask: what output, how does it fail, how much watching? Then choose the least autonomous tool that does the job, with the oversight built in before go-live.", "plain": ["Question one: what output does the task need?", "Question two: how does that kind of tool fail?", "Question three: how much watching does that demand?", "Pick the least autonomous tool that does the job, and build the oversight before go-live."], "check": {"q": "What is the first of the three questions for matching a tool to a task?", "o": ["Which company made it?", "What output does the task need?", "How much does it cost?"], "a": 1, "e": "Start with the output: a score, new text, or a chain of actions. That points to the family, and the family tells you the risk.", "retry": {"q": "Which principle ties the chapter together?", "o": ["More autonomy demands tighter oversight", "More data always makes AI safer", "Generative tools need less watching than predictive ones"], "a": 0, "e": "The more freely a system may act, the more tightly it must be checked. That is not negotiable."}}, "scenario": {"title": "Choosing for the admissions unit", "setting": "Your admissions unit wants help estimating each patient's likely length of stay. A supplier offers an agentic assistant that estimates the stay, books the discharge transport and messages the family.", "steps": [{"prompt": "What output does the task actually need?", "choices": [{"t": "A number: a predictive task", "s": 2, "fb": "Right. An estimate of days is a score, so predictive fits."}, {"t": "A letter: a generative task", "s": 0, "fb": "No. Nobody asked for new text."}, {"t": "A chain of bookings: an agentic task", "s": 0, "fb": "No. The unit asked for an estimate, not for actions."}]}, {"prompt": "The supplier says the agentic version is 'more capable'. What do you say?", "choices": [{"t": "Choose the least autonomous tool that does the job, so the predictive one", "s": 2, "fb": "Right. Extra autonomy brings extra risk you do not need for this task."}, {"t": "Take the most capable option", "s": 0, "fb": "No. Capability and risk rise together. Match the tool to the need."}, {"t": "Take the agentic one but switch off the messaging", "s": 1, "fb": "Closer, but you are still buying autonomy and oversight burden you do not need."}]}, {"prompt": "What oversight do you build before go-live for the predictive tool?", "choices": [{"t": "A clinician reads every estimate", "s": 0, "fb": "That is the oversight for a writer, not a sorter, and it defeats the purpose."}, {"t": "Test it on your own patients, check calibration, monitor for drift", "s": 2, "fb": "Right. Those are the three habits for predictive tools."}, {"t": "None, it only gives a number", "s": 0, "fb": "Unsafe. Predictive tools fail silently."}]}]}}], "test": [{"q": "A tool books tests, chases results and prepares a referral, working through several steps on its own. Which family is it?", "o": ["Predictive", "Generative", "Agentic"], "a": 2, "e": "Planning and acting across steps towards a goal is the mark of an agentic system.", "lesson": 0}, {"q": "A colleague says 'it's all just AI, the distinctions are academic'. The best reply is…", "o": ["The families fail differently, so they need different safeguards", "The distinctions only matter to engineers", "All AI tools need the same oversight"], "a": 0, "e": "Naming the family tells you how a tool fails and which safeguard it needs.", "lesson": 0}, {"q": "A manager proposes reading every output of a sepsis alert, a letter drafter and a work-up assistant. Which of the three does this oversight actually suit?", "o": ["The sepsis alert", "The letter drafter", "The work-up assistant"], "a": 1, "e": "Reading every output is the habit for a writer. Sorters need monitoring and agents need gates.", "lesson": 1}, {"q": "A brochure says a tool uses 'deep learning rather than machine learning'. What is wrong?", "o": ["Deep learning is older than machine learning", "Deep learning is one kind of machine learning, so the claim makes no sense", "Nothing"], "a": 1, "e": "Deep learning sits inside machine learning as its most powerful kind.", "lesson": 2}, {"q": "A team wants to tune a treatment plan by trial and feedback on patients. The chapter's concern is…", "o": ["It cannot learn from feedback", "It needs millions of labelled scans", "It is hard to test safely on real patients"], "a": 2, "e": "Reinforcement learning suits decisions in sequence but is hard to test safely on patients.", "lesson": 3}, {"q": "A supervised tool learned from past records where one group of patients was under-recorded as ill. What will it do?", "o": ["Correct the record", "Learn the skew and under-score that group", "Refuse to work"], "a": 1, "e": "A supervised tool is only as good as its labels. Skewed labels teach a skewed tool.", "lesson": 3}, {"q": "An AI tool looks at a chest X-ray and returns the chance that pneumonia is present. Which family is it?", "o": ["Generative", "Agentic", "Predictive"], "a": 2, "e": "Returning a probability for a set question is sorting. It creates no new content.", "lesson": 4}, {"q": "A predictive tool is 90 per cent accurate but when it says '80 per cent risk' only 40 in 100 deteriorate. What is wrong?", "o": ["It is poorly calibrated", "It is hallucinating", "Its errors are compounding"], "a": 0, "e": "Accuracy and calibration differ. Stated chances that do not come true mean poor calibration, which quietly misleads.", "lesson": 4}, {"q": "A language model summarises a letter and adds a medicine the patient never took. Which safeguard would best have caught this?", "o": ["Trusting the confident wording", "A clinician checking against the source before it reaches the record", "Asking another language model"], "a": 1, "e": "Hallucinations look plausible, so a human reader checking against the source is the key safeguard.", "lesson": 5}, {"q": "Doctors approve AI-drafted letters in a two-minute rush at the end of clinic. Which risk does this worsen?", "o": ["Dataset shift", "Automation bias", "Compounding error"], "a": 1, "e": "Under time pressure people wave through smooth text. Review must be real, not a rubber stamp.", "lesson": 6}, {"q": "An agentic assistant has planned an escalation and drafted orders. Why should it pause for a clinician before placing them?", "o": ["It needs time to retrain", "A human gate stops an early error reaching the patient", "Pausing saves computing power"], "a": 1, "e": "In a chain of actions errors snowball, so a gate before any patient-facing step contains them.", "lesson": 7}, {"q": "A service wants AI to estimate each patient's length of stay at admission. Which family and oversight fit?", "o": ["Predictive, with local testing and calibration checks", "Generative, with every draft reviewed", "Agentic, with every action gated"], "a": 0, "e": "A number is a predictive output. Its risks are miscalibration and drift, so test locally and monitor.", "lesson": 8}, {"q": "Two tools do the same job equally well. One acts on its own across steps; the other just gives a score. Which should you choose?", "o": ["The one that acts, it is more capable", "The one that gives a score, it is less autonomous", "Either, it makes no difference"], "a": 1, "e": "Choose the least autonomous tool that does the job. Extra autonomy is extra risk you do not need.", "lesson": 8}]};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){ const e=document.createElement(tag); if(attrs) for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v);} for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k.nodeType?k:document.createTextNode(k)); return e; }
const pad = n => String(n).padStart(2,'0');
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const pct = x => Math.round(100*x);
function seg(options, value, onChange, label){ const w = h('div',{class:'seg',role:'group','aria-label':label||''}); const bs = options.map(([v,t]) => { const b = h('button',{type:'button','aria-pressed':String(v===value)}, t); b.onclick = () => { bs.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onChange(v); }; return b; }); w.append(...bs); return w; }

/* ---------------- metrics (Learning Index) ----------------
   Knowledge 35%: first-attempt quick checks + latest final-test answers correct
   Application 35%: points earned in case simulations (each choice 0–2)
   Self-awareness 15%: how often your confidence matched your answer (sure & right, or unsure & wrong)
   Completion 15%: lessons completed + final test taken
   Levels follow Benner's novice-to-expert stages (shortened for a short course). */
const LEVELS = [[0,'Novice','Starting out: knows the words, needs support to apply them'],[40,'Advanced beginner','Recognises the main ideas in familiar cases'],[60,'Competent','Applies the ideas to new cases and asks the right questions'],[80,'Proficient','Judges tools confidently and explains why to colleagues']];
function metrics(){
  const n = CH.lessons.length; let kOk=0,kN=0,aPts=0,aMax=0,cal=0,calN=0,done=0;
  for (let i=0;i<n;i++){ const l = S.lessons[i]; if (!l) continue;
    if (l.check){ kN++; if (l.check.ok) kOk++; if (l.check.conf){ calN++; if ((l.check.conf==='sure')===l.check.ok) cal++; } }
    aPts += l.caseScore||0; aMax += l.caseDone ? (l.caseMax||0) : 0; if (l.done) done++; }
  if (S.test){ S.test.answers.forEach(a=>{ kN++; if (a.ok) kOk++; if (a.conf){ calN++; if ((a.conf==='sure')===a.ok) cal++; } }); }
  const K = kN? kOk/kN : 0, A = aMax? aPts/aMax : 0, C = calN? cal/calN : null, P = (done + (S.test?1:0))/(n+1);
  const parts = [[K,.35],[A,.35],[P,.15]]; if (C!=null) parts.push([C,.15]);
  const wsum = parts.reduce((x,p)=>x+p[1],0); const idx = Math.round(100*parts.reduce((x,p)=>x+p[0]*p[1],0)/wsum);
  const lv = LEVELS.filter(l=>idx>=l[0]).pop();
  return {K,A,C,P,index:idx,level:lv[1],levelText:lv[2],kN,aMax,calN,done,n};
}

      checkCard.append(h('p',{class:'q'}, c.q), h('p',{class:'fb'}, st.check.ok ? h('span',{class:'pill good'},'Right first time') : h('span',{class:'pill warn'},'Missed first time'), ' ', c.e),
        st.retry ? h('p',{class:'fb'}, 'Second chance: ', st.retry.ok ? h('span',{class:'pill good'},'right') : h('span',{class:'pill bad'},'missed')) : null,
        h('div',{class:'row',style:'margin-top:8px'}, h('button',{class:'btn small',type:'button',onclick:()=>{ askQuestion(checkCard, c, true, ()=>{}); }},'Practise again (not scored)')));
      return;
    }
    askQuestion(checkCard, c, false, (ok, conf) => {
      st.check = {ok, conf}; save(); renderSteps();
      if (!ok && c.retry){
        plainCard.hidden = false; plainBtn.textContent='Hide plain words';
        const r = h('div',{style:'margin-top:14px'}, h('div',{class:'plain'}, h('b',null,'Let\'s look at it another way'), h('ul',null, les.plain.map(p=>h('li',null,p)))));
        const rq = h('div',{style:'margin-top:12px'}); r.append(h('div',{class:'eyebrow',style:'margin-top:12px'},'Second chance'), rq); checkCard.append(r);
        askQuestion(rq, c.retry, false, (ok2) => { st.retry = {ok:ok2}; save(); if (!ok2) rq.append(h('p',{class:'fb'}, h('span',{class:'pill warn'},'Tip'),' Try the lesson again in Read mode, at your own pace. It is marked for review on your progress page.')); caseCard.hidden=false; }, true);
      } else caseCard.hidden = false;
    });
  }
  // --- CASE simulation
  const caseCard = h('div',{class:'card',hidden: !st.check}); main.append(caseCard);
  function renderCase(){
    const sc = les.scenario; caseCard.innerHTML='';
    caseCard.append(h('div',{class:'eyebrow'},'Case simulation'), h('h3',null, sc.title), h('p',{class:'case-set'}, sc.setting));
    const maxPts = sc.steps.length*2; let pts = 0, k = 0;
    const host = h('div'); caseCard.append(host);
    if (st.caseDone){ host.append(h('p',{class:'fb'}, h('span',{class: st.caseScore>=maxPts*0.75?'pill good':st.caseScore>=maxPts/2?'pill warn':'pill bad'}, `You scored ${st.caseScore} of ${maxPts}`), ' ', h('button',{class:'btn small',type:'button',onclick:()=>{ st.caseDone=false; st.caseScore=0; save(); renderCase(); }},'Try the case again'))); finishRow(); return; }
    function step(){
      const s = sc.steps[k]; const box = h('div',{class:'stepbox'}, h('p',{class:'q'}, `${k+1}. ${s.prompt}`)); const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
      s.choices.forEach(ch => { const b = h('button',{class:'opt',type:'button'}, ch.t); b.onclick = () => {
        opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ch.s===2?'right':ch.s===1?'part':'wrong');
        if (ch.s<2){ const best = s.choices.find(c=>c.s===2); if (best) [...opts.children].find(x=>x.textContent===best.t).classList.add('right'); }
        pts += ch.s; fb.innerHTML = `<b>${ch.s===2?'Good call.':ch.s===1?'Partly.':'Not the best choice.'}</b> ${ch.fb}`;
        k++; if (k < sc.steps.length) step(); else { st.caseDone = true; st.caseScore = pts; st.caseMax = maxPts; st.done = st.done || !!st.check; save(); renderSteps();
          host.append(h('p',{class:'fb',style:'margin-top:12px'}, h('span',{class: pts>=maxPts*0.75?'pill good':pts>=maxPts/2?'pill warn':'pill bad'}, `Case score: ${pts} of ${maxPts}`))); finishRow(); } };
        opts.append(b); });
      box.append(opts, fb); host.append(box);
    }
    step();
  }
  function finishRow(){
    st.done = !!(st.check && st.caseDone); save();
    const next = i < CH.lessons.length-1 ? h('button',{class:'btn primary',type:'button',onclick:()=>go('l'+(i+1))}, `Next: lesson ${i+2}`) : h('button',{class:'btn primary',type:'button',onclick:()=>go('final')}, 'Go to the final case test');
    caseCard.append(h('div',{class:'row',style:'margin-top:14px'}, next, h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my progress')));
  }
  renderCheck(); renderCase(); layout();
}

/* generic question with confidence rating */
function askQuestion(host, q, practice, onDone, isRetry){
  const box = h('div'); host.append(box);
  if (!isRetry || true) box.append(h('p',{class:'q'}, q.q));
  let conf = null;
  const confSeg = seg([['sure','I\'m sure'],['unsure','I\'m not sure']], null, v=>conf=v, 'Confidence');
  if (!practice) box.append(h('div',{class:'conf'}, h('span',null,'Before you answer, how sure are you?'), confSeg, h('span',{style:'font-size:.8rem'},'(optional, helps your self-awareness score)')));
  const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
  q.o.forEach((o,j)=>{ const b = h('button',{class:'opt',type:'button'}, o); b.onclick = () => {
    const ok = j===q.a; opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ok?'right':'wrong'); if (!ok) opts.children[q.a].classList.add('right');
    fb.innerHTML = `<b>${ok?'Right.':'Not quite.'}</b> ${q.e}`; onDone(ok, conf); };
    opts.append(b); });
  box.append(opts, fb);
}

/* ---------------- FINAL case test ---------------- */
function renderFinal(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'Final case test'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Check your learning path'), h('p',{class:'lede',style:'margin-top:6px'}, `${CH.test.length} short questions across all ${CH.lessons.length} lessons. You see the answer after each one. Your latest attempt counts towards your learning index, and the results show which lessons to revisit.`)));
  if (M.done < CH.lessons.length) main.append(h('div',{class:'card',style:'background:var(--signal-soft)'}, h('p',null, `You have finished ${M.done} of ${CH.lessons.length} lessons. You can take the test now, but you will probably score higher after finishing them.`)));
  const host = h('div',{class:'card'}); main.append(host);
  if (S.test) { host.append(h('p',null, h('span',{class:'pill acc'}, `Last attempt: ${S.test.score} of ${CH.test.length}`), ` · ${S.test.attempts} attempt${S.test.attempts>1?'s':''}`), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Take the test again'), h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my results'))); return; }
  host.append(h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Start the test'));
}
function runTest(host){
  const answers = []; let k = 0;
  const prog = h('p',{class:'eyebrow'}); host.append(prog); const qhost = h('div'); host.append(qhost);
  function next(){
    qhost.innerHTML=''; prog.textContent = `Question ${k+1} of ${CH.test.length} · from lesson ${CH.test[k].lesson+1}: ${CH.lessons[CH.test[k].lesson].title}`;
    askQuestion(qhost, CH.test[k], false, (ok, conf) => { answers.push({ok, conf, lesson: CH.test[k].lesson});
      qhost.append(h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ k++; if (k<CH.test.length) next(); else finish(); }}, k<CH.test.length-1?'Next question':'See my results'))); });
  }
  function finish(){ const score = answers.filter(a=>a.ok).length; S.test = {answers, score, attempts:(S.test?S.test.attempts:0)+1, at:Date.now()}; save(); go('progress'); }
  next();
}

/* ---------------- PROGRESS: learning index, advice, certificate ---------------- */
function gaugeSVG(v){
  const r=60, c=2*Math.PI*r, f=c*v/100;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Learning index ${v} out of 100"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${v}</text><text x="75" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">out of 100</text></svg>`;
}
function advice(){
  const out = []; const n = CH.lessons.length;
  const testBy = {}; if (S.test) S.test.answers.forEach(a=>{ (testBy[a.lesson] = testBy[a.lesson]||{ok:0,n:0}); testBy[a.lesson].n++; if (a.ok) testBy[a.lesson].ok++; });
  const weak = [];
  for (let i=0;i<n;i++){ const l = S.lessons[i]; const reasons = [];
    if (l && l.check && !l.check.ok) reasons.push('missed the quick check');
    if (l && l.caseDone && l.caseScore < l.caseMax*0.5) reasons.push(`scored ${l.caseScore} of ${l.caseMax} on the case`);
    if (testBy[i] && testBy[i].ok < testBy[i].n) reasons.push(`${testBy[i].n-testBy[i].ok} final-test question${testBy[i].n-testBy[i].ok>1?'s':''} wrong`);
    if (reasons.length) weak.push([i, reasons]); }
  weak.sort((a,b)=>b[1].length-a[1].length).slice(0,3).forEach(([i,r])=>out.push(['Revisit', `Lesson ${i+1}, ${CH.lessons[i].title}: you ${r.join(', ')}. Try it in Read mode and open "Explain more simply".`, 'l'+i]));
  const nf = [...Array(n).keys()].find(i=>!(S.lessons[i]&&S.lessons[i].done));
  if (nf!==undefined) out.push(['Next', `Carry on with lesson ${nf+1}, ${CH.lessons[nf].title}.`, 'l'+nf]);
  else if (!S.test) out.push(['Next', 'All lessons done. Take the final case test to check your learning path.', 'final']);
  const M = metrics();
  if (M.calN >= 4 && M.C < 0.6) out.push(['Self-awareness', 'Your confidence often did not match your answers. In clinical work, knowing when you are unsure matters as much as knowing the answer. Keep rating your confidence.', null]);
  if (S.plan && S.secs > 0){ const done = Object.values(S.lessons).filter(l=>l.done); const avg = done.length ? done.reduce((a,l)=>a+l.secs,0)/done.length/60 : 0;
    if (avg >= 0.5) out.push(['Your pace', `You spend about ${avg.toFixed(1)} minutes per lesson. ${avg > 6 ? 'Taking your time is fine. Shorter sittings may suit you better: try 5-minute sittings on the Start page.' : avg < 2.5 ? 'You move quickly. If the cases feel easy, the Fast track path lets you skip straight to them.' : 'That fits your plan well.'}`, null]); }
  if (!out.length) out.push(['Well done', 'No gaps found. You could teach this chapter to a colleague.', null]);
  return out;
}
function renderProgress(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'My progress'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Your learning index'), h('p',{class:'lede',style:'margin-top:6px'}, S.test ? 'Based on your lessons, cases and final test.' : 'Provisional until you take the final case test.')));
  const dims = [['Knowledge', M.K, 'Quick checks right first time, plus final-test answers'], ['Applying it', M.A, 'Points from the case simulations'], ['Self-awareness', M.C, 'How often your confidence matched your answer'], ['Completion', M.P, 'Lessons finished and final test taken']];
  const dimsEl = h('div',{class:'dims'}, dims.map(([n,v,d])=>h('div',null, h('div',{class:'dim'}, h('span',null,n), h('div',{class:'track'}, h('div',{class:'fill',style:`width:${v==null?0:pct(v)}%`})), h('output',null, v==null?'—':pct(v)+'%')), h('div',{style:'font-size:.78rem;color:var(--muted);margin:-4px 0 0'}, d))));
  const ladder = h('div',{class:'ladder'}, LEVELS.map(l=>h('div',{class: l[1]===M.level?'on':''}, l[1], h('br'), `${l[0]}+`)));
  main.append(h('div',{class:'card'}, h('div',{class:'gauge'}, h('div',{html:gaugeSVG(M.index)}), h('div',{style:'flex:1;min-width:240px'}, h('h3',null, M.level), h('p',{class:'lede'}, M.levelText), ladder)), h('div',{style:'margin-top:16px'}, dimsEl),
    h('p',{class:'foot',style:'margin-top:12px'},'How it is worked out: knowledge 35%, applying it 35%, self-awareness 15%, completion 15%. Levels follow Benner\'s "novice to expert" stages used in clinical education.')));
  const adv = h('div',{class:'advice'}, advice().map(([t,txt,v])=>h('div',null, h('span',{class:'pill acc',style:'flex:none'},t), h('span',{style:'flex:1'},txt), v ? h('button',{class:'btn small',type:'button',onclick:()=>go(v)},'Go') : null)));
  main.append(h('div',{class:'card'}, h('h3',null,'What to do next'), adv));
  const rows = CH.lessons.map((les,i)=>{ const l = S.lessons[i]||{}; return h('tr',null, h('td',null, `${i+1}. ${les.title}`), h('td',null, l.watched?'✓':'—'), h('td',null, l.check ? (l.check.ok ? h('span',{class:'pill good'},'Right') : h('span',{class:'pill warn'},'Missed')) : '—'), h('td',null, l.caseDone ? `${l.caseScore}/${l.caseMax}` : '—'), h('td',{class:'mono'}, l.secs ? (l.secs<60 ? '<1 min' : Math.round(l.secs/60)+' min') : '—')); });
  main.append(h('div',{class:'card'}, h('h3',null,'Lesson by lesson'), h('div',{class:'tablewrap'}, h('table',{class:'t'}, h('thead',null,h('tr',null, ['Lesson','Watched','Check','Case','Time'].map(t=>h('th',null,t)))), h('tbody',null,rows))),
    S.test ? h('p',{style:'margin-top:10px'}, h('span',{class:'pill acc'}, `Final test: ${S.test.score} of ${CH.test.length}`)) : null));
  // certificate
  const nameIn = h('input',{type:'text',id:'certName',placeholder:'Your name as it should appear',value:S.name||''});
  const certBtn = h('button',{class:'btn primary',type:'button'},'Download certificate');
  const note = h('p',{class:'foot'});
  const eligible = S.test && M.index >= 60;
  certBtn.disabled = !eligible; note.textContent = eligible ? 'Saves a picture of your certificate. Your score is calculated in your own browser, so keep the file as your record.' : 'Available once you have taken the final case test and reached Competent (60 or more).';
  certBtn.onclick = () => { S.name = nameIn.value.trim(); save(); makeCert(S.name || 'Learner', M); };
  main.append(h('div',{class:'card'}, h('h3',null,'Certificate'), h('div',{class:'row'}, nameIn, certBtn), note,
    h('div',{class:'row',style:'margin-top:14px'}, h('button',{class:'btn small',type:'button',onclick:()=>{ resetBox.hidden = false; }},'Start this chapter again'))));
  const resetBox = h('div',{class:'card',hidden:true,style:'background:var(--bad-soft)'}, h('p',null,'This clears your plan, answers and scores for this chapter in this browser. It cannot be undone.'), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn',type:'button',onclick:()=>{ S = blank(); save(); go('start'); }},'Yes, clear this chapter'), h('button',{class:'btn',type:'button',onclick:()=>{ resetBox.hidden=true; }},'Keep my progress')));
  main.append(resetBox);
}
function makeCert(name, M){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1130; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0,0,1600,1130); x.strokeStyle = '#0E6B66'; x.lineWidth = 14; x.strokeRect(40,40,1520,1050); x.lineWidth = 2; x.strokeRect(70,70,1460,990);
  x.fillStyle = '#0E6B66'; x.textAlign = 'center'; x.font = '600 30px Georgia, serif'; x.fillText('A CLINICAL GUIDE TO AI IN HEALTHCARE', 800, 180);
  x.fillStyle = '#14232A'; x.font = '600 72px Georgia, serif'; x.fillText('Certificate of learning', 800, 290);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('This is to record that', 800, 380);
  x.fillStyle = '#14232A'; x.font = '600 64px Georgia, serif'; x.fillText(name.slice(0,48), 800, 470);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('has completed', 800, 550);
  x.fillStyle = '#14232A'; x.font = '600 40px Georgia, serif'; x.fillText((CH.num==='A'?'Appendix A: ':'Chapter '+CH.num+': ') + CH.title, 800, 620, 1400);
  x.fillStyle = '#0E6B66'; x.font = '600 46px Arial, sans-serif'; x.fillText(`Learning index ${M.index} / 100  ·  ${M.level}`, 800, 740);
  x.fillStyle = '#55686D'; x.font = '24px Arial, sans-serif';
  x.fillText(`Knowledge ${pct(M.K)}%   ·   Applying it ${pct(M.A)}%   ·   Self-awareness ${M.C==null?'—':pct(M.C)+'%'}   ·   Final test ${S.test.score}/${CH.test.length}`, 800, 800);
  x.fillText('Issued ' + new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) + '  ·  Self-assessed online course record, calculated in the learner\'s browser', 800, 980);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `certificate-${CH.id}.png`; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); });
}

/* ---------------- boot ---------------- */
$('#chNum').textContent = CH.num==='A' ? 'Appendix A' : 'Chapter '+CH.num;
$('#chTitle span').textContent = CH.title;
const hv = (location.hash||'').slice(1);
go(views().includes(hv) ? hv : (S.plan ? 'l'+firstUnfinished() : 'start'));
</script>
