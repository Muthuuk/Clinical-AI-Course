atients.", "The answer was 26.7 hours a day. The day only has 24.", "Here is how it broke down. 14.1 hours for preventive care. 7.2 hours for long-term conditions. 2.2 hours for acute problems. And 3.2 hours for paperwork and the inbox.", "This is not about lazy or slow clinicians. It is simply impossible. No amount of working harder can close that gap.", "Keep that number in mind. It frames the whole case for AI. We need tools that give clinicians time back."]}], "keyPoint": "Guideline care for a typical GP list would take 26.7 hours a day. The problem is structural, so working harder cannot fix it.", "plain": ["Porter and colleagues, 2023: all guideline care for 2,500 patients needs 26.7 hours a day.", "Preventive care alone takes over half of that time.", "It is impossible for one person, so the system itself must change."], "check": {"q": "According to Porter and colleagues, how long would full guideline care take each day for a typical GP list?", "o": ["About 12 hours", "About 26.7 hours", "About 24 hours"], "a": 1, "e": "The study found 26.7 hours a day, more than the day contains. That is why the problem is called structural.", "retry": {"q": "Why does the chapter call the workload problem structural rather than personal?", "o": ["The task needs more hours than a day has, so nobody could do it", "Clinicians are not trying hard enough", "The guidelines are all wrong"], "a": 0, "e": "26.7 hours of work cannot fit into 24 hours, however hard anyone works."}}, "scenario": {"title": "The practice meeting", "setting": "You manage a GP practice. At the partners' meeting, one partner says the doctors simply need to work harder to meet every guideline target.", "steps": [{"prompt": "What do you say?", "choices": [{"t": "The work needs about 27 hours a day, so harder work cannot close the gap", "s": 2, "fb": "Right. The study shows the task is impossible for one person, so the way of working has to change."}, {"t": "Agree, and propose a longer working day", "s": 0, "fb": "No. There are not enough hours in any day, and longer days drive burnout."}, {"t": "Suggest hiring one more GP", "s": 1, "fb": "It helps a little, but the gap is far bigger than one extra person can close."}]}, {"prompt": "The partner asks where the time actually goes. Which part took the most hours in the study?", "choices": [{"t": "Paperwork and the inbox", "s": 0, "fb": "No. That was 3.2 hours, the smallest share."}, {"t": "Preventive care", "s": 2, "fb": "Right. Preventive care took 14.1 hours, more than half of the total."}, {"t": "Acute problems", "s": 0, "fb": "No. Acute problems took only 2.2 hours."}]}]}}, {"title": "Three tiers of care", "minutes": 2, "slides": [{"img": 4, "say": ["Now let's see how care is organised. Think of a pyramid with three levels.", "At the bottom is primary care: the GP, the pharmacy, community services. In England there are more than three hundred and fifty million GP consultations a year.", "Here AI's job is to give clinicians more room. A scribe that writes up the consultation. A tool that sorts the inbox.", "In the middle is secondary care: the 215 NHS hospital trusts.", "Here AI's job is speed. Sorting scans so urgent ones are read first. Warning early when a patient is getting worse.", "At the top is tertiary care. Specialist centres, major trauma, rare diseases. Here AI helps find patterns in rare and complex cases.", "The same technology does a different job at each level. Design for the level, not for AI in general."]}, {"img": 5, "say": ["Other countries organise care differently, but the logic is the same.", "In the United States, nearly all hospitals have electronic records. But rival suppliers run them, and the systems struggle to talk to each other.", "Poorer countries sometimes skip stages altogether by going straight to mobile phones.", "The big lesson is this. The problem is rarely too little data. It is agreeing how to share it.", "A tool that works in one trust can fail in the next, simply because the data is coded differently."]}], "keyPoint": "AI does a different job at each tier of care. The usual barrier is not too little data, but agreeing how to share it.", "plain": ["Primary care: AI gives clinicians more room, with scribes and inbox sorting.", "Secondary care: AI speeds things up, with scan triage and early warnings.", "Tertiary care: AI finds patterns in rare and complex cases.", "The hard part is sharing data between systems, not collecting it."], "check": {"q": "A hospital wants AI to sort incoming scans so urgent ones are read first. Which tier is this job typical of?", "o": ["Primary care", "Tertiary care", "Secondary care"], "a": 2, "e": "Speed and throughput, such as scan triage and early warnings, are AI's job in hospitals, the secondary tier.", "retry": {"q": "What does the chapter say is usually the main barrier to AI across health systems?", "o": ["Too little data", "Agreeing how to share data between systems", "Computers that are too slow"], "a": 1, "e": "The difficulty is rarely the amount of data. It is governance: agreeing how to share it and making systems talk."}}, "scenario": {"title": "The moving tool", "setting": "A deterioration alert worked well at a neighbouring trust. Your trust has bought it, but after go-live it misses patients it should flag.", "steps": [{"prompt": "What is the most likely explanation from this chapter?", "choices": [{"t": "Your trust records and codes data differently from theirs", "s": 2, "fb": "Right. A tool can fail in a new trust simply because the data is coded differently."}, {"t": "Your nurses are using it carelessly", "s": 0, "fb": "Unlikely. Look at the data first, not the staff."}, {"t": "The tool needs a faster computer", "s": 0, "fb": "No. Speed is not the issue here."}]}, {"prompt": "A GP partner asks whether the same tool would suit her practice. What do you tell her?", "choices": [{"t": "Yes, AI is AI, it will work anywhere", "s": 0, "fb": "No. The same technology does a different job at each tier."}, {"t": "Possibly, but a GP practice's main need is room, such as scribes and inbox sorting", "s": 2, "fb": "Right. Design for the tier. Hospital triage tools and GP tools solve different problems."}, {"t": "Only if it is cheaper than the hospital paid", "s": 1, "fb": "Price matters, but the first question is whether it fits the job at her tier."}]}]}}, {"title": "Gradually, then suddenly", "minutes": 2, "slides": [{"img": 6, "say": ["How did healthcare go digital? Wachter borrows a phrase from Hemingway: gradually, then suddenly.", "For years, change crept along. Then five turning points pushed it sharply upwards.", "First, 2009. The American HITECH Act spent about thirty billion dollars on electronic records. Use went from under ten per cent to nearly every hospital. That created the raw material: the data.", "Second, 2017. The WannaCry cyber attack showed that digital care without security is more fragile than paper.", "Third, 2020. COVID proved that healthcare can change fast when it has to. Remote consultations went from about one in ten contacts to most of them, within weeks.", "Fourth, 2023. Large language models arrived. These are the AI systems behind chatbots that read and write fluent text. Clinicians began to take AI seriously. Use jumped from 38 to 66 per cent in one year.", "Fifth, 2025. The NHS Ten-Year Plan made the sudden phase official policy.", "Here is the key point. Thirty years of slow digitisation laid down the data that makes today's AI possible."]}], "keyPoint": "Digital care crept forward for thirty years, then tipped suddenly. The data laid down slowly is what makes today's AI possible.", "plain": ["2009, HITECH: electronic records everywhere, creating the data.", "2017, WannaCry: digital without security is fragile.", "2020, COVID: care can change fast when it must.", "2023, language models: clinicians start to take AI seriously.", "2025, NHS Ten-Year Plan: the sudden phase becomes policy."], "check": {"q": "Which turning point created the data foundation that today's AI relies on?", "o": ["The HITECH Act, 2009", "WannaCry, 2017", "COVID, 2020"], "a": 0, "e": "HITECH pushed electronic records from under ten per cent to nearly all hospitals, laying down the data.", "retry": {"q": "What did WannaCry in 2017 teach healthcare?", "o": ["Paper records should return", "Digital care without security is more fragile than paper", "AI was ready for the wards"], "a": 1, "e": "The attack showed that going digital without security made care more fragile, and pushed security up the agenda."}}, "scenario": {"title": "The board's history lesson", "setting": "You are preparing a board paper on AI. A non-executive director asks why AI is suddenly credible when medical computing promised so much for decades.", "steps": [{"prompt": "Which point best answers her?", "choices": [{"t": "Thirty years of digitisation created the data that modern AI needs", "s": 2, "fb": "Right. The gradual phase laid down the raw material for the sudden phase."}, {"t": "Computers finally became cheap enough", "s": 1, "fb": "Partly, but the chapter stresses the data laid down over decades."}, {"t": "Hospitals have more money now", "s": 0, "fb": "No. Spending more does not by itself produce better outcomes."}]}, {"prompt": "She asks what COVID showed about healthcare's ability to change. What do you say?", "choices": [{"t": "Change is always slow in the NHS", "s": 0, "fb": "No. COVID showed the opposite."}, {"t": "Remote consultations went from about one in ten to most contacts within weeks", "s": 2, "fb": "Right. It proved the sector can change at speed when it has to."}, {"t": "Nothing changed during COVID", "s": 0, "fb": "No. Consultation patterns changed dramatically."}]}]}}, {"title": "The lesson of the record", "minutes": 2, "slides": [{"img": 7, "say": ["Going digital also carries a warning.", "Hospitals spent huge sums on electronic record systems. Some cost more than a hundred million dollars. Yet measurable gains were small.", "What went wrong? The paper process was copied onto a screen, but the work itself was not changed.", "Clinicians who used to write notes now typed them, and typed more. The record became good at capturing charges and guarding against lawsuits, but poor at helping decisions.", "Every task gained clicks and gave little back.", "Holmgren and colleagues found in 2021 that even during COVID, clinicians stayed unhappy with documentation.", "Here is the lesson. Technology delivers nothing until the work is redesigned around it.", "That applies with full force to AI. Picture failure. A trust spends heavily, bolts AI onto unchanged ways of working, and five years on its staff are no less exhausted.", "So when you hear about a new tool, ask one thing. What changes in how we work? If the answer is nothing, expect nothing."]}], "keyPoint": "Electronic records cost a fortune and gave little back because the work was not redesigned. AI will repeat that failure unless the work changes too.", "plain": ["Records were digitised, but the way of working stayed the same.", "Result: more typing, more clicks, little gain, unhappy clinicians.", "Technology only pays off when the work is redesigned around it.", "Always ask of a new AI tool: what changes in how we work?"], "check": {"q": "Why did huge spending on electronic records bring so little gain?", "o": ["The computers were too slow", "The work itself was not redesigned around the new system", "Clinicians refused to use them"], "a": 1, "e": "Paper processes were copied onto screens. Without changing the work, the record added clicks and gave little back.", "retry": {"q": "A trust plans to add an AI tool but change nothing about how staff work. What does the chapter predict?", "o": ["Big savings within a year", "Little benefit, as with electronic records", "The tool will replace staff"], "a": 1, "e": "Technology delivers nothing until the work is redesigned around it. That lesson applies to AI too."}}, "scenario": {"title": "The AI business case", "setting": "An IT manager brings you a business case for an AI documentation tool. It lists the cost and the licence terms, but says nothing about how clinics will run differently.", "steps": [{"prompt": "What is your main concern?", "choices": [{"t": "The licence is too long", "s": 0, "fb": "That is a detail. The missing piece is how the work will change."}, {"t": "Nothing says how the way of working will change, so it may repeat the record paradox", "s": 2, "fb": "Right. Bolting technology onto unchanged work gave little last time."}, {"t": "It does not name the supplier's competitors", "s": 1, "fb": "Comparing suppliers is sensible, but the bigger gap is the absent redesign of the work."}]}, {"prompt": "What do you ask the IT manager to add?", "choices": [{"t": "A plan for how clinic routines will change, and how time saved will be used", "s": 2, "fb": "Right. The work must be redesigned around the tool, or the gain evaporates."}, {"t": "A list of the tool's technical features", "s": 0, "fb": "Features do not tell you whether the work will improve."}, {"t": "A promise that staff will type faster", "s": 0, "fb": "No. Faster typing was never the problem."}]}]}}, {"title": "Closing the gap", "minutes": 2, "slides": [{"img": 8, "say": ["Back to the 27-hour problem. Can it be closed? This picture is the heart of the chapter.", "The left bar is one clinician doing everything. Preventive care, long-term conditions, acute problems and paperwork stack up to 26.7 hours. Well over the red 24-hour line.", "The right bar shares the work across a team and adds AI. The same care now takes about 9.3 hours. Still a hard day, but no longer impossible.", "Where does AI help? A scribe that listens and drafts the note can halve paperwork time. That gives back about 1.6 hours a day.", "Inbox tools can deal with messages before a doctor sees them. Kaiser, a large American health provider, reports one and a half million messages handled this way.", "And decision support trims the time spent following up long-term conditions.", "Add it up. 1.6 hours from paperwork, plus 0.7 hours from long-term care support. That is 2.3 hours a day back for each clinician.", "Multiply that across a whole workforce. As the slide says, the impossible day becomes merely a hard one."]}], "keyPoint": "Sharing work across a team and adding AI brings 26.7 hours down to about 9.3. AI alone returns about 2.3 hours a day per clinician.", "plain": ["Team-based care plus AI: 26.7 hours becomes about 9.3.", "Scribes halve paperwork time: about 1.6 hours back a day.", "Decision support for long-term conditions: about 0.7 hours back.", "Total from AI: about 2.3 hours a day per clinician."], "check": {"q": "In the chapter's example, how much time a day does AI give back to each clinician?", "o": ["About 2.3 hours", "About 9.3 hours", "About 14 hours"], "a": 0, "e": "1.6 hours from the scribe plus 0.7 hours from decision support makes 2.3 hours a day.", "retry": {"q": "What brings the 26.7-hour day down to about 9.3 hours?", "o": ["AI on its own", "Dropping preventive care", "Sharing work across a team, plus AI"], "a": 2, "e": "The right-hand bar combines team-based care with AI. Neither alone does it."}}, "scenario": {"title": "The primary care network bid", "setting": "Your primary care network is bidding for funding to cut GP workload. The bid currently proposes buying an AI scribe and nothing else.", "steps": [{"prompt": "A colleague says the scribe alone will solve the workload problem. What do you say?", "choices": [{"t": "Yes, the scribe fixes everything", "s": 0, "fb": "No. A scribe returns about 1.6 hours. The gap is far larger."}, {"t": "It helps, returning about 1.6 hours a day, but the big gain comes from sharing work across a team too", "s": 2, "fb": "Right. The chapter's solution is team-based care plus AI, not AI alone."}, {"t": "Scribes are a gimmick, forget them", "s": 0, "fb": "Too far. Halving paperwork time is real and valuable."}]}, {"prompt": "The panel asks how you will know the scribe worked. What do you measure?", "choices": [{"t": "How many pages the notes run to", "s": 0, "fb": "Longer notes were part of the old problem."}, {"t": "Time spent on documentation each day, before and after", "s": 2, "fb": "Right. Time returned is the benefit the chapter describes."}, {"t": "How many staff logged in", "s": 1, "fb": "Use matters, but it does not show time saved."}]}]}}, {"title": "Augmentation, not replacement", "minutes": 2, "slides": [{"img": 9, "say": ["Here is the central idea of the whole course. AI should support clinicians, not replace them. We call that augmentation.", "On the left, what AI handles well: writing up notes, sorting the inbox, pre-reading images, spotting patterns, monitoring. Repetitive, data-heavy work that drains attention.", "On the right, what the clinician keeps: judgement, communication, ethical trade-offs, accountability, and shared decisions with patients.", "In the middle is a loop. The AI proposes. The clinician decides. The outcome is recorded. The tool improves. Remove any step and it breaks.", "Is there proof? Radiology is the test case. Many predicted AI would replace radiologists. Instead there is a shortage of them, and AI works as their assistant."]}, {"img": 10, "say": ["Ambient scribes show this in practice. The AI listens to the consultation and drafts the note. The clinician checks it before it goes anywhere.", "Olson and colleagues studied this across several sites in 2025. Writing time fell by thirty to fifty per cent. Burnout fell by nearly fourteen percentage points in one month.", "Why does that matter? Notes finished at home in the evening, so-called pyjama time, strongly predict burnout. Burnout makes people cut their hours or leave.", "So giving time back keeps experienced people in the job."]}], "keyPoint": "AI takes the repetitive, data-heavy work. The clinician keeps judgement and accountability. The AI proposes, the clinician decides.", "plain": ["AI handles: notes, inbox, pre-reading images, pattern spotting, monitoring.", "Clinician keeps: judgement, communication, ethics, accountability.", "The loop: AI proposes, clinician decides, outcome recorded, tool improves.", "Scribes cut writing time by a third to a half and reduced burnout."], "check": {"q": "In the partnership loop, what happens right after the AI proposes?", "o": ["The patient is told", "The clinician decides", "The tool retrains itself"], "a": 1, "e": "The loop runs: AI proposes, clinician decides, outcome recorded, tool improves. The decision stays with the clinician.", "retry": {"q": "What did the radiology experience show about AI replacing clinicians?", "o": ["Most radiologists have been replaced", "There is a shortage of radiologists and AI acts as their assistant", "AI is banned in radiology"], "a": 1, "e": "Despite predictions, radiologists are in short supply and AI works as an assistant, not a substitute."}}, "scenario": {"title": "The scribe pilot", "setting": "Your outpatient clinic is piloting an ambient AI scribe. A consultant suggests letting the drafts go straight into the record to save even more time.", "steps": [{"prompt": "What do you say?", "choices": [{"t": "Good idea, the AI is accurate enough", "s": 0, "fb": "No. The clinician must decide. Remove that step and the loop breaks."}, {"t": "No. The clinician must read and approve every draft before it enters the record", "s": 2, "fb": "Right. The AI proposes and the clinician decides. Accountability stays with the clinician."}, {"t": "Let drafts go straight in, but check a sample each month", "s": 1, "fb": "Safer than nothing, but an unchecked error would already be in a patient's record."}]}, {"prompt": "A manager asks what benefit to expect, based on the evidence. What do you say?", "choices": [{"t": "Writing time down by a third to a half, and less burnout", "s": 2, "fb": "Right. That is what Olson and colleagues found across several sites."}, {"t": "Fewer consultants will be needed", "s": 0, "fb": "No. The evidence points to support, not replacement."}, {"t": "Longer, more detailed notes", "s": 0, "fb": "Longer notes were part of the old problem, not the goal."}]}]}}, {"title": "Why now", "minutes": 2, "slides": [{"img": 11, "say": ["You may be sceptical. Medical AI has disappointed before. So what has changed? Three things have arrived together.", "First, the raw material. Thirty years of electronic records have produced billions of notes, images and results in digital form. Twenty years ago, that did not exist.", "Second, the tools have matured. Deep learning is a kind of AI that learns from huge numbers of examples. It now matches specialists at reading images. And language models can summarise, draft and answer questions in seconds.", "Third, attitudes have shifted. Clinicians who once feared being replaced now ask for tools that take away the typing. A survey by Menlo Ventures found use rose from 38 to 66 per cent in a single year.", "These are not three coincidences. They are one story. The ability, the material and the willingness arrived at the same time.", "That is why this moment is different from earlier waves of excitement about medical AI."]}], "keyPoint": "Three things arrived together: the data, mature tools, and clinicians who now want help. That is why this time is different.", "plain": ["Raw material: billions of digital notes, images and results.", "Mature tools: deep learning reads images at specialist level; language models handle text.", "Willing users: clinicians now ask for tools that cut the typing.", "All three at once is what makes now different."], "check": {"q": "Which three things does the chapter say have come together to make AI matter now?", "o": ["Cheaper hardware, new laws and more doctors", "Data, mature tools and a shift in attitude", "Government funding, patient demand and cloud storage"], "a": 1, "e": "Raw material, capability and willingness arrived together. That is why this moment differs from earlier ones.", "retry": {"q": "Why do clinicians now ask for AI tools, according to the chapter?", "o": ["To take away the typing burden", "To replace junior staff", "Because it is fashionable"], "a": 0, "e": "Clinicians who once feared being displaced now want relief from the paperwork."}}, "scenario": {"title": "The sceptical consultant", "setting": "A senior consultant tells you she has seen three waves of medical computing hype in her career and sees no reason this one is different.", "steps": [{"prompt": "What is the strongest reply from this chapter?", "choices": [{"t": "This time the companies are bigger", "s": 0, "fb": "Company size is not the argument."}, {"t": "This time the data, the mature tools and the willing users have all arrived at once", "s": 2, "fb": "Right. Earlier waves lacked one or more of these three."}, {"t": "The tools are faster now", "s": 1, "fb": "Speed is part of maturity, but the full answer is three things arriving together."}]}, {"prompt": "She asks what has changed about clinicians themselves. What do you say?", "choices": [{"t": "Nothing, clinicians still fear AI", "s": 0, "fb": "No. The chapter describes a clear shift in attitude."}, {"t": "Many now ask for tools that remove the typing burden", "s": 2, "fb": "Right. Reported use rose from 38 to 66 per cent in one year."}, {"t": "They have all learned to program", "s": 0, "fb": "No. The change is in what they want, not in their technical skills."}]}]}}, {"title": "When AI gets it wrong", "minutes": 2, "slides": [{"img": 12, "say": ["Now the most important cautionary tale in this chapter.", "In 2019, Obermeyer and colleagues studied a widely used tool. It decided which patients should get extra support, and it was used for millions of people.", "They found it systematically gave Black patients less care.", "How? The tool was built to predict healthcare cost. The makers assumed that higher cost meant sicker patients.", "But cost also reflects access. Patients who find it harder to get care spend less, even when they are just as ill.", "So Black patients at the same level of illness got lower scores, and less help.", "Notice what did not cause this. Not malice. Not bad programmers. Not too little data. The bias came in through the data and the choice of target. Cost instead of need.", "Three lessons. A technically competent system can still be unfair. Fairness must be designed in from the start, not added later. And the scale that lets AI help millions lets one flaw harm millions."]}], "keyPoint": "A widely used tool under-served Black patients because it predicted cost, not need. Bias came through the data and the target, not malice.", "plain": ["The tool predicted healthcare cost, assuming cost meant illness.", "Cost also reflects access, so patients with less access looked less ill.", "Bias entered through the data and the target, not through prejudiced programmers.", "Fairness must be designed in from the start."], "check": {"q": "In the Obermeyer case, how did the bias get in?", "o": ["Programmers were prejudiced", "There was too little data", "Cost was used as a stand-in for need"], "a": 2, "e": "Cost reflects access as well as illness. Choosing cost as the target built unfairness into a technically sound tool.", "retry": {"q": "What does the Obermeyer case teach about fairness?", "o": ["It must be designed in from the start", "It can be added once the tool is live", "It is only a problem in America"], "a": 0, "e": "Equity has to be a design requirement from the beginning, not an optional extra."}}, "scenario": {"title": "The population health tool", "setting": "A supplier offers your integrated care board a tool that picks patients for extra support. It ranks them by their predicted cost to the NHS next year.", "steps": [{"prompt": "What worries you most?", "choices": [{"t": "Cost tracks access as well as illness, so patients with poor access may be scored too low", "s": 2, "fb": "Right. This is exactly the Obermeyer problem: the wrong target builds in unfairness."}, {"t": "The tool may be too slow", "s": 0, "fb": "Speed is not the risk here."}, {"t": "The supplier may be too small", "s": 0, "fb": "Supplier size has nothing to do with this risk."}]}, {"prompt": "The supplier says the tool is technically excellent and was trained on millions of records. Does that settle it?", "choices": [{"t": "Yes, that much data cannot be biased", "s": 0, "fb": "No. The original tool had plenty of data. The problem was the target."}, {"t": "No. A technically sound tool can still be unfair if it predicts the wrong thing", "s": 2, "fb": "Right. Ask what it predicts, and whether that truly reflects need."}, {"t": "Partly. Ask them to add a fairness check after go-live", "s": 1, "fb": "A check later is better than none, but fairness should be designed in from the start."}]}]}}, {"title": "Conditions and three questions", "minutes": 3, "slides": [{"img": 13, "say": ["Why does the same tool succeed in one place and fail in another? This picture sums it up.", "On the left are the conditions for value. Good data that looks like your patients. Testing in real use, not just on old records. Fitting how people actually work. Clear rules. Trusted, trained staff.", "On the right are the ways it fails. Biased data, as with Obermeyer. Drift, where a tool slowly gets worse as the world changes. Alert fatigue, when so many alarms fire that all are ignored. Automation bias, when people follow the tool even when it is wrong. And hype.", "The same tool can land in either column. The conditions decide which."]}, {"img": 14, "say": ["So when someone says a tool is accurate, ask three questions.", "Accurate for whom? Results can differ by age, ethnic group or other conditions.", "Measured how? Tests on old records are weakest. Testing on new patients is stronger. A randomised trial of outcomes is strongest.", "Tested where? A study dataset is not your clinic. Check it locally first."]}, {"img": 16, "say": ["To finish. AI is neither magic nor a cure-all. But it reaches some of healthcare's most stubborn failures.", "Be hopeful and careful at the same time. The question is not whether healthcare will change, but whether clinicians shape that change.", "Well done. Now try the final case test."]}], "keyPoint": "The same tool can succeed or fail depending on conditions. For any accuracy claim ask: accurate for whom, measured how, tested where?", "plain": ["Conditions for value: good data, real-world testing, fits the work, clear rules, trusted and trained staff.", "Ways it fails: bias, drift, alert fatigue, automation bias, hype.", "Three questions: accurate for whom? measured how? tested where?", "Peer-reviewed evidence beats supplier claims."], "check": {"q": "Nurses ignore a monitoring tool because it alarms constantly. Which failure is this?", "o": ["Alert fatigue", "Automation bias", "Drift"], "a": 0, "e": "Alert fatigue is when so many alarms fire that all are ignored. Automation bias is the opposite: following the tool when it is wrong.", "retry": {"q": "Which kind of evidence does the chapter rate strongest?", "o": ["Accuracy on old records", "A supplier's brochure", "A randomised trial of patient outcomes"], "a": 2, "e": "Old-record accuracy is weakest, testing on new patients is stronger, and a randomised trial of outcomes is strongest."}}, "scenario": {"title": "The supplier's pitch", "setting": "A supplier tells your trust board their sepsis tool is '94 per cent accurate' and shows a chart from a study at a large American hospital.", "steps": [{"prompt": "What do you ask first?", "choices": [{"t": "How many hospitals have bought it?", "s": 0, "fb": "Popularity is not evidence for your patients."}, {"t": "Accurate for whom? Were the study patients like ours?", "s": 2, "fb": "Right. Performance can differ by population, so this is the first question."}, {"t": "What discount is available?", "s": 0, "fb": "Price is not the safety question."}]}, {"prompt": "They admit the accuracy figure comes from old records at one hospital. What does that tell you?", "choices": [{"t": "It is the weakest kind of evidence, so you need local testing on new patients", "s": 2, "fb": "Right. Measured how and tested where both point to local, forward-looking testing."}, {"t": "Old records are the most reliable test", "s": 0, "fb": "No. Testing on past data is the weakest rung."}, {"t": "It is good enough if the hospital was large", "s": 1, "fb": "Size helps, but a different setting and old data still leave the claim weak."}]}, {"prompt": "A board member asks what could go wrong after go-live even if the tool tests well. What do you say?", "choices": [{"t": "Nothing, once tested it stays good", "s": 0, "fb": "No. Tools drift as patients and practice change."}, {"t": "Drift, alert fatigue and staff following it when it is wrong, unless someone watches it", "s": 2, "fb": "Right. The failure modes are predictable, and the conditions you put in place decide the outcome."}, {"t": "Only cyber attacks", "s": 1, "fb": "Security matters, but the chapter's failure modes are drift, alert fatigue, automation bias and hype."}]}]}}], "test": [{"q": "A partner says GPs could meet every guideline if they tried harder. According to Porter and colleagues, full guideline care needs…", "o": ["About 26.7 hours a day, more than a day holds", "About 8 hours a day", "About 20 hours a day"], "a": 0, "e": "The task is structurally impossible for one person, not a matter of effort.", "lesson": 0}, {"q": "A GP practice is drowning in messages and note-writing. Which AI job fits this tier best?", "o": ["Genomic pattern-finding", "A scribe and inbox sorting", "Emergency scan triage"], "a": 1, "e": "In primary care, AI's job is to give clinicians more room through scribes and inbox tools.", "lesson": 1}, {"q": "An AI tool worked in one trust but fails in another. Which explanation does the chapter highlight?", "o": ["The second trust has too much data", "Staff there are careless", "The data is coded differently"], "a": 2, "e": "The usual barrier is governance and data sharing, not technology.", "lesson": 1}, {"q": "Which event showed that healthcare can change at speed when it has to?", "o": ["WannaCry, 2017", "COVID, 2020", "HITECH, 2009"], "a": 1, "e": "Remote consultations went from about one in ten to most contacts within weeks.", "lesson": 2}, {"q": "A trust spends heavily on AI but changes nothing about how staff work. Five years on, staff are no less exhausted. Which lesson did it ignore?", "o": ["The electronic record paradox", "The WannaCry lesson", "The Obermeyer case"], "a": 0, "e": "Technology delivers nothing until the work is redesigned around it.", "lesson": 3}, {"q": "A practice manager asks what team-based care plus AI would do to a 26.7-hour workload. The chapter suggests…", "o": ["It removes the need for preventive care", "It brings the day down to about 9.3 hours", "It makes 26.7 hours manageable for one GP"], "a": 1, "e": "Sharing work across a team and adding AI makes the impossible day merely a hard one.", "lesson": 4}, {"q": "A manager says AI will soon replace radiologists. What does the evidence cited show?", "o": ["Most radiologists are already gone", "AI cannot be used in radiology", "There is a shortage of radiologists and AI acts as an assistant"], "a": 2, "e": "The Royal College of Radiologists reported a workforce shortage, with AI used as an assistant.", "lesson": 5}, {"q": "Why does the chapter say returning documentation time is more than a convenience?", "o": ["It allows shorter appointments", "It reduces burnout and keeps experienced staff in the workforce", "It increases billing income"], "a": 1, "e": "Evening paperwork predicts burnout, and burnout drives people to cut hours or leave.", "lesson": 5}, {"q": "A colleague asks why AI should work now when it failed before. The chapter's answer is…", "o": ["Data, mature tools and willing users have arrived together", "Governments are forcing it", "Computers are finally cheap"], "a": 0, "e": "Capability, raw material and willingness arrived at the same time.", "lesson": 6}, {"q": "A tool ranks patients for extra support by predicted healthcare cost. Patients with poor access are scored as less ill. The root problem is…", "o": ["A coding error", "Cost is a poor stand-in for need", "Too little data"], "a": 1, "e": "As in the Obermeyer case, cost reflects access as well as illness, so the target builds in unfairness.", "lesson": 7}, {"q": "A supplier says its tool is highly accurate. Using the chapter's three questions, you ask…", "o": ["How many trusts have bought it?", "What does the licence cost?", "Accurate for whom, measured how, tested where?"], "a": 2, "e": "The three questions check the population, the strength of the evidence and the setting.", "lesson": 8}, {"q": "A junior doctor accepts an AI's recommendation even though her own assessment disagrees. Which failure is this?", "o": ["Automation bias", "Alert fatigue", "Drift"], "a": 0, "e": "Automation bias is deferring to the tool even when it is wrong.", "lesson": 8}]};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){ const e=document.createElement(tag); if(attrs) for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v);} for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k.nodeType?k:document.createTextNode(k)); return e; }
const pad = n => String(n).padStart(2,'0');
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const pct = x => Math.round(100*x);
function seg(options, value, onChange, label){ const w = h('div',{class:'seg',role:'group','aria-label':label||''}); const bs = options.map(([v,t]) => { const b = h('button',{type:'button','aria-pressed':String(v===value)}, t); b.onclick = () => { bs.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onChange(v); }; return b; }); w.append(...bs); return w; }

/* ---------------- metrics (Learning Index) ----------------
   Knowledge 35%: first-attempt quick checks + latest final-test answers correct
   Application 35%: points earned in case simulations (each choice 0–2)
   Self-awareness 15%: how often your confidence matched your answer (sure & right, or unsure & wrong)
   Completion 15%: lessons completed + final test taken
   Levels follow Benner's novice-to-expert stages (shortened for a short course). */
const LEVELS = [[0,'Novice','Starting out: knows the words, needs support to apply them'],[40,'Advanced beginner','Recognises the main ideas in familiar cases'],[60,'Competent','Applies the ideas to new cases and asks the right questions'],[80,'Proficient','Judges tools confidently and explains why to colleagues']];
function metrics(){

    caseCard.append(h('div',{class:'eyebrow'},'Case simulation'), h('h3',null, sc.title), h('p',{class:'case-set'}, sc.setting));
    const maxPts = sc.steps.length*2; let pts = 0, k = 0;
    const host = h('div'); caseCard.append(host);
    if (st.caseDone){ host.append(h('p',{class:'fb'}, h('span',{class: st.caseScore>=maxPts*0.75?'pill good':st.caseScore>=maxPts/2?'pill warn':'pill bad'}, `You scored ${st.caseScore} of ${maxPts}`), ' ', h('button',{class:'btn small',type:'button',onclick:()=>{ st.caseDone=false; st.caseScore=0; save(); renderCase(); }},'Try the case again'))); finishRow(); return; }
    function step(){
      const s = sc.steps[k]; const box = h('div',{class:'stepbox'}, h('p',{class:'q'}, `${k+1}. ${s.prompt}`)); const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
      s.choices.forEach(ch => { const b = h('button',{class:'opt',type:'button'}, ch.t); b.onclick = () => {
        opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ch.s===2?'right':ch.s===1?'part':'wrong');
        if (ch.s<2){ const best = s.choices.find(c=>c.s===2); if (best) [...opts.children].find(x=>x.textContent===best.t).classList.add('right'); }
        pts += ch.s; fb.innerHTML = `<b>${ch.s===2?'Good call.':ch.s===1?'Partly.':'Not the best choice.'}</b> ${ch.fb}`;
        k++; if (k < sc.steps.length) step(); else { st.caseDone = true; st.caseScore = pts; st.caseMax = maxPts; st.done = st.done || !!st.check; save(); renderSteps();
          host.append(h('p',{class:'fb',style:'margin-top:12px'}, h('span',{class: pts>=maxPts*0.75?'pill good':pts>=maxPts/2?'pill warn':'pill bad'}, `Case score: ${pts} of ${maxPts}`))); finishRow(); } };
        opts.append(b); });
      box.append(opts, fb); host.append(box);
    }
    step();
  }
  function finishRow(){
    st.done = !!(st.check && st.caseDone); save();
    const next = i < CH.lessons.length-1 ? h('button',{class:'btn primary',type:'button',onclick:()=>go('l'+(i+1))}, `Next: lesson ${i+2}`) : h('button',{class:'btn primary',type:'button',onclick:()=>go('final')}, 'Go to the final case test');
    caseCard.append(h('div',{class:'row',style:'margin-top:14px'}, next, h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my progress')));
  }
  renderCheck(); renderCase(); layout();
}

/* generic question with confidence rating */
function askQuestion(host, q, practice, onDone, isRetry){
  const box = h('div'); host.append(box);
  if (!isRetry || true) box.append(h('p',{class:'q'}, q.q));
  let conf = null;
  const confSeg = seg([['sure','I\'m sure'],['unsure','I\'m not sure']], null, v=>conf=v, 'Confidence');
  if (!practice) box.append(h('div',{class:'conf'}, h('span',null,'Before you answer, how sure are you?'), confSeg, h('span',{style:'font-size:.8rem'},'(optional, helps your self-awareness score)')));
  const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
  q.o.forEach((o,j)=>{ const b = h('button',{class:'opt',type:'button'}, o); b.onclick = () => {
    const ok = j===q.a; opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ok?'right':'wrong'); if (!ok) opts.children[q.a].classList.add('right');
    fb.innerHTML = `<b>${ok?'Right.':'Not quite.'}</b> ${q.e}`; onDone(ok, conf); };
    opts.append(b); });
  box.append(opts, fb);
}

/* ---------------- FINAL case test ---------------- */
function renderFinal(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'Final case test'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Check your learning path'), h('p',{class:'lede',style:'margin-top:6px'}, `${CH.test.length} short questions across all ${CH.lessons.length} lessons. You see the answer after each one. Your latest attempt counts towards your learning index, and the results show which lessons to revisit.`)));
  if (M.done < CH.lessons.length) main.append(h('div',{class:'card',style:'background:var(--signal-soft)'}, h('p',null, `You have finished ${M.done} of ${CH.lessons.length} lessons. You can take the test now, but you will probably score higher after finishing them.`)));
  const host = h('div',{class:'card'}); main.append(host);
  if (S.test) { host.append(h('p',null, h('span',{class:'pill acc'}, `Last attempt: ${S.test.score} of ${CH.test.length}`), ` · ${S.test.attempts} attempt${S.test.attempts>1?'s':''}`), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Take the test again'), h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my results'))); return; }
  host.append(h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Start the test'));
}
function runTest(host){
  const answers = []; let k = 0;
  const prog = h('p',{class:'eyebrow'}); host.append(prog); const qhost = h('div'); host.append(qhost);
  function next(){
    qhost.innerHTML=''; prog.textContent = `Question ${k+1} of ${CH.test.length} · from lesson ${CH.test[k].lesson+1}: ${CH.lessons[CH.test[k].lesson].title}`;
    askQuestion(qhost, CH.test[k], false, (ok, conf) => { answers.push({ok, conf, lesson: CH.test[k].lesson});
      qhost.append(h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ k++; if (k<CH.test.length) next(); else finish(); }}, k<CH.test.length-1?'Next question':'See my results'))); });
  }
  function finish(){ const score = answers.filter(a=>a.ok).length; S.test = {answers, score, attempts:(S.test?S.test.attempts:0)+1, at:Date.now()}; save(); go('progress'); }
  next();
}

/* ---------------- PROGRESS: learning index, advice, certificate ---------------- */
function gaugeSVG(v){
  const r=60, c=2*Math.PI*r, f=c*v/100;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Learning index ${v} out of 100"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${v}</text><text x="75" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">out of 100</text></svg>`;
}
function advice(){
  const out = []; const n = CH.lessons.length;
  const testBy = {}; if (S.test) S.test.answers.forEach(a=>{ (testBy[a.lesson] = testBy[a.lesson]||{ok:0,n:0}); testBy[a.lesson].n++; if (a.ok) testBy[a.lesson].ok++; });
  const weak = [];
  for (let i=0;i<n;i++){ const l = S.lessons[i]; const reasons = [];
    if (l && l.check && !l.check.ok) reasons.push('missed the quick check');
    if (l && l.caseDone && l.caseScore < l.caseMax*0.5) reasons.push(`scored ${l.caseScore} of ${l.caseMax} on the case`);
    if (testBy[i] && testBy[i].ok < testBy[i].n) reasons.push(`${testBy[i].n-testBy[i].ok} final-test question${testBy[i].n-testBy[i].ok>1?'s':''} wrong`);
    if (reasons.length) weak.push([i, reasons]); }
  weak.sort((a,b)=>b[1].length-a[1].length).slice(0,3).forEach(([i,r])=>out.push(['Revisit', `Lesson ${i+1}, ${CH.lessons[i].title}: you ${r.join(', ')}. Try it in Read mode and open "Explain more simply".`, 'l'+i]));
  const nf = [...Array(n).keys()].find(i=>!(S.lessons[i]&&S.lessons[i].done));
  if (nf!==undefined) out.push(['Next', `Carry on with lesson ${nf+1}, ${CH.lessons[nf].title}.`, 'l'+nf]);
  else if (!S.test) out.push(['Next', 'All lessons done. Take the final case test to check your learning path.', 'final']);
  const M = metrics();
  if (M.calN >= 4 && M.C < 0.6) out.push(['Self-awareness', 'Your confidence often did not match your answers. In clinical work, knowing when you are unsure matters as much as knowing the answer. Keep rating your confidence.', null]);
  if (S.plan && S.secs > 0){ const done = Object.values(S.lessons).filter(l=>l.done); const avg = done.length ? done.reduce((a,l)=>a+l.secs,0)/done.length/60 : 0;
    if (avg >= 0.5) out.push(['Your pace', `You spend about ${avg.toFixed(1)} minutes per lesson. ${avg > 6 ? 'Taking your time is fine. Shorter sittings may suit you better: try 5-minute sittings on the Start page.' : avg < 2.5 ? 'You move quickly. If the cases feel easy, the Fast track path lets you skip straight to them.' : 'That fits your plan well.'}`, null]); }
  if (!out.length) out.push(['Well done', 'No gaps found. You could teach this chapter to a colleague.', null]);
  return out;
}
function renderProgress(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'My progress'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Your learning index'), h('p',{class:'lede',style:'margin-top:6px'}, S.test ? 'Based on your lessons, cases and final test.' : 'Provisional until you take the final case test.')));
  const dims = [['Knowledge', M.K, 'Quick checks right first time, plus final-test answers'], ['Applying it', M.A, 'Points from the case simulations'], ['Self-awareness', M.C, 'How often your confidence matched your answer'], ['Completion', M.P, 'Lessons finished and final test taken']];
  const dimsEl = h('div',{class:'dims'}, dims.map(([n,v,d])=>h('div',null, h('div',{class:'dim'}, h('span',null,n), h('div',{class:'track'}, h('div',{class:'fill',style:`width:${v==null?0:pct(v)}%`})), h('output',null, v==null?'—':pct(v)+'%')), h('div',{style:'font-size:.78rem;color:var(--muted);margin:-4px 0 0'}, d))));
  const ladder = h('div',{class:'ladder'}, LEVELS.map(l=>h('div',{class: l[1]===M.level?'on':''}, l[1], h('br'), `${l[0]}+`)));
  main.append(h('div',{class:'card'}, h('div',{class:'gauge'}, h('div',{html:gaugeSVG(M.index)}), h('div',{style:'flex:1;min-width:240px'}, h('h3',null, M.level), h('p',{class:'lede'}, M.levelText), ladder)), h('div',{style:'margin-top:16px'}, dimsEl),
    h('p',{class:'foot',style:'margin-top:12px'},'How it is worked out: knowledge 35%, applying it 35%, self-awareness 15%, completion 15%. Levels follow Benner\'s "novice to expert" stages used in clinical education.')));
  const adv = h('div',{class:'advice'}, advice().map(([t,txt,v])=>h('div',null, h('span',{class:'pill acc',style:'flex:none'},t), h('span',{style:'flex:1'},txt), v ? h('button',{class:'btn small',type:'button',onclick:()=>go(v)},'Go') : null)));
  main.append(h('div',{class:'card'}, h('h3',null,'What to do next'), adv));
  const rows = CH.lessons.map((les,i)=>{ const l = S.lessons[i]||{}; return h('tr',null, h('td',null, `${i+1}. ${les.title}`), h('td',null, l.watched?'✓':'—'), h('td',null, l.check ? (l.check.ok ? h('span',{class:'pill good'},'Right') : h('span',{class:'pill warn'},'Missed')) : '—'), h('td',null, l.caseDone ? `${l.caseScore}/${l.caseMax}` : '—'), h('td',{class:'mono'}, l.secs ? (l.secs<60 ? '<1 min' : Math.round(l.secs/60)+' min') : '—')); });
  main.append(h('div',{class:'card'}, h('h3',null,'Lesson by lesson'), h('div',{class:'tablewrap'}, h('table',{class:'t'}, h('thead',null,h('tr',null, ['Lesson','Watched','Check','Case','Time'].map(t=>h('th',null,t)))), h('tbody',null,rows))),
    S.test ? h('p',{style:'margin-top:10px'}, h('span',{class:'pill acc'}, `Final test: ${S.test.score} of ${CH.test.length}`)) : null));
  // certificate
  const nameIn = h('input',{type:'text',id:'certName',placeholder:'Your name as it should appear',value:S.name||''});
  const certBtn = h('button',{class:'btn primary',type:'button'},'Download certificate');
  const note = h('p',{class:'foot'});
  const eligible = S.test && M.index >= 60;
  certBtn.disabled = !eligible; note.textContent = eligible ? 'Saves a picture of your certificate. Your score is calculated in your own browser, so keep the file as your record.' : 'Available once you have taken the final case test and reached Competent (60 or more).';
  certBtn.onclick = () => { S.name = nameIn.value.trim(); save(); makeCert(S.name || 'Learner', M); };
  main.append(h('div',{class:'card'}, h('h3',null,'Certificate'), h('div',{class:'row'}, nameIn, certBtn), note,
    h('div',{class:'row',style:'margin-top:14px'}, h('button',{class:'btn small',type:'button',onclick:()=>{ resetBox.hidden = false; }},'Start this chapter again'))));
  const resetBox = h('div',{class:'card',hidden:true,style:'background:var(--bad-soft)'}, h('p',null,'This clears your plan, answers and scores for this chapter in this browser. It cannot be undone.'), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn',type:'button',onclick:()=>{ S = blank(); save(); go('start'); }},'Yes, clear this chapter'), h('button',{class:'btn',type:'button',onclick:()=>{ resetBox.hidden=true; }},'Keep my progress')));
  main.append(resetBox);
}
function makeCert(name, M){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1130; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0,0,1600,1130); x.strokeStyle = '#0E6B66'; x.lineWidth = 14; x.strokeRect(40,40,1520,1050); x.lineWidth = 2; x.strokeRect(70,70,1460,990);
  x.fillStyle = '#0E6B66'; x.textAlign = 'center'; x.font = '600 30px Georgia, serif'; x.fillText('A CLINICAL GUIDE TO AI IN HEALTHCARE', 800, 180);
  x.fillStyle = '#14232A'; x.font = '600 72px Georgia, serif'; x.fillText('Certificate of learning', 800, 290);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('This is to record that', 800, 380);
  x.fillStyle = '#14232A'; x.font = '600 64px Georgia, serif'; x.fillText(name.slice(0,48), 800, 470);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('has completed', 800, 550);
  x.fillStyle = '#14232A'; x.font = '600 40px Georgia, serif'; x.fillText((CH.num==='A'?'Appendix A: ':'Chapter '+CH.num+': ') + CH.title, 800, 620, 1400);
  x.fillStyle = '#0E6B66'; x.font = '600 46px Arial, sans-serif'; x.fillText(`Learning index ${M.index} / 100  ·  ${M.level}`, 800, 740);
  x.fillStyle = '#55686D'; x.font = '24px Arial, sans-serif';
  x.fillText(`Knowledge ${pct(M.K)}%   ·   Applying it ${pct(M.A)}%   ·   Self-awareness ${M.C==null?'—':pct(M.C)+'%'}   ·   Final test ${S.test.score}/${CH.test.length}`, 800, 800);
  x.fillText('Issued ' + new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) + '  ·  Self-assessed online course record, calculated in the learner\'s browser', 800, 980);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `certificate-${CH.id}.png`; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); });
}

/* ---------------- boot ---------------- */
$('#chNum').textContent = CH.num==='A' ? 'Appendix A' : 'Chapter '+CH.num;
$('#chTitle span').textContent = CH.title;
const hv = (location.hash||'').slice(1);
go(views().includes(hv) ? hv : (S.plan ? 'l'+firstUnfinished() : 'start'));
</script>
