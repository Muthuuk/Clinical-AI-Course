<script>
const CH = {"id": "ch05", "num": "5", "title": "Trust, Security, and Assurance for Clinical AI", "summary": "Why an accurate AI tool can still be unsafe, and the layers of protection, evidence and good habits that make it safe to trust.", "outcomes": ["Say the difference between security, assurance and trust in plain words", "Explain why the whole system, not just the model, must be trustworthy", "Spot the four main ways an AI tool can be attacked", "Ask a supplier for an ingredients list of what is inside their tool", "Explain why long-lived health data needs stronger locks now, not later"], "starter": [{"q": "An AI tool passes every accuracy test. Does that prove it is safe to use?", "o": ["Yes, accurate means safe", "No, it can still fail in other ways", "Only if it is cloud-based"], "a": 1}, {"q": "A sepsis alert tool is faultless, but its alert messages stop arriving on the ward. Has the system failed?", "o": ["No, the model is fine", "Yes, the whole system has failed the patient", "Only if a patient complains"], "a": 1}, {"q": "Genetic data must stay private for fifty years. When should it be moved to stronger encryption?", "o": ["Now", "When quantum computers go on sale", "Never, it is already encrypted"], "a": 0}], "lessons": [{"title": "Accurate is not the same as safe", "minutes": 2, "slides": [{"img": 3, "say": ["Welcome to Chapter 5, Trust, Security, and Assurance for Clinical AI. I'm Sam, your tutor.", "Here is the big idea. An AI tool can be accurate and still be unsafe.", "It can pass every test of accuracy and then let a patient down.", "How? Its training data may have been tampered with. A piece of software buried inside it may have a known flaw.", "Nobody may be able to show why its answers should be believed. Or the service that sends its alerts may stop working without telling anyone.", "Here is an example. A hospital uses a scan-reading tool. Nobody wrote down which shared software parts it is built from.", "Later, a flaw is found in one of those parts. Now the hospital cannot tell if its tool is affected. It cannot fix it with confidence. It cannot reassure the regulator.", "Notice that the tool never changed. It is as accurate as the day it arrived. Yet trust has collapsed.", "That is why Kelly and colleagues argued in 2019 that trustworthiness, not accuracy alone, decides what a tool does for patients.", "So this chapter asks a different question. Not just does it work, but can we trust it, and why?"]}], "keyPoint": "A tool can pass every accuracy test and still be unsafe. Trust depends on more than accuracy.", "plain": ["Accuracy is only one part of safety.", "Tampered data, flawed software parts, missing evidence or a broken alert service can all cause harm.", "A tool can stay exactly the same while trust in it collapses."], "check": {"q": "A scan-reading tool is still as accurate as ever, but a flaw is found in one of its hidden software parts. What is the problem?", "o": ["There is no problem, accuracy is unchanged", "The tool must be retrained", "The hospital cannot tell if it is affected, so trust collapses"], "a": 2, "e": "Without a record of what is inside the tool, nobody can tell whether it is affected. Accuracy alone does not make it safe.", "retry": {"q": "Which statement matches this chapter?", "o": ["Accurate does not mean safe", "Accurate means safe", "Safety is the supplier's problem only"], "a": 0, "e": "A tool can pass every benchmark and still fail patients in other ways."}}, "scenario": {"title": "The board paper", "setting": "Your trust board is asked to approve a new AI chest X-ray tool. The paper says it is 'the most accurate on the market' and nothing else.", "steps": [{"prompt": "What is your first reaction?", "choices": [{"t": "Accuracy is high, so approve it", "s": 0, "fb": "No. Accurate does not mean safe. The paper says nothing about how it could fail."}, {"t": "Ask what else could make it fail, beyond accuracy", "s": 2, "fb": "Right. Tampered data, flawed parts, missing evidence and broken alerts all matter."}, {"t": "Ask how much it costs", "s": 1, "fb": "Fair question later, but safety comes first."}]}, {"prompt": "The supplier says 'nobody has ever complained about it'. What do you say?", "choices": [{"t": "That settles it", "s": 0, "fb": "No. Silence is not evidence of safety."}, {"t": "Ask what evidence shows the whole tool can be trusted", "s": 2, "fb": "Right. Trust must be earned with evidence, not assumed."}, {"t": "Ask for a longer trial", "s": 1, "fb": "Helpful, but a trial still needs to look at more than accuracy."}]}]}}, {"title": "Three words, one goal", "minutes": 2, "slides": [{"img": 4, "say": ["Three words run through this chapter, and they are easily mixed up. Let's separate them.", "Security is protection. It protects three things. Keeping data private. Keeping the data and the tool uncorrupted. And keeping the service running when you need it.", "Assurance is evidence. It is the paperwork, the testing and the reasoned argument that show the tool is trustworthy, and will stay that way.", "Trust is the result. It is the willingness of clinicians, patients and regulators to rely on the tool. And that willingness must be earned, not assumed.", "So security and assurance are the means. Trust is the end. There is no shortcut."]}, {"img": 5, "say": ["This picture shows the same idea as layers. Read it from the bottom up.", "At the base is governance. That means the rules, the management and the risk checks an organisation runs.", "On top of that sits security, protecting the data and the tool.", "Above that sits assurance, gathering the evidence that the whole thing works.", "At the very top is the goal. Trusted AI in everyday care.", "Take any layer away and the top is no longer held up. That is why security is built in from the first design decision, not bolted on at the end.", "In ordinary software, adding security late is expensive. In clinical AI, it is dangerous."]}], "keyPoint": "Security protects, assurance proves, and trust is the result. Take away a layer and trust is no longer held up.", "plain": ["Security: keep data private, keep the tool uncorrupted, keep it running.", "Assurance: the evidence that it is trustworthy.", "Trust: the earned result, not a starting assumption.", "Build security in from day one, not at the end."], "check": {"q": "Which of these is assurance rather than security?", "o": ["Documented testing that shows the tool is trustworthy", "Encrypting patient records", "Blocking strangers from the model"], "a": 0, "e": "Assurance is evidence. The other two are protection, which is security.", "retry": {"q": "In this chapter, trust is…", "o": ["The starting point", "Another word for security", "The earned result of security and assurance"], "a": 2, "e": "Security and assurance are the means. Trust is the end."}}, "scenario": {"title": "The IT request form", "setting": "You are asked to help write a trust IT request for an AI discharge-summary tool. A colleague says 'just put that the supplier has good security'.", "steps": [{"prompt": "Is good security enough on its own?", "choices": [{"t": "Yes, security is the main thing", "s": 0, "fb": "No. Security protects, but you also need evidence that the tool works and stays safe."}, {"t": "No, you also need assurance, the evidence it can be trusted", "s": 2, "fb": "Right. Security and assurance together earn trust."}, {"t": "No, you only need a signed contract", "s": 0, "fb": "A contract is not evidence of safety."}]}, {"prompt": "The supplier offers to 'add security features after go-live'. What do you say?", "choices": [{"t": "Fine, as long as it is in the plan", "s": 0, "fb": "No. Security added late is dangerous in clinical AI."}, {"t": "Security must be built in before go-live", "s": 2, "fb": "Right. Security is a foundation, not an extra."}, {"t": "Ask for a discount", "s": 1, "fb": "Price is not the issue. Timing of security is."}]}]}}, {"title": "The model is not the system", "minutes": 2, "slides": [{"img": 6, "say": ["So what exactly is a clinical AI system? You can only protect what you have drawn a line around.", "Picture a set of rings, one inside another. In the centre is the model. That is the part that learned from data and makes the predictions.", "Around the model sits the software it lives in, and all the shared building blocks that software relies on.", "Around that sit the computers, the network and the storage it runs on.", "And around everything sit the people and the processes. Clinicians, patients, training, oversight and governance.", "Each ring can fail in its own way. And each failure can harm a patient just as surely as a wrong prediction.", "Here is an example. A sepsis prediction model is faultless. It spots deteriorating patients well. But the messaging service that carries its alerts fails silently. No alert reaches the ward.", "The model did nothing wrong. Yet the system failed the patient.", "So the model is not the system. Trust must hold across every ring.", "Drawing that line widely is the first act of assurance."]}], "keyPoint": "A clinical AI system is the model plus its software, its computers and its people. Any ring can fail the patient.", "plain": ["Centre: the model.", "Next ring: the software and its building blocks.", "Next ring: computers, network and storage.", "Outer ring: people and processes.", "A perfect model with a broken alert service still fails the patient."], "check": {"q": "A sepsis model predicts well, but its alerts silently stop reaching the ward. How should you describe this?", "o": ["A model error needing retraining", "An attack on the training data", "A system failure, even though the model is faultless"], "a": 2, "e": "The model is only one ring. If the alert service fails, the whole system fails the patient.", "retry": {"q": "Which of these is part of a clinical AI system?", "o": ["The model, its software, its computers and its people", "Only the model", "Only the people who use it"], "a": 0, "e": "The system is all the rings together, not just the model."}}, "scenario": {"title": "The missing alerts", "setting": "On your ward, the deterioration alerts have been quiet for three days. The IT team says 'the model is running fine'.", "steps": [{"prompt": "What do you think?", "choices": [{"t": "The model is fine, so all is well", "s": 0, "fb": "No. The model is only one ring. Alerts travel through other parts that can fail."}, {"t": "Check the whole chain, from model to the screen on the ward", "s": 2, "fb": "Right. The alert service, network or screens may have failed silently."}, {"t": "Assume patients have simply been well", "s": 1, "fb": "Possible, but three silent days deserve a check of the whole chain."}]}, {"prompt": "You find the messaging service stopped on Monday. Who should hear about it?", "choices": [{"t": "Nobody, it is fixed now", "s": 0, "fb": "No. A silent failure of three days is a safety incident."}, {"t": "Report it as a safety incident so the whole system can be reviewed", "s": 2, "fb": "Right. The failure sat outside the model, and the system design needs to catch it next time."}, {"t": "Only the IT team", "s": 1, "fb": "IT needs to know, but so do the clinical safety leads."}]}]}}, {"title": "Two rulebooks for running AI", "minutes": 2, "slides": [{"img": 7, "say": ["Once you know what the system is, you need a way to run it well. Two rulebooks are widely used.", "On the left is an international standard called ISO 42001, published in 2023. It is the first world standard for managing AI in an organisation.", "It works as a simple cycle. Plan what you will do. Do it. Check how it went. Act on what you learn. Then go round again.", "Its big advantage is that an outside body can audit your organisation and certify it. If your trust already works to the information security standard ISO 27001, this will feel familiar.", "On the right is the NIST framework, from the United States. It has four jobs. Govern means setting a culture of responsibility. Map means finding the risks. Measure means tracking them. Manage means dealing with them.", "How do they fit? The standard gives you the engine. The framework gives you the ideas. A certified organisation can run the four NIST jobs again and again.", "Neither is enough alone, so combine them.", "One caution. A certificate shows a good process. It does not prove that any one model is safe. A certified trust can still deploy a faulty tool."]}], "keyPoint": "ISO 42001 is a certifiable plan, do, check, act cycle. NIST gives four risk jobs. Use both, and remember a certificate is not proof a model is safe.", "plain": ["ISO 42001: plan, do, check, act. Can be certified by an outside body.", "NIST framework: govern, map, measure, manage.", "The standard is the engine, the framework is the ideas.", "A certificate proves a process, not a safe model."], "check": {"q": "Your trust has just been certified to ISO 42001. A colleague says every AI model you use is now proven safe. What is the best reply?", "o": ["Correct, certification checks each model", "Certification proves the process, not the safety of any one model", "Certification only covers paper records"], "a": 1, "e": "A certificate shows a good management process. A certified trust can still deploy a faulty tool.", "retry": {"q": "Which four jobs make up the NIST framework?", "o": ["Plan, Do, Check, Act", "Collect, Train, Test, Use", "Govern, Map, Measure, Manage"], "a": 2, "e": "Govern, map, measure and manage are the NIST jobs. Plan, do, check, act is the ISO cycle."}}, "scenario": {"title": "The supplier's certificate", "setting": "A supplier shows you a framed ISO 42001 certificate and says 'so you don't need to check our tool'.", "steps": [{"prompt": "What does the certificate actually tell you?", "choices": [{"t": "That every one of their models is safe", "s": 0, "fb": "No. It proves a good process, not a safe model."}, {"t": "That they run a good management process", "s": 2, "fb": "Right. That is valuable, but it is not proof about this tool."}, {"t": "Nothing at all", "s": 1, "fb": "Too harsh. It shows a sound process, which matters, but it is not the whole story."}]}, {"prompt": "What do you ask for next?", "choices": [{"t": "Evidence about this particular tool, such as testing and risk records", "s": 2, "fb": "Right. The certificate covers the organisation. You need evidence about the tool."}, {"t": "A copy of the certificate for your files", "s": 1, "fb": "Fine to keep, but it does not answer the safety question."}, {"t": "Nothing, the certificate is enough", "s": 0, "fb": "No. Certification is not proof of a safe model."}]}]}}, {"title": "Four ways to attack an AI tool", "minutes": 2, "slides": [{"img": 8, "say": ["Clinical AI faces a special kind of attack. The tool keeps running normally while someone quietly corrupts what it learns or decides. That makes these attacks hard to spot.", "Picture the life of a tool in four stages, each with its own attack.", "Stage one is the training data. The attack is poisoning. Someone slips tampered images into the data the tool learns from. It works on most cases, but fails on the cases the attacker chose.", "Stage two is the model itself. The attack is theft. Someone copies the model, or worse, works out whether a particular patient's record was used to train it.", "Stage three is use on a new patient. The attack is evasion. In 2019 Finlayson and colleagues added noise too small to see to skin images. The tool flipped its answer from benign to cancer.", "Stage four is the output. The attack is tampering with results after the tool has produced them.", "How do you defend? Check the data before training. Train the tool to resist tricks. Control who can reach it. And watch how it behaves in use.", "Layer these defences, so there is no single door for an attacker to open."]}], "keyPoint": "Attacks strike at four stages: poisoned data, stolen models, tricked inputs and tampered outputs. Layer the defences.", "plain": ["Poisoning: tampered training data.", "Theft: copying the model or its patients' details.", "Evasion: a tiny change to an input flips the answer.", "Tampering: changing the results afterwards.", "No single defence is enough. Layer them."], "check": {"q": "A skin image is altered with noise invisible to the eye, and the AI changes its answer from benign to cancer. Which attack is this?", "o": ["Poisoning", "Theft", "Evasion"], "a": 2, "e": "Evasion tricks the tool at the moment of use. Finlayson and colleagues showed this in 2019.", "retry": {"q": "An attacker adds tampered images to the data a tool learns from. What is this called?", "o": ["Data poisoning", "Output tampering", "Model theft"], "a": 0, "e": "Poisoning attacks the training stage by corrupting what the tool learns."}}, "scenario": {"title": "The shared image bank", "setting": "Your hospital is building a skin-lesion tool from an image bank shared by several hospitals. Anyone at those hospitals can upload images.", "steps": [{"prompt": "What is the main attack to worry about here?", "choices": [{"t": "Poisoning, because anyone can add tampered images to the training data", "s": 2, "fb": "Right. Open uploads make poisoning the training data the obvious risk."}, {"t": "A power cut", "s": 0, "fb": "That is an ordinary IT risk, not an attack on what the tool learns."}, {"t": "Evasion at the bedside", "s": 1, "fb": "Possible later, but the open upload is the bigger weakness right now."}]}, {"prompt": "Which defence most directly addresses it?", "choices": [{"t": "Encrypt the tool's outputs", "s": 0, "fb": "That protects results, not the training data."}, {"t": "Check and validate images before they are used for training", "s": 2, "fb": "Right. Match the defence to the stage under attack."}, {"t": "Buy more servers", "s": 0, "fb": "Capacity does not stop poisoning."}]}]}}, {"title": "What is inside the tool?", "minutes": 2, "slides": [{"img": 9, "say": ["Now a quieter risk. The supply chain.", "No clinical AI tool is built from scratch. It is assembled from parts. Shared software libraries. Models that someone else trained first. Public datasets. Outside services.", "Each part depends on further parts, so the risk spreads like the branches of a tree.", "The key question is this. When a flaw is announced in some part, can you tell whether your tool is affected?", "The answer is an ingredients list, called a bill of materials.", "A software bill of materials lists every software package, its version and its licence. But it misses the parts that are special to AI.", "An AI bill of materials adds those. The datasets used. The learned numbers inside the model. And the ready-made model it was built on.", "Why does that matter? Suppose your tool was adapted from a ready-made model that someone else trained. Later, that model is found to have been poisoned.", "A software list alone would never show it. An AI list would.", "The payoff is simple. When something goes wrong, you can trace it and recall every product it touched."]}], "keyPoint": "Ask for an ingredients list. A software list covers the code. An AI list also covers the data and the model it was built on.", "plain": ["AI tools are built from borrowed parts.", "A software bill of materials lists the software packages.", "An AI bill of materials also lists datasets, model numbers and the base model.", "With a list, you can trace a flaw and recall what it touched."], "check": {"q": "Your tool was built on a ready-made base model later found to be poisoned. Which record would show you are affected?", "o": ["An AI bill of materials", "A software bill of materials only", "The staff training register"], "a": 0, "e": "Only the AI list records the base model, datasets and learned numbers.", "retry": {"q": "What is a bill of materials, in plain words?", "o": ["An invoice", "A list of staff who use the tool", "An ingredients list of what the tool is made from"], "a": 2, "e": "It lists every part inside the tool, so you can trace a flaw."}}, "scenario": {"title": "The vulnerability notice", "setting": "A radiology AI supplier announces a flaw in a software library their product uses. Your hospital installed the product six months ago.", "steps": [{"prompt": "What do you ask the supplier first?", "choices": [{"t": "Which versions of the product contain the flawed library, and is ours one of them?", "s": 2, "fb": "Right. That is exactly what a bill of materials should answer."}, {"t": "Whether the flaw is in the news", "s": 0, "fb": "Not relevant to patient safety."}, {"t": "Whether other hospitals are worried", "s": 1, "fb": "Interesting, but you need to know about your own installation."}]}, {"prompt": "The supplier says they have never kept a list of parts. What does this tell you?", "choices": [{"t": "Nothing, lists are optional", "s": 0, "fb": "No. Without a list nobody can tell what is affected."}, {"t": "They cannot confidently say whether you are exposed, so treat the tool as possibly affected", "s": 2, "fb": "Right. No ingredients list means no traceability."}, {"t": "The flaw cannot affect you", "s": 0, "fb": "Not knowing is not the same as being safe."}]}]}}, {"title": "Every promise needs a test", "minutes": 2, "slides": [{"img": 10, "say": ["Clinical AI belongs with aircraft controls and nuclear plants. Systems like that are not just tested. They are assured.", "This picture is shaped like a letter V. It shows how.", "Read down the left arm. It starts with the clinical purpose. What is the tool for, and for whom? From that come the safety requirements. Then the design. Then the build.", "At the bottom of the V, the system is built.", "Now read up the right arm. Each small part is tested. Then the parts are tested together. Then the system is tested against attack. And at the top, the whole thing is tested in the clinic.", "The dashed lines across the V are the heart of it. Every promise on the left has a matching test on the right.", "The result is called an assurance case. A clear argument, backed by evidence, that the tool is safe enough.", "Here is the common failure. Excellent tests of each small part, but no clinical testing at the top. The parts all work, but the whole solves the wrong problem.", "So assurance is more than testing. It links every claim to its evidence."]}], "keyPoint": "Requirements go down one arm of the V, tests come up the other. Every promise needs a matching test.", "plain": ["Left arm: purpose, safety needs, design, build.", "Right arm: test the parts, test them together, test against attack, test in the clinic.", "A promise with no matching test is a risk.", "Assurance case: the argument plus the evidence."], "check": {"q": "A team has thorough tests of every small part of its AI, but no clinical testing. What is the risk?", "o": ["The system will run too slowly", "The parts work but the whole may solve the wrong clinical problem", "The data will be stolen"], "a": 1, "e": "Without clinical testing at the top of the V, nothing shows the tool does its clinical job.", "retry": {"q": "In the V picture, what do the dashed lines across the V mean?", "o": ["Every requirement has a matching test", "The project is behind schedule", "The tool uses two computers"], "a": 0, "e": "Each promise on the left is checked by a test on the right."}}, "scenario": {"title": "The supplier's test report", "setting": "A supplier of a falls-risk tool sends you a thick test report. Every page is about testing small pieces of code.", "steps": [{"prompt": "What is missing?", "choices": [{"t": "Nothing, it is very thorough", "s": 0, "fb": "No. Testing parts is not the same as testing the whole in the clinic."}, {"t": "Evidence that the whole tool was tested against its clinical purpose", "s": 2, "fb": "Right. The top of the V is missing."}, {"t": "More pages", "s": 0, "fb": "Thickness is not evidence."}]}, {"prompt": "You ask for the safety requirements. They send a list, but two have no test against them. What do you conclude?", "choices": [{"t": "Two promises have no proof, so they are open risks", "s": 2, "fb": "Right. A requirement with no matching test is a gap in the V."}, {"t": "Two out of many is fine", "s": 1, "fb": "It may be, but each untested promise must be looked at, not waved through."}, {"t": "The list proves the tool is safe", "s": 0, "fb": "A list of promises is not evidence they were kept."}]}]}}, {"title": "Data that outlives its locks", "minutes": 2, "slides": [{"img": 11, "say": ["Health data has an unusual property. It lives a long time.", "A genome, a childhood diagnosis or a lifelong identifier must stay private for decades, not months.", "Today that data is scrambled by encryption, so only the right people can read it. But a new kind of computer, a quantum computer, is expected to break some of today's scrambling.", "That creates a threat called harvest now, decrypt later. Follow the timeline across the slide.", "Today, data is scrambled and sent. In the near future, an attacker copies the scrambled data and simply stores it. Years later, with a quantum computer, they unscramble it. And the patient is still alive.", "This is not science fiction. The American standards body published the first quantum-resistant encryption standards in 2024.", "So what should your organisation do? Four steps. Find out where encryption protects your data. Work out which data must live for decades. Move that data to quantum-resistant locks first. And make new purchases ready for the change.", "Some say quantum computers are decades away, so we can wait. But the data can be copied today.", "Choose the lock for the life of the data, not the life of the system. Start now."]}], "keyPoint": "Data copied today can be unscrambled later. Health data that lives fifty years needs quantum-resistant locks now.", "plain": ["Health data must stay private for decades.", "Harvest now, decrypt later: copy the scrambled data today, unscramble it years later.", "Four steps: find your encryption, find long-lived data, move it first, buy ready for change.", "Choose the lock for the life of the data."], "check": {"q": "Your trust holds genetic data that must stay private for fifty years. When should it move to quantum-resistant encryption?", "o": ["Once quantum computers are on sale", "Only after a breach", "Now, because stolen data can be unscrambled later"], "a": 2, "e": "Harvest now, decrypt later means today's copies become readable in future. Protect for the life of the data.", "retry": {"q": "What is the first of the four steps?", "o": ["Buy a quantum computer", "Find out where encryption protects your data", "Delete old records"], "a": 1, "e": "You cannot plan the move until you know where your encryption is."}}, "scenario": {"title": "The genomics board memo", "setting": "You are drafting a one-page memo for the board on protecting the trust's genomic data. A director writes back: 'quantum computers don't exist yet, why spend money now?'", "steps": [{"prompt": "What is your key point?", "choices": [{"t": "Attackers can copy the scrambled data today and unscramble it later", "s": 2, "fb": "Right. The threat is to data copied now, not only in the future."}, {"t": "Everyone else is doing it", "s": 0, "fb": "Not an argument about risk."}, {"t": "The new encryption is faster", "s": 0, "fb": "Not the point. The point is the long life of the data."}]}, {"prompt": "The director asks for a first step that costs little. What do you suggest?", "choices": [{"t": "Replace every system at once", "s": 0, "fb": "Too much, too soon. Start with an inventory."}, {"t": "List where encryption protects data and which data is long-lived", "s": 2, "fb": "Right. That is the first of the four steps and it costs little."}, {"t": "Wait for a national instruction", "s": 1, "fb": "Guidance helps, but the inventory can start now."}]}]}}, {"title": "No single wall", "minutes": 3, "slides": [{"img": 12, "say": ["Let's be honest about the limits of everything we have met. Honesty is what separates real care from box ticking.", "The ISO standard can be certified, but it proves a process, not a safe model. The NIST framework is thorough, but voluntary. The European AI law is binding, but law lags behind technology.", "Defences against attack are an arms race. Every defence invites a new attack. Ingredients lists are only as good as the effort to keep them current. Quantum-resistant locks are costly to fit, and a plan never carried out protects nobody.", "So frameworks shape your judgement. They do not replace it. The most important control is a culture where raising a safety worry is rewarded."]}, {"img": 13, "say": ["Now picture the whole chapter as rings around one thing. Patient safety sits in the centre.", "Closest to the data is encryption, including the new quantum-resistant kind. Next are the defences against attack. Then the ingredients lists. And around everything, governance and assurance.", "This is called defence in depth. No single ring keeps the patient safe. An attacker who breaks one ring meets the next.", "It does not promise that nothing can go wrong. It promises that no single failure is a disaster."]}, {"img": 15, "say": ["Trust in clinical AI is engineered, not assumed.", "Carry this mindset into your work. Ask not only whether a tool works. Ask how it could be made to fail, who might want it to, and what evidence would justify trusting it anyway.", "Well done. Now try the final case test."]}], "keyPoint": "No rule or tool is perfect, so layer them. Ask how a tool could fail, who might want it to, and what evidence earns trust.", "plain": ["Every framework has limits. They shape judgement but do not replace it.", "Defence in depth: rings of protection around patient safety.", "No single failure should be a disaster.", "Ask: how could it fail, who would want it to, what evidence earns trust?"], "check": {"q": "An attacker gets past a hospital AI's supply-chain checks but is stopped by data checks and access controls. Which idea is at work?", "o": ["Defence in depth", "Harvest now, decrypt later", "Plan, do, check, act"], "a": 0, "e": "Layered rings mean an attacker who breaks one is met by the next.", "retry": {"q": "According to the chapter, what is the most important control of all?", "o": ["The newest encryption", "A culture where raising safety worries is rewarded", "A certificate on the wall"], "a": 1, "e": "Frameworks shape judgement. A culture that welcomes safety concerns underpins everything else."}}, "scenario": {"title": "The two-year-old list", "setting": "In a supplier meeting, a company shows you a bill of materials last updated two years ago, and says their single firewall 'makes everything else unnecessary'.", "steps": [{"prompt": "What do you think of the two-year-old list?", "choices": [{"t": "Lists never change, so it is fine", "s": 0, "fb": "No. Parts change constantly. An old list gives false comfort."}, {"t": "An out-of-date list may give false security", "s": 2, "fb": "Right. The list is only as good as the effort to keep it current."}, {"t": "It replaces the need for clinical testing", "s": 0, "fb": "No. It is one ring, not the whole defence."}]}, {"prompt": "And the single firewall claim?", "choices": [{"t": "One strong wall is best", "s": 0, "fb": "No. If that wall falls, nothing is left. That is the opposite of defence in depth."}, {"t": "Ask what happens if the firewall fails", "s": 2, "fb": "Right. Defence in depth means a second ring is always waiting."}, {"t": "Ask how expensive the firewall is", "s": 1, "fb": "Cost matters, but the safety question is what sits behind the wall."}]}, {"prompt": "A junior colleague wants to raise a safety worry about the tool but fears looking awkward. What do you do?", "choices": [{"t": "Tell them to wait until after the contract is signed", "s": 0, "fb": "No. A culture that rewards raising concerns is the most important control."}, {"t": "Encourage them to raise it now, and thank them", "s": 2, "fb": "Right. Safety worries raised early are the cheapest to fix."}, {"t": "Raise it yourself without mentioning them", "s": 1, "fb": "The worry gets heard, but the colleague learns to stay quiet."}]}]}}], "test": [{"q": "A board member says 'our AI is the most accurate on the market, so it is safe'. Which reply fits this chapter?", "o": ["Agreed, accuracy means safety", "Accuracy is irrelevant", "Accuracy matters, but trust depends on security and evidence across the whole system"], "a": 2, "e": "A tool can pass every benchmark and still be unsafe.", "lesson": 0}, {"q": "Which of these is an example of security, rather than assurance?", "o": ["A documented test report", "Encrypting patient records", "A reasoned safety argument"], "a": 1, "e": "Security is protection. Testing and argument are assurance.", "lesson": 1}, {"q": "A supplier plans to add security 'after the tool proves itself'. What does the chapter say?", "o": ["Security must be built in from the first design decision", "Sensible, prove it first", "Security is only for cloud tools"], "a": 0, "e": "Security added late is expensive in software and dangerous in clinical AI.", "lesson": 1}, {"q": "A faultless readmission model sits on a server that keeps crashing, so results arrive hours late. What has failed?", "o": ["The system, even though the model is faultless", "The model", "Nothing, the model is accurate"], "a": 0, "e": "The model is only one ring. The computers it runs on are part of the system.", "lesson": 2}, {"q": "Which cycle does the ISO 42001 standard use?", "o": ["Govern, map, measure, manage", "Collect, clean, train, test", "Plan, do, check, act"], "a": 2, "e": "Plan, do, check, act is the ISO cycle. The NIST framework uses govern, map, measure, manage.", "lesson": 3}, {"q": "An attacker cannot reach your model but can upload images to the shared bank it learns from. Which attack is this?", "o": ["Evasion", "Model theft", "Data poisoning"], "a": 2, "e": "Poisoning corrupts the training data.", "lesson": 4}, {"q": "Someone works out whether a named patient's record was used to train a model. Which stage is under attack?", "o": ["The training data", "The model itself", "The output"], "a": 1, "e": "Finding out what the model learned from is an attack on the model, a form of theft.", "lesson": 4}, {"q": "A flaw is announced in a shared software library. What lets a hospital tell quickly whether its AI tool is affected?", "o": ["A bill of materials listing the tool's parts", "The supplier's brochure", "A longer contract"], "a": 0, "e": "An ingredients list gives traceability.", "lesson": 5}, {"q": "What does an AI bill of materials add to a software one?", "o": ["Datasets, learned model numbers and the base model", "Staff names", "Licence prices"], "a": 0, "e": "The AI list covers the parts that are special to AI.", "lesson": 5}, {"q": "In the V picture, what does the right arm represent?", "o": ["Requirements being broken down", "Testing that builds evidence up to clinical validation", "The project budget"], "a": 1, "e": "Requirements go down the left arm. Tests and evidence come up the right.", "lesson": 6}, {"q": "Your trust stores lifelong records. A director says quantum computers are decades away, so there is no rush. What is the flaw in that argument?", "o": ["Quantum computers already exist everywhere", "Records are deleted after a year", "Scrambled data copied today can be unscrambled later"], "a": 2, "e": "Harvest now, decrypt later means the risk starts the day data is copied.", "lesson": 7}, {"q": "A supplier says their tool is now 'completely safe' thanks to defence in depth. Is that right?", "o": ["No, it means no single failure is a disaster, not that nothing can go wrong", "Yes, defence in depth makes a tool invulnerable", "Yes, if they have a certificate too"], "a": 0, "e": "Defence in depth reduces risk to a level that can be justified and watched. It does not remove it.", "lesson": 8}]};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){ const e=document.createElement(tag); if(attrs) for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v);} for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k.nodeType?k:document.createTextNode(k)); return e; }
const pad = n => String(n).padStart(2,'0');
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const pct = x => Math.round(100*x);
function seg(options, value, onChange, label){ const w = h('div',{class:'seg',role:'group','aria-label':label||''}); const bs = options.map(([v,t]) => { const b = h('button',{type:'button','aria-pressed':String(v===value)}, t); b.onclick = () => { bs.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onChange(v); }; return b; }); w.append(...bs); return w; }

function save(){ S.updated = Date.now(); S.meta = {title:CH.title, num:CH.num, index:metrics().index, level:metrics().level, lessons:CH.lessons.length, done:Object.values(S.lessons).filter(l=>l.done).length, test:!!S.test};
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} renderChip(); renderMenu(); }
function L(i){ return S.lessons[i] || (S.lessons[i] = {watched:false, check:null, retry:null, caseScore:0, caseMax:0, caseDone:false, done:false, secs:0}); }

/* ---------------- metrics (Learning Index) ----------------
   Knowledge 35%: first-attempt quick checks + latest final-test answers correct
   Application 35%: points earned in case simulations (each choice 0–2)
   Self-awareness 15%: how often your confidence matched your answer (sure & right, or unsure & wrong)
   Completion 15%: lessons completed + final test taken
   Levels follow Benner's novice-to-expert stages (shortened for a short course). */
const LEVELS = [[0,'Novice','Starting out: knows the words, needs support to apply them'],[40,'Advanced beginner','Recognises the main ideas in familiar cases'],[60,'Competent','Applies the ideas to new cases and asks the right questions'],[80,'Proficient','Judges tools confidently and explains why to colleagues']];
function metrics(){
  const n = CH.lessons.length; let kOk=0,kN=0,aPts=0,aMax=0,cal=0,calN=0,done=0;
  for (let i=0;i<n;i++){ const l = S.lessons[i]; if (!l) continue;
    if (l.check){ kN++; if (l.check.ok) kOk++; if (l.check.conf){ calN++; if ((l.check.conf==='sure')===l.check.ok) cal++; } }
    aPts += l.caseScore||0; aMax += l.caseDone ? (l.caseMax||0) : 0; if (l.done) done++; }

    if (st.caseDone){ host.append(h('p',{class:'fb'}, h('span',{class: st.caseScore>=maxPts*0.75?'pill good':st.caseScore>=maxPts/2?'pill warn':'pill bad'}, `You scored ${st.caseScore} of ${maxPts}`), ' ', h('button',{class:'btn small',type:'button',onclick:()=>{ st.caseDone=false; st.caseScore=0; save(); renderCase(); }},'Try the case again'))); finishRow(); return; }
    function step(){
      const s = sc.steps[k]; const box = h('div',{class:'stepbox'}, h('p',{class:'q'}, `${k+1}. ${s.prompt}`)); const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
      s.choices.forEach(ch => { const b = h('button',{class:'opt',type:'button'}, ch.t); b.onclick = () => {
        opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ch.s===2?'right':ch.s===1?'part':'wrong');
        if (ch.s<2){ const best = s.choices.find(c=>c.s===2); if (best) [...opts.children].find(x=>x.textContent===best.t).classList.add('right'); }
        pts += ch.s; fb.innerHTML = `<b>${ch.s===2?'Good call.':ch.s===1?'Partly.':'Not the best choice.'}</b> ${ch.fb}`;
        k++; if (k < sc.steps.length) step(); else { st.caseDone = true; st.caseScore = pts; st.caseMax = maxPts; st.done = st.done || !!st.check; save(); renderSteps();
          host.append(h('p',{class:'fb',style:'margin-top:12px'}, h('span',{class: pts>=maxPts*0.75?'pill good':pts>=maxPts/2?'pill warn':'pill bad'}, `Case score: ${pts} of ${maxPts}`))); finishRow(); } };
        opts.append(b); });
      box.append(opts, fb); host.append(box);
    }
    step();
  }
  function finishRow(){
    st.done = !!(st.check && st.caseDone); save();
    const next = i < CH.lessons.length-1 ? h('button',{class:'btn primary',type:'button',onclick:()=>go('l'+(i+1))}, `Next: lesson ${i+2}`) : h('button',{class:'btn primary',type:'button',onclick:()=>go('final')}, 'Go to the final case test');
    caseCard.append(h('div',{class:'row',style:'margin-top:14px'}, next, h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my progress')));
  }
  renderCheck(); renderCase(); layout();
}

/* generic question with confidence rating */
function askQuestion(host, q, practice, onDone, isRetry){
  const box = h('div'); host.append(box);
  if (!isRetry || true) box.append(h('p',{class:'q'}, q.q));
  let conf = null;
  const confSeg = seg([['sure','I\'m sure'],['unsure','I\'m not sure']], null, v=>conf=v, 'Confidence');
  if (!practice) box.append(h('div',{class:'conf'}, h('span',null,'Before you answer, how sure are you?'), confSeg, h('span',{style:'font-size:.8rem'},'(optional, helps your self-awareness score)')));
  const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
  q.o.forEach((o,j)=>{ const b = h('button',{class:'opt',type:'button'}, o); b.onclick = () => {
    const ok = j===q.a; opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ok?'right':'wrong'); if (!ok) opts.children[q.a].classList.add('right');
    fb.innerHTML = `<b>${ok?'Right.':'Not quite.'}</b> ${q.e}`; onDone(ok, conf); };
    opts.append(b); });
  box.append(opts, fb);
}

/* ---------------- FINAL case test ---------------- */
function renderFinal(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'Final case test'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Check your learning path'), h('p',{class:'lede',style:'margin-top:6px'}, `${CH.test.length} short questions across all ${CH.lessons.length} lessons. You see the answer after each one. Your latest attempt counts towards your learning index, and the results show which lessons to revisit.`)));
  if (M.done < CH.lessons.length) main.append(h('div',{class:'card',style:'background:var(--signal-soft)'}, h('p',null, `You have finished ${M.done} of ${CH.lessons.length} lessons. You can take the test now, but you will probably score higher after finishing them.`)));
  const host = h('div',{class:'card'}); main.append(host);
  if (S.test) { host.append(h('p',null, h('span',{class:'pill acc'}, `Last attempt: ${S.test.score} of ${CH.test.length}`), ` · ${S.test.attempts} attempt${S.test.attempts>1?'s':''}`), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Take the test again'), h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my results'))); return; }
  host.append(h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Start the test'));
}
function runTest(host){
  const answers = []; let k = 0;
  const prog = h('p',{class:'eyebrow'}); host.append(prog); const qhost = h('div'); host.append(qhost);
  function next(){
    qhost.innerHTML=''; prog.textContent = `Question ${k+1} of ${CH.test.length} · from lesson ${CH.test[k].lesson+1}: ${CH.lessons[CH.test[k].lesson].title}`;
    askQuestion(qhost, CH.test[k], false, (ok, conf) => { answers.push({ok, conf, lesson: CH.test[k].lesson});
      qhost.append(h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ k++; if (k<CH.test.length) next(); else finish(); }}, k<CH.test.length-1?'Next question':'See my results'))); });
  }
  function finish(){ const score = answers.filter(a=>a.ok).length; S.test = {answers, score, attempts:(S.test?S.test.attempts:0)+1, at:Date.now()}; save(); go('progress'); }
  next();
}

/* ---------------- PROGRESS: learning index, advice, certificate ---------------- */
function gaugeSVG(v){
  const r=60, c=2*Math.PI*r, f=c*v/100;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Learning index ${v} out of 100"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${v}</text><text x="75" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">out of 100</text></svg>`;
}
function advice(){
  const out = []; const n = CH.lessons.length;
  const testBy = {}; if (S.test) S.test.answers.forEach(a=>{ (testBy[a.lesson] = testBy[a.lesson]||{ok:0,n:0}); testBy[a.lesson].n++; if (a.ok) testBy[a.lesson].ok++; });
  const weak = [];
  for (let i=0;i<n;i++){ const l = S.lessons[i]; const reasons = [];
    if (l && l.check && !l.check.ok) reasons.push('missed the quick check');
    if (l && l.caseDone && l.caseScore < l.caseMax*0.5) reasons.push(`scored ${l.caseScore} of ${l.caseMax} on the case`);
    if (testBy[i] && testBy[i].ok < testBy[i].n) reasons.push(`${testBy[i].n-testBy[i].ok} final-test question${testBy[i].n-testBy[i].ok>1?'s':''} wrong`);
    if (reasons.length) weak.push([i, reasons]); }
  weak.sort((a,b)=>b[1].length-a[1].length).slice(0,3).forEach(([i,r])=>out.push(['Revisit', `Lesson ${i+1}, ${CH.lessons[i].title}: you ${r.join(', ')}. Try it in Read mode and open "Explain more simply".`, 'l'+i]));
  const nf = [...Array(n).keys()].find(i=>!(S.lessons[i]&&S.lessons[i].done));
  if (nf!==undefined) out.push(['Next', `Carry on with lesson ${nf+1}, ${CH.lessons[nf].title}.`, 'l'+nf]);
  else if (!S.test) out.push(['Next', 'All lessons done. Take the final case test to check your learning path.', 'final']);
  const M = metrics();
  if (M.calN >= 4 && M.C < 0.6) out.push(['Self-awareness', 'Your confidence often did not match your answers. In clinical work, knowing when you are unsure matters as much as knowing the answer. Keep rating your confidence.', null]);
  if (S.plan && S.secs > 0){ const done = Object.values(S.lessons).filter(l=>l.done); const avg = done.length ? done.reduce((a,l)=>a+l.secs,0)/done.length/60 : 0;
    if (avg >= 0.5) out.push(['Your pace', `You spend about ${avg.toFixed(1)} minutes per lesson. ${avg > 6 ? 'Taking your time is fine. Shorter sittings may suit you better: try 5-minute sittings on the Start page.' : avg < 2.5 ? 'You move quickly. If the cases feel easy, the Fast track path lets you skip straight to them.' : 'That fits your plan well.'}`, null]); }
  if (!out.length) out.push(['Well done', 'No gaps found. You could teach this chapter to a colleague.', null]);
  return out;
}
function renderProgress(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'My progress'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Your learning index'), h('p',{class:'lede',style:'margin-top:6px'}, S.test ? 'Based on your lessons, cases and final test.' : 'Provisional until you take the final case test.')));
  const dims = [['Knowledge', M.K, 'Quick checks right first time, plus final-test answers'], ['Applying it', M.A, 'Points from the case simulations'], ['Self-awareness', M.C, 'How often your confidence matched your answer'], ['Completion', M.P, 'Lessons finished and final test taken']];
  const dimsEl = h('div',{class:'dims'}, dims.map(([n,v,d])=>h('div',null, h('div',{class:'dim'}, h('span',null,n), h('div',{class:'track'}, h('div',{class:'fill',style:`width:${v==null?0:pct(v)}%`})), h('output',null, v==null?'—':pct(v)+'%')), h('div',{style:'font-size:.78rem;color:var(--muted);margin:-4px 0 0'}, d))));
  const ladder = h('div',{class:'ladder'}, LEVELS.map(l=>h('div',{class: l[1]===M.level?'on':''}, l[1], h('br'), `${l[0]}+`)));
  main.append(h('div',{class:'card'}, h('div',{class:'gauge'}, h('div',{html:gaugeSVG(M.index)}), h('div',{style:'flex:1;min-width:240px'}, h('h3',null, M.level), h('p',{class:'lede'}, M.levelText), ladder)), h('div',{style:'margin-top:16px'}, dimsEl),
    h('p',{class:'foot',style:'margin-top:12px'},'How it is worked out: knowledge 35%, applying it 35%, self-awareness 15%, completion 15%. Levels follow Benner\'s "novice to expert" stages used in clinical education.')));
  const adv = h('div',{class:'advice'}, advice().map(([t,txt,v])=>h('div',null, h('span',{class:'pill acc',style:'flex:none'},t), h('span',{style:'flex:1'},txt), v ? h('button',{class:'btn small',type:'button',onclick:()=>go(v)},'Go') : null)));
  main.append(h('div',{class:'card'}, h('h3',null,'What to do next'), adv));
  const rows = CH.lessons.map((les,i)=>{ const l = S.lessons[i]||{}; return h('tr',null, h('td',null, `${i+1}. ${les.title}`), h('td',null, l.watched?'✓':'—'), h('td',null, l.check ? (l.check.ok ? h('span',{class:'pill good'},'Right') : h('span',{class:'pill warn'},'Missed')) : '—'), h('td',null, l.caseDone ? `${l.caseScore}/${l.caseMax}` : '—'), h('td',{class:'mono'}, l.secs ? (l.secs<60 ? '<1 min' : Math.round(l.secs/60)+' min') : '—')); });
  main.append(h('div',{class:'card'}, h('h3',null,'Lesson by lesson'), h('div',{class:'tablewrap'}, h('table',{class:'t'}, h('thead',null,h('tr',null, ['Lesson','Watched','Check','Case','Time'].map(t=>h('th',null,t)))), h('tbody',null,rows))),
    S.test ? h('p',{style:'margin-top:10px'}, h('span',{class:'pill acc'}, `Final test: ${S.test.score} of ${CH.test.length}`)) : null));
  // certificate
  const nameIn = h('input',{type:'text',id:'certName',placeholder:'Your name as it should appear',value:S.name||''});
  const certBtn = h('button',{class:'btn primary',type:'button'},'Download certificate');
  const note = h('p',{class:'foot'});
  const eligible = S.test && M.index >= 60;
  certBtn.disabled = !eligible; note.textContent = eligible ? 'Saves a picture of your certificate. Your score is calculated in your own browser, so keep the file as your record.' : 'Available once you have taken the final case test and reached Competent (60 or more).';
  certBtn.onclick = () => { S.name = nameIn.value.trim(); save(); makeCert(S.name || 'Learner', M); };
  main.append(h('div',{class:'card'}, h('h3',null,'Certificate'), h('div',{class:'row'}, nameIn, certBtn), note,
    h('div',{class:'row',style:'margin-top:14px'}, h('button',{class:'btn small',type:'button',onclick:()=>{ resetBox.hidden = false; }},'Start this chapter again'))));
  const resetBox = h('div',{class:'card',hidden:true,style:'background:var(--bad-soft)'}, h('p',null,'This clears your plan, answers and scores for this chapter in this browser. It cannot be undone.'), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn',type:'button',onclick:()=>{ S = blank(); save(); go('start'); }},'Yes, clear this chapter'), h('button',{class:'btn',type:'button',onclick:()=>{ resetBox.hidden=true; }},'Keep my progress')));
  main.append(resetBox);
}
function makeCert(name, M){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1130; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0,0,1600,1130); x.strokeStyle = '#0E6B66'; x.lineWidth = 14; x.strokeRect(40,40,1520,1050); x.lineWidth = 2; x.strokeRect(70,70,1460,990);
  x.fillStyle = '#0E6B66'; x.textAlign = 'center'; x.font = '600 30px Georgia, serif'; x.fillText('A CLINICAL GUIDE TO AI IN HEALTHCARE', 800, 180);
  x.fillStyle = '#14232A'; x.font = '600 72px Georgia, serif'; x.fillText('Certificate of learning', 800, 290);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('This is to record that', 800, 380);
  x.fillStyle = '#14232A'; x.font = '600 64px Georgia, serif'; x.fillText(name.slice(0,48), 800, 470);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('has completed', 800, 550);
  x.fillStyle = '#14232A'; x.font = '600 40px Georgia, serif'; x.fillText((CH.num==='A'?'Appendix A: ':'Chapter '+CH.num+': ') + CH.title, 800, 620, 1400);
  x.fillStyle = '#0E6B66'; x.font = '600 46px Arial, sans-serif'; x.fillText(`Learning index ${M.index} / 100  ·  ${M.level}`, 800, 740);
  x.fillStyle = '#55686D'; x.font = '24px Arial, sans-serif';
  x.fillText(`Knowledge ${pct(M.K)}%   ·   Applying it ${pct(M.A)}%   ·   Self-awareness ${M.C==null?'—':pct(M.C)+'%'}   ·   Final test ${S.test.score}/${CH.test.length}`, 800, 800);
  x.fillText('Issued ' + new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) + '  ·  Self-assessed online course record, calculated in the learner\'s browser', 800, 980);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `certificate-${CH.id}.png`; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); });
}

/* ---------------- boot ---------------- */
$('#chNum').textContent = CH.num==='A' ? 'Appendix A' : 'Chapter '+CH.num;
$('#chTitle span').textContent = CH.title;
const hv = (location.hash||'').slice(1);
go(views().includes(hv) ? hv : (S.plan ? 'l'+firstUnfinished() : 'start'));
</script>
