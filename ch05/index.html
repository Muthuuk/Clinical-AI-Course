e parts. Now the hospital cannot tell if its tool is affected. It cannot fix it with confidence. It cannot reassure the regulator.", "Notice that the tool never changed. It is as accurate as the day it arrived. Yet trust has collapsed.", "That is why Kelly and colleagues argued in 2019 that trustworthiness, not accuracy alone, decides what a tool does for patients.", "So this chapter asks a different question. Not just does it work, but can we trust it, and why?"], "scene": {"type": "graph", "title": "An accurate tool can still be unsafe: trust depends on more than accuracy", "nodes": [{"id": "ai", "label": "AI tool\n(accurate)", "p": [0, 0.2, 1.0], "c": "cyan", "shape": "ico", "size": 1.2, "ls": 0.68, "spin": true}, {"id": "data", "label": "Tampered\ntraining data", "p": [-4.4, 1.9, -0.6], "c": "red", "shape": "cyl", "size": 0.9, "ls": 0.68}, {"id": "part", "label": "Flawed hidden\nsoftware part", "p": [4.4, 1.9, -0.6], "c": "red", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "evid", "label": "No evidence\nto believe it", "p": [-2.1, 3.3, -1.6], "c": "amber", "shape": "slab", "size": 0.9, "ls": 0.68}, {"id": "alert", "label": "Alert service\nstops silently", "p": [2.1, 3.3, -1.6], "c": "red", "shape": "torus", "size": 0.9, "ls": 0.68}, {"id": "trust", "label": "Trust", "p": [4.4, -0.3, 0.8], "c": "violet", "shape": "shield", "size": 1.0}], "links": [["data", "ai"], ["part", "ai"], ["evid", "ai"], ["alert", "ai"], ["ai", "trust"]], "steps": ["all", "all", "all", ["ai"], ["ai"], "all", ["ai", "data"], ["ai", "part"], ["ai", "evid"], ["ai", "alert"], "all", ["ai"], ["ai", "part"], ["part"], ["part", "trust"], ["part", "trust"], ["part", "trust"], ["ai"], ["ai"], ["trust"], ["ai", "trust"], "all", ["trust"]]}}], "keyPoint": "A tool can pass every accuracy test and still be unsafe. Trust depends on more than accuracy.", "plain": ["Accuracy is only one part of safety.", "Tampered data, flawed software parts, missing evidence or a broken alert service can all cause harm.", "A tool can stay exactly the same while trust in it collapses."], "check": {"q": "A scan-reading tool is still as accurate as ever, but a flaw is found in one of its hidden software parts. What is the problem?", "o": ["There is no problem, accuracy is unchanged", "The tool must be retrained", "The hospital cannot tell if it is affected, so trust collapses"], "a": 2, "e": "Without a record of what is inside the tool, nobody can tell whether it is affected. Accuracy alone does not make it safe.", "retry": {"q": "Which statement matches this chapter?", "o": ["Accurate does not mean safe", "Accurate means safe", "Safety is the supplier's problem only"], "a": 0, "e": "A tool can pass every benchmark and still fail patients in other ways."}}, "scenario": {"title": "The board paper", "setting": "Your trust board is asked to approve a new AI chest X-ray tool. The paper says it is 'the most accurate on the market' and nothing else.", "steps": [{"prompt": "What is your first reaction?", "choices": [{"t": "Accuracy is high, so approve it", "s": 0, "fb": "No. Accurate does not mean safe. The paper says nothing about how it could fail."}, {"t": "Ask what else could make it fail, beyond accuracy", "s": 2, "fb": "Right. Tampered data, flawed parts, missing evidence and broken alerts all matter."}, {"t": "Ask how much it costs", "s": 1, "fb": "Fair question later, but safety comes first."}]}, {"prompt": "The supplier says 'nobody has ever complained about it'. What do you say?", "choices": [{"t": "That settles it", "s": 0, "fb": "No. Silence is not evidence of safety."}, {"t": "Ask what evidence shows the whole tool can be trusted", "s": 2, "fb": "Right. Trust must be earned with evidence, not assumed."}, {"t": "Ask for a longer trial", "s": 1, "fb": "Helpful, but a trial still needs to look at more than accuracy."}]}]}, "lab": {"type": "spot", "title": "Read the board paper", "prompt": "Your board must approve a new AI chest X-ray tool. Tap every part of the paper that is a warning sign.", "parts": [{"lbl": "Summary", "t": "The only evidence offered is that the tool is 'the most accurate on the market'.", "bad": true, "why": "Accuracy is only one part of safety. A tool can pass every accuracy test and still let a patient down."}, {"lbl": "Supplier note", "t": "'Nobody has ever complained about it.'", "bad": true, "why": "Silence is not evidence. Trust must be earned with evidence, not assumed."}, {"lbl": "Parts list", "t": "Nobody has written down which shared software parts the tool is built from.", "bad": true, "why": "If a flaw is later found in one of those parts, the trust cannot tell if its tool is affected."}, {"lbl": "Alerts", "t": "Urgent findings are sent by a messaging service. Nobody checks that it is still working.", "bad": true, "why": "The service that sends alerts can stop working without telling anyone."}, {"lbl": "Training data", "t": "The supplier explains where the training data came from and how it was checked for tampering.", "bad": false, "why": "Good sign. Tampered training data is one way an accurate-looking tool can be unsafe, so this is worth asking about."}, {"lbl": "Clinical lead", "t": "'Before we approve it, how else could this tool fail, beyond accuracy?'", "bad": false, "why": "Good sign. This is exactly the question the chapter asks: not just does it work, but can we trust it."}, {"lbl": "Local check", "t": "Radiologists compared the tool's readings with their own on a sample of local X-rays.", "bad": false, "why": "Checking accuracy is useful. The problem is only when accuracy is the whole case."}], "explain": "Accurate is not the same as safe. Tampered data, hidden flawed parts, missing evidence and silent alert failures can all break trust in a tool that still reads scans well."}}, {"title": "Three words, one goal", "minutes": 2, "slides": [{"img": 4, "say": ["Three words run through this chapter, and they are easily mixed up. Let's separate them.", "Security is protection. It protects three things. Keeping data private. Keeping the data and the tool uncorrupted. And keeping the service running when you need it.", "Assurance is evidence. It is the paperwork, the testing and the reasoned argument that show the tool is trustworthy, and will stay that way.", "Trust is the result. It is the willingness of clinicians, patients and regulators to rely on the tool. And that willingness must be earned, not assumed.", "So security and assurance are the means. Trust is the end. There is no shortcut."], "scene": {"type": "graph", "title": "Security protects, assurance proves, trust is the result", "nodes": [{"id": "priv", "label": "Data kept\nprivate", "p": [-4.6, 3.3, -1.6], "c": "cyan", "shape": "sphere", "size": 0.85, "ls": 0.68}, {"id": "integ", "label": "Data and tool\nuncorrupted", "p": [-4.6, 1.8, -0.8], "c": "cyan", "shape": "box", "size": 0.85, "ls": 0.68}, {"id": "avail", "label": "Service kept\nrunning", "p": [-4.6, 0.3, 0.0], "c": "cyan", "shape": "cyl", "size": 0.85, "ls": 0.68}, {"id": "sec", "label": "Security:\nprotection", "p": [-1.4, 0.8, 0.6], "c": "cyan", "shape": "shield", "size": 1.15, "ls": 0.68}, {"id": "assur", "label": "Assurance:\nevidence", "p": [1.2, 3.0, -1.2], "c": "amber", "shape": "slab", "size": 1.1, "ls": 0.68}, {"id": "trust", "label": "Trust:\nthe result", "p": [3.8, 1.4, 0.4], "c": "green", "shape": "ico", "size": 1.2, "ls": 0.68, "spin": true}], "links": [["priv", "sec"], ["integ", "sec"], ["avail", "sec"], ["sec", "trust"], ["assur", "trust"]], "steps": ["all", "all", ["sec"], ["sec", "priv", "integ", "avail"], ["sec", "priv"], ["sec", "integ"], ["sec", "avail"], ["assur"], ["assur"], ["trust"], ["trust"], ["trust"], ["sec", "assur"], ["trust"], "all"]}}, {"img": 5, "say": ["This picture shows the same idea as layers. Read it from the bottom up.", "At the base is governance. That means the rules, the management and the risk checks an organisation runs.", "On top of that sits security, protecting the data and the tool.", "Above that sits assurance, gathering the evidence that the whole thing works.", "At the very top is the goal. Trusted AI in everyday care.", "Take any layer away and the top is no longer held up. That is why security is built in from the first design decision, not bolted on at the end.", "In ordinary software, adding security late is expensive. In clinical AI, it is dangerous."], "scene": {"type": "stairs", "title": "Read from the bottom up: take any layer away and trust falls", "levels": [{"label": "Governance", "c": "violet"}, {"label": "Security", "c": "cyan"}, {"label": "Assurance", "c": "amber"}, {"label": "Trusted AI in\neveryday care", "c": "green"}], "flat": false, "steps": ["all", 0, 0, 0, 1, 2, 3, 3, "all", 1, 1, 1]}}], "keyPoint": "Security protects, assurance proves, and trust is the result. Take away a layer and trust is no longer held up.", "plain": ["Security: keep data private, keep the tool uncorrupted, keep it running.", "Assurance: the evidence that it is trustworthy.", "Trust: the earned result, not a starting assumption.", "Build security in from day one, not at the end."], "check": {"q": "Which of these is assurance rather than security?", "o": ["Documented testing that shows the tool is trustworthy", "Encrypting patient records", "Blocking strangers from the model"], "a": 0, "e": "Assurance is evidence. The other two are protection, which is security.", "retry": {"q": "In this chapter, trust is…", "o": ["The starting point", "Another word for security", "The earned result of security and assurance"], "a": 2, "e": "Security and assurance are the means. Trust is the end."}}, "scenario": {"title": "The IT request form", "setting": "You are asked to help write a trust IT request for an AI discharge-summary tool. A colleague says 'just put that the supplier has good security'.", "steps": [{"prompt": "Is good security enough on its own?", "choices": [{"t": "Yes, security is the main thing", "s": 0, "fb": "No. Security protects, but you also need evidence that decision."}}, {"title": "The model is not the system", "minutes": 2, "slides": [{"img": 6, "say": ["So what exactly is a clinical AI system? You can only protect what you have drawn a line around.", "Picture a set of rings, one inside another. In the centre is the model. That is the part that learned from data and makes the predictions.", "Around the model sits the software it lives in, and all the shared building blocks that software relies on.", "Around that sit the computers, the network and the storage it runs on.", "And around everything sit the people and the processes. Clinicians, patients, training, oversight and governance.", "Each ring can fail in its own way. And each failure can harm a patient just as surely as a wrong prediction.", "Here is an example. A sepsis prediction model is faultless. It spots deteriorating patients well. But the messaging service that carries its alerts fails silently. No alert reaches the ward.", "The model did nothing wrong. Yet the system failed the patient.", "So the model is not the system. Trust must hold across every ring.", "Drawing that line widely is the first act of assurance."], "scene": {"type": "graph", "title": "The model is not the system: any ring can fail the patient", "nodes": [{"id": "model", "label": "The model", "p": [0, 0.2, 1.0], "c": "cyan", "shape": "ico", "size": 1.2, "spin": true}, {"id": "soft", "label": "Software and\nbuilding blocks", "p": [-4.4, 1.9, -0.6], "c": "cyan", "shape": "box", "size": 0.95, "ls": 0.68}, {"id": "comp", "label": "Computers,\nnetwork, storage", "p": [4.4, 1.9, -0.6], "c": "slate", "shape": "cyl", "size": 0.95, "ls": 0.68}, {"id": "people", "label": "People and\nprocesses", "p": [0, 3.3, -1.6], "c": "violet", "shape": "sphere", "size": 0.95, "ls": 0.68}, {"id": "alert", "label": "Alert messaging\nservice", "p": [-4.4, -0.3, 0.8], "c": "red", "shape": "torus", "size": 0.9, "ls": 0.68}, {"id": "ward", "label": "The ward", "p": [4.4, -0.3, 0.8], "c": "green", "shape": "slab", "size": 0.9}], "links": [["model", "soft"], ["model", "comp"], ["model", "people"], ["model", "alert"], ["alert", "ward"]], "steps": ["all", "all", "all", ["model"], ["model"], ["model", "soft"], ["model", "soft", "comp"], ["model", "soft", "comp", "people"], ["people"], "all", "all", "all", ["model"], ["model"], ["alert"], ["alert", "ward"], ["model"], ["alert", "ward"], "all", "all", "all"]}}], "keyPoint": "A clinical AI system is the model plus its software, its computers and its people. Any ring can fail the patient.", "plain": ["Centre: the model.", "Next ring: the software and its building blocks.", "Next ring: computers, network and storage.", "Outer ring: people and processes.", "A perfect model with a broken alert service still fails the patient."], "check": {"q": "A sepsis model predicts well, but its alerts silently stop reaching the ward. How should you describe this?", "o": ["A model error needing retraining", "An attack on the training data", "A system failure, even though the model is faultless"], "a": 2, "e": "The model is only one ring. If the alert service fails, the whole system fails the patient.", "retry": {"q": "Which of these is part of a clinical AI system?", "o": ["The model, its software, its computers and its people", "Only the model", "Only the people who use it"], "a": 0, "e": "The system is all the rings together, not just the model."}}, "scenario": {"title": "The missing alerts", "setting": "On your ward, the deterioration alerts have been quiet for three days. The IT team says 'the model is running fine'.", "steps": [{"prompt": "What do you think?", "choices": [{"t": "The model is fine, so all is well", "s": 0, "fb": "No. The model is only one ring. Alerts travel through other parts that can fail."}, {"t": "Check the whole chain, from model to the screen on the ward", "s": 2, "fb": "Right. The alert service, network or screens may have failed silently."}, {"t": "Assume patients have simply been well", "s": 1, "fb": "Possible, but three silent days deserve a check of the whole chain."}]}, {"prompt": "You find the messaging service stopped on Monday. Who should hear about it?", "choices": [{"t": "Nobody, it is fixed now", "s": 0, "fb": "No. A silent failure of three days is a safety incident."}, {"t": "Report it as a safety incident so the whole system can be reviewed", "s": 2, "fb": "Right. The failure sat outside the model, and the system design needs to catch it next time."}, {"t": "Only the IT team", "s": 1, "fb": "IT needs to know, but so do the clinical safety leads."}]}]}, "lab": {"type": "sort", "title": "Which ring?", "prompt": "Place each part of a clinical AI system in its ring.", "buckets": ["Centre: the model", "Software and building blocks", "Computers, network, storage", "People and processes"], "items": [{"t": "The part that learned from data", "b": 0}, {"t": "The part that makes the predictions", "b": 0}, {"t": "Shared building blocks the software relies on", "b": 1}, {"t": "The software the model lives in", "b": 1}, {"t": "The network it runs on", "b": 2}, {"t": "The storage it runs on", "b": 2}, {"t": "Clinicians and patients", "b": 3}, {"t": "Training, oversight and governance", "b": 3}], "explain": "A clinical AI system is the model plus its software, its computers and its people. Each ring can fail in its own way, so trust must hold across every ring."}}, {"title": "Two rulebooks for running AI", "minutes": 2, "slides": [{"img": 7, "say": ["Once you know what the system is, you need a way to run it well. Two rulebooks are widely used.", "On the left is an international standard called ISO 42001, published in 2023. It is the first world standard for managing AI in an organisation.", "It works as a simple cycle. Plan what you will do. Do it. Check how it went. Act on what you learn. Then go round again.", "Its big advantage is that an outside body can audit your organisation and certify it. If your trust already works to the information security standard ISO 27001, this will feel a certifiable plan, do, check, act cycle. NIST gives four risk jobs. Use both, and remember a certificate is not proof a model is safe.", "plain": ["ISO 42001: plan, do, check, act. Can be certified by an outside body.", "NIST framework: govern, map, measure, manage.", "The standard is the engine, the framework is the ideas.", "A certificate proves a process, not a safe model."], "check": {"q": "Your trust has just been certified to ISO 42001. A colleague says every AI model you use is now proven safe. What is the best reply?", "o": ["Correct, certification checks each model", "Certification proves the process, not the safety of any one model", "Certification only covers paper records"], "a": 1, "e": "A certificate shows a good management process. A certified trust can still deploy a faulty tool.", "retry": {"q": "Which four jobs make up the NIST framework?", "o": ["Plan, Do, Check, Act", "Collect, Train, Test, Use", "Govern, Map, Measure, Manage"], "a": 2, "e": "Govern, map, measure and manage are the NIST jobs. Plan, do, check, act is the ISO cycle."}}, "scenario": {"title": "The supplier's certificate", "setting": "A supplier shows you a framed ISO 42001 certificate and says 'so you don't need to check our tool'.", "steps": [{"prompt": "What does the certificate actually tell you?", "choices": [{"t": "That every one of their models is safe", "s": 0, "fb": "No. It proves a good process, not a safe model."}, {"t": "That they run a good management process", "s": 2, "fb": "Right. That is valuable, but it is not proof about this tool."}, {"t": "Nothing at all", "s": 1, "fb": "Too harsh. It shows a sound process, which matters, but it is not the whole story."}]}, {"prompt": "What do you ask for next?", "choices": [{"t": "Evidence about this particular tool, such as testing and risk records", "s": 2, "fb": "Right. The certificate covers the organisation. You need evidence about the tool."}, {"t": "A copy of the certificate for your files", "s": 1, "fb": "Fine to keep, but it does not answer the safety question."}, {"t": "Nothing, the certificate is enough", "s": 0, "fb": "No. Certification is not proof of a safe model."}]}]}, "lab": {"type": "match", "title": "Two rulebooks", "prompt": "Match each term to its meaning.", "pairs": [{"a": "Govern", "b": "Setting a culture of responsibility"}, {"a": "Map", "b": "Finding the risks"}, {"a": "Measure", "b": "Tracking the risks"}, {"a": "Manage", "b": "Dealing with the risks"}, {"a": "ISO 42001", "b": "A plan, do, check, act cycle that an outside body can audit and certify"}, {"a": "A certificate", "b": "Shows a good process, but does not prove that any one model is safe"}], "explain": "The ISO standard is the engine and the NIST framework gives the ideas, so combine them. A certified trust can still deploy a faulty tool."}}, {"title": "Four ways to attack an AI tool", "minutes": 2, "slides": [{"img": 8, "say": ["Clinical AI faces a special kind of attack. The tool keeps running normally while someone quietly corrupts what it learns or decides. That makes these attacks hard to spot.", "Picture the life of a tool in four stages, each with its own attack.", "Stage one is the training data. The attack is poisoning. Someone slips tampered images into the data the tool learns from. It works on most cases, but fails on the cases the attacker chose.", "Stage two is the model itself. The attack is theft. Someone copies the model, or worse, works out whether a particular patient's record was used to train it.", "Stage three is use on a new patient. The attack is evasion. In 2019 Finlayson and colleagues added noise too small to see to skin images. The tool flipped its answer from benign to cancer.", "Stage four is the output. The attack is tampering with results after the tool has produced them.", "How do you defend? Check the data before training. Train the tool to resist tricks. Control who can reach it. And watch how it behaves in use.", "Layer these defences, so there is no single door for an attacker to open."], "scene": {"type": "stairs", "title": "Four stages, four attacks: layer the defences", "levels": [{"label": "1. Training data:\npoisoning", "c": "red"}, {"label": "2. The model:\ntheft", "c": "red"}, {"label": "3. New patient:\nevasion", "c": "red"}, {"label": "4. The output:\ntampering", "c": "red"}, {"label": "Layered\ndefences", "c": "green"}], "flat": true, "steps": ["all", "all", "all", "all", 0, 0, 0, 0, 1, 1, 1, 2, 2, 2, 2, 3, 3, 4, 4, 4, 4, 4, "all"]}}], "keyPoint": "Attacks strike at four stages: poisoned data, stolen models, tricked inputs and tampered outputs. Layer the defences.", "plain": ["Poisoning: tampered training data.", "Theft: copying the model or its patients' details.", "Evasion: a tiny change to an input flips the answer.", "Tampering: changing the results afterwards.", "No single defence is enough. Layer them."], "check": {"q": "A skin image is altered with noise invisible to the eye, and the AI changes its answer from benign to cancer. Which attack is this?", "o": ["Poisoning", "Theft", "Evasion"], "a": 2, "e": "Evasion tricks the tool at the moment of use. Finlayson and colleagues showed this in 2019.", "retry": {"q": "An attacker adds tampered images to the data a tool learns from. What is this called?", "o": ["Data poisoning", "Output tampering", "Model theft"], "a": 0, "e": "Poisoning attacks the training stage by corrupting what the tool learns."}}, "scenario": {"title": "The shared image bank", "setting": "Your hospital is building a skin-lesion tool from an image bank shared by several hospitals. Anyone at those hospitals can upload images.", "steps": [{"prompt": "What is the main attack to worry about here?", "choices": [{"t": "Poisoning, because anyone can add tampered images to the training data", "s": 2, "fb": "Right. Open uploads make poisoning the training data the obvious risk."}, {"t": "A power cut", "s": 0, "fb": "That is an ordinary IT risk, not an attack on what the tool learns."}, {"t": "Evasion at the bedside", "s": 1, "fb": "Possible later, but the open upload is the bigger weakness right now."}]}, {"prompt": "Which defence most directly addresses it?", "choices": [{"t": "Encrypt the tool's outputs", "s": 0, "fb": "That protects results, not the training data."}, {"t": "Check and validate images before they are used for training", "s": 2, "fb": "Right. Match the defence to the stage under attack."}, {"t": "Buy more servers", "s": 0, "fb": "Capacity does not stop poisoning."}]}]}, "lab": {"type": "memory", "title": "Name that attack", "prompt": "Flip the cards and match each attack to what it does.", "pairs": [{"a": "Poisoning", "b": "Tampered images slipped into the training data"}, {"a": "Theft", "b": "Copying the model, or finding whose records trained it"}, {"a": "Evasion", "b": "Unseen noise on an input flips the answer"}, {"a": "Tampering", "b": "Changing the results after the tool produced them"}, {"a": "Layered defences", "b": "No single door for an attacker to open"}], "explain": "Attacks strike at four stages: data, model, use and output. Check data, train the tool to resist tricks, control access and watch it in use, all together."}}, {"title": "What is inside the tool?", "minutes": 2, "slides": [{"img": 9, "say": ["Now a quieter risk. The supply chain.", "No clinical AI tool is built from scratch. It is assembled from parts. Shared software libraries. Models that someone else trained first. Public datasets. Outside services.", "Each part depends on further parts, so the risk spreads like the branches of a tree.", "The key question is this. When a flaw is announced in some part, can you tell whether your tool is affected?", "The answer is an ingredients list, called a bill of materials.", "A software bill of materials lists every software package, its version and its licence. But it misses the parts that are special to AI.", "An AI bill of materials adds those. The datasets used. The learned numbers inside the model. And the ready-made model it was built on.", "Why does that matter? Suppose your tool was adapted from a ready-made model that someone else trained. Later, that model is found to have been poisoned.", "A software list alone would never show it. An AI list would.", "The payoff is simple. When something goes wrong, you can trace it and recall every product it touched."], "scene": {"type": "graph", "title": "An ingredients list lets you trace a flaw: an AI list also covers data and models", "nodes": [{"id": "tool", "label": "Clinical\nAI tool", "p": [0, 0.2, 1.0], "c": "cyan", "shape": "ico", "size": 1.2, "ls": 0.68, "spin": true}, {"id": "lib", "label": "Shared software\nlibraries", "p": [-4.4, 1.9, -0.6], "c": "cyan", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "base", "label": "Ready-made\nbase model", "p": [4.4, 1.9, -0.6], "c": "cyan", "shape": "sphere", "size": 0.9, "ls": 0.68}, {"id": "data", "label": "Public\ndatasets", "p": [-1.8, 3.3, -1.6], "c": "slate", "shape": "cyl", "size": 0.9, "ls": 0.68}, {"id": "svc", "label": "Outside\nservices", "p": [1.8, 3.3, -1.6], "c": "slate", "shape": "torus", "size": 0.85, "ls": 0.68}, {"id": "sbom", "label": "Software bill\nof materials", "p": [-4.4, -0.3, 0.8], "c": "amber", "shape": "slab", "size": 0.9, "ls": 0.68}, {"id": "aibom", "label": "AI bill of\nmaterials", "p": [4.4, -0.3, 0.8], "c": "green", "shape": "slab", "size": 0.9, "ls": 0.68}], "links": [["lib", "tool"], ["base", "tool"], ["data", "tool"], ["svc", "tool"], ["sbom", "lib"], ["aibom", "base"], ["aibom", "data"]], "steps": ["all", "all", ["tool"], ["tool", "lib", "base", "data", "svc"], ["lib"], ["base"], ["data"], ["svc"], ["tool", "lib", "base", "data", "svc"], "all", ["tool", "lib"], ["sbom", "aibom"], ["sbom", "lib"], ["sbom"], ["aibom"], ["aibom", "data"], ["aibom", "tool"], ["aibom", "base"], "all", ["tool", "base"], ["base"], ["sbom"], ["aibom", "base"], "all", "all"]}}], "keyPoint": "Ask for an ingredients list. A software list covers the code. An AI list also covers the data and the model it was built on.", "plain": ["AI tools are built from borrowed parts.", "A software bill of materials lists the software packages.", "An AI bill of materials also lists datasets, model numbers and the base model.", "With a list, you can trace a flaw and recall what it touched."], "check": {"q": "Your tool was built on a ready-made base model later found to be poisoned. Which record would show you are affected?", "o": ["An AI bill of materials", "A software bill of materials only", "The staff training register"], "a": 0, "e": "Only the AI list records the base model, datasets and learned numbers.", "retry": {"q": "What is a bill of materials, in plain words?", "o": ["An invoice", "A list of staff who use the tool", "An ingredients list of what the tool is made from"], "a": 2, "e": "It lists every part inside the tool, so you can trace a flaw."}}, "scenario": {"title": "The vulnerability notice", "setting": "A radiology AI supplier announces a flaw in a software library their product uses. Your hospital installed the product six months ago.", "steps": [{"prompt": "What do you ask the supplier first?", "choices": [{"t": "Which versions of the product contain the flawed library, and is ours one of them?", "s": 2, "fb": "Right. That is exactly what a bill of materials should answer."}, {"t": "Whether the flaw is in the news", "s": 0, "fb": "Not relevant to patient safety."}, {"t": "Whether other hospitals are worried", "s": 1, "fb": "Interesting, but you need to know about your own installation."}]}, {"prompt": "The supplier says they have never kept a list of parts. What does this tell you?", "choices": [{"t": "Nothing, lists are optional", "s": 0, "fb": "No. Without a list nobody can tell what is affected."}, {"t": "They cannot confidently say whether you are exposed, so treat the tool as possibly affected", "s": 2, "fb": "Right. No ingredients list means no traceability."}, {"t": "The flaw cannot affect you", "s": 0, "fb": "Not knowing is not the same as being safe."}]}]}, "lab": {"type": "sort", "title": "Read the ingredients list", "prompt": "Which list records each item: an ordinary software list, or only the AI list?", "buckets": ["Software bill of materials", "Added by an AI bill of materials"], "items": [{"t": "Every software package", "b": 0}, {"t": "The version of each package", "b": 0}, {"t": "The licence of each package", "b": 0}, {"t": "The datasets used", "b": 1, "why": "Datasets are special to AI, so a software list misses them."}, {"t": "The learned numbers inside the model", "b": 1, "why": "The model's learned numbers are special to AI."}, {"t": "The ready-made model it was built on", "b": 1, "why": "Only an AI list would show a poisoned base model."}], "explain": "A software list covers the code. An AI list also covers the data and the model, so when a flaw is found you can trace it and recall every product it touched."}}, {"title": "Every promise needs a test", "minutes": 2, "slides": [{"img": 10, "say": ["Clinical AI belongs with aircraft controls and nuclear plants. Systems like that are not just tested. They are assured.", "This picture is shaped like a letter V. It shows how.", "Read down the left arm. It starts with the clinical purpose. What is the tool for, and for whom? From that come the safety requirements. Then the design. Then the build.", "At the bottom of the V, the system is built.", "Now read up the right arm. Each small part is tested. Then the parts are tested together. Then the system is tested against attack. And at the top, the whole thing is tested in the clinic.", "The dashed lines across the V are the heart of it. Every promise on the left has a matching test on the right.", "The result is called an assurance case. A clear argument, backed by evidence, that the tool is safe enough.", "Here is the common failure. Excellent tests of each small part, but no clinical testing at the top. The parts all work, but the whole solves the wrong problem.", "So assurance is more than testing. It links every claim to its evidence."], "scene": {"type": "graph", "title": "The V: every promise on the left needs a matching test on the right", "nodes": [{"id": "purp", "label": "Clinical\npurpose", "p": [-4.8, 3.3, -1.2], "c": "violet", "shape": "sphere", "size": 0.9, "ls": 0.68}, {"id": "req", "label": "Safety\nrequirements", "p": [-3.0, 1.6, -0.3], "c": "violet", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "build", "label": "Design\nand build", "p": [-0.6, -0.4, 0.8], "c": "cyan", "shape": "cyl", "size": 0.95, "ls": 0.68}, {"id": "parts", "label": "Test parts,\nthen together", "p": [2.0, 1.0, 0.3], "c": "cyan", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "attack", "label": "Test against\nattack", "p": [4.6, 1.8, -0.3], "c": "amber", "shape": "shield", "size": 0.9, "ls": 0.68}, {"id": "clinic", "label": "Test in\nthe clinic", "p": [4.4, 3.4, -1.2], "c": "green", "shape": "sphere", "size": 0.9, "ls": 0.68}, {"id": "assure", "label": "Assurance\ncase", "p": [0, 3.3, -1.6], "c": "green", "shape": "slab", "size": 1.0, "ls": 0.68}], "links": [["purp", "req"], ["req", "build"], ["build", "parts"], ["parts", "attack"], ["attack", "clinic"], ["purp", "clinic"], ["assure", "clinic"], ["assure", "purp"]], "steps": ["all", "all", "all", "all", "all", ["purp", "req", "build"], ["purp"], ["purp"], ["req"], ["build"], ["build"], ["build"], ["build", "parts", "attack", "clinic"], ["parts"], ["parts"], ["attack"], ["clinic"], ["purp", "clinic"], ["purp", "req", "build", "parts", "attack", "clinic"], ["assure"], ["assure"], ["parts"], ["parts"], ["parts", "purp"], ["assure"], "all"]}}], "keyPoint": "Requirements go down one arm of the V, tests come up the other. Every promise needs a matching test.", "plain": ["Left arm: purpose, safety needs, design, build.", "Right arm: test the parts, test them together, test against attack, test in the clinic.", "A promise with no matching test is a risk.", "Assurance case: the argument plus the evidence."], "check": {"q": "A team has thorough tests of every small part of its AI, but no clinical testing. What is the risk?", "o": ["The system will run too slowly", "The parts work but the whole may solve the wrong clinical problem", "The data will be stolen"], "a": 1, "e": "Without clinical testing at the top of the V, nothing shows the tool does its clinical job.", "retry": {"q": "In the V picture, what do the dashed lines across the V mean?", "o": ["Every requirement has a matching test", "The project is behind schedule", "The tool uses two computers"], "a": 0, "e": "Each promise on the left is checked by a test on the right."}}, "scenario": {"title": "The supplier's test report", "setting": "A supplier of a falls-risk tool sends you a thick test report. Every page is about testing small pieces of code.", "steps": [{"prompt": "What is missing?", "choices": [{"t": "Nothing, it is very thorough", "s": 0, "fb": "No. Testing parts is not the same as testing the whole in the clinic."}, {"t": "Evidence that the whole tool was tested against its clinical purpose", "s": 2, "fb": "Right. The top of the V is missing."}, {"t": "More pages", "s": 0, "fb": "Thickness is not evidence."}]}, {"prompt": "You ask for the safety requirements. They send a list, but two have no test against them. What do you conclude?", "choices": [{"t": "Two promises have no proof, so they are open risks", "s": 2, "fb": "Right. A requirement with no matching test is a gap in the V."}, {"t": "Two out of many is fine", "s": 1, "fb": "It may be, but each untested promise must be looked at, not waved through."}, {"t": "The list proves the tool is safe", "s": 0, "fb": "A list of promises is not evidence they were kept."}]}]}, "lab": {"type": "order", "title": "Build the V", "prompt": "Put the V in order: down the left arm, then up the right arm.", "items": ["Set the clinical purpose", "Write the safety requirements", "Design, then build", "Test each small part", "Test the parts together", "Test against attack", "Test in the clinic"], "explain": "Every promise on the left needs a matching test on the right. Without clinical testing at the top, the parts can all work while the whole solves the wrong problem."}}, {"title": "Data that outlives its locks", "minutes": 2, "slides": [{"img": 11, "say": ["Health data has an unusual property. It lives a long time.", "A genome, a childhood diagnosis or a lifelong identifier must stay private for decades, not months.", "Today that data is scrambled by encryption, so only the right people can read it. But a new kind of computer, a quantum computer, is expected to break some of today's scrambling.", "That creates a threat called harvest now, decrypt later. Follow the timeline across the slide.", "Today, data is scrambled and sent. In the near future, an attacker copies the scrambled data and simply stores it. Years later, with a quantum computer, they unscramble it. And the patient is still alive.", "This is not science fiction. The American standards body published the first quantum-resistant encryption standards in 2024.", "So what should your organisation do? Four steps. Find out where encryption protects your data. Work out which data must live for decades. Move that data to quantum-resistant locks first. And make new purchases ready for the change.", "Some say quantum computers are decades away, so we can wait. But the data can be copied today.", "Choose the lock for the life of the data, not the life of the system. Start now."], "scene": {"type": "stairs", "title": "Harvest now, decrypt later: choose the lock for the life of the data", "levels": [{"label": "Today: data\nscrambled, sent", "c": "slate"}, {"label": "Soon: copied\nand stored", "c": "red"}, {"label": "Years later:\nunscrambled", "c": "red"}, {"label": "Step 1: find\nencryption", "c": "green"}, {"label": "Step 2: find\nlong-lived data", "c": "green"}, {"label": "Step 3: move\nit first", "c": "green"}, {"label": "Step 4: buy\nready for change", "c": "green"}], "flat": true, "steps": ["all", "all", "all", 0, 2, 1, 0, 0, 1, 2, 2, "all", "all", "all", 3, 3, 4, 5, 6, 2, 1, "all", "all"]}}], "keyPoint": "Data copied today can be unscrambled later. Health data that lives fifty years needs quantum-resistant locks now.", "plain": ["Health data must stay private for decades.", "Harvest now, decrypt later: copy the scrambled data today, unscramble it years later.", "Four steps: find your encryption, find long-lived data, move it first, buy ready for change.", "Choose the lock for the life of the data."], "check": {"q": "Your trust holds genetic data that must stay private for fifty years. When should it move to quantum-resistant encryption?", "o": ["Once quantum computers are on sale", "Only after a breach", "Now, because stolen data can be unscrambled later"], "a": 2, "e": "Harvest now, decrypt later means today's copies become readable in future. Protect for the life of the data.", "retry": {"q": "What is the first of the four steps?", "o": ["Buy a quantum computer", "Find out where encryption protects your data", "Delete old records"], "a": 1, "e": "You cannot plan the move until you know where your encryption is."}}, "scenario": {"title": "The genomics board memo", "setting": "You are drafting a one-page memo for the board on protecting the trust's genomic data. A director writes back: 'quantum computers don't exist yet, why spend money now?'", "steps": [{"prompt": "What is your key point?", "choices": [{"t": "Attackers can copy the scrambled data today and unscramble it later", "s": 2, "fb": "Right. The threat is to data copied now, not only in the future."}, {"t": "Everyone else is doing it", "s": 0, "fb": "Not an argument about risk."}, {"t": "The new encryption is faster", "s": 0, "fb": "Not the point. The point is the long life of the data."}]}, {"prompt": "The director asks for a first step that costs little. What do you suggest?", "choices": [{"t": "Replace every system at once", "s": 0, "fb": "Too much, too soon. Start with an inventory."}, {"t": "List where encryption protects data and which data is long-lived", "s": 2, "fb": "Right. That is the first of the four steps and it costs little."}, {"t": "Wait for a national instruction", "s": 1, "fb": "Guidance helps, but the inventory can start now."}]}]}, "lab": {"type": "order", "title": "Four steps to safer locks", "prompt": "Put your organisation's four steps in order.", "items": ["Find out where encryption protects your data", "Work out which data must live for decades", "Move that data to quantum-resistant locks first", "Make new purchases ready for the change"], "explain": "Data copied today can be unscrambled later, so start now. Choose the lock for the life of the data, not the life of the system."}}, {"title": "No single wall", "minutes": 3, "slides": [{"img": 12, "say": ["Let's be honest about the limits of everything we have met. Honesty is what separates real care from box ticking.", "The ISO standard can be certified, but it proves a process, not a safe model. The NIST framework is thorough, but voluntary. The European AI law is binding, but law lags behind technology.", "Defences against attack are an arms race. Every defence invites a new attack. Ingredients lists are only as good as the effort to keep them current. Quantum-resistant locks are costly to fit, and a plan never carried out protects nobody.", "So frameworks shape your judgement. They do not replace it. The most important control is a culture where raising a safety worry is rewarded."], "scene": {"type": "graph", "title": "Every framework has limits: they shape judgement but do not replace it", "nodes": [{"id": "hub", "label": "Your judgement\nand safety culture", "p": [0, 0.2, 1.0], "c": "violet", "shape": "ico", "size": 1.2, "ls": 0.68, "spin": true}, {"id": "iso", "label": "ISO standard:\nproves a process", "p": [-4.4, 1.6, -0.4], "c": "amber", "shape": "slab", "size": 0.85, "ls": 0.68}, {"id": "nist", "label": "NIST: thorough\nbut voluntary", "p": [4.4, 1.6, -0.4], "c": "amber", "shape": "cyl", "size": 0.85, "ls": 0.68}, {"id": "eu", "label": "European AI law:\nlags technology", "p": [-2.2, 3.3, -1.6], "c": "amber", "shape": "shield", "size": 0.85, "ls": 0.68}, {"id": "def", "label": "Attack defences:\nan arms race", "p": [2.2, 3.3, -1.6], "c": "red", "shape": "box", "size": 0.85, "ls": 0.68}, {"id": "lists", "label": "Ingredients lists:\nmust stay current", "p": [-4.4, -0.4, 1.2], "c": "amber", "shape": "sphere", "size": 0.85, "ls": 0.68}, {"id": "quant", "label": "Quantum locks:\ncostly to fit", "p": [4.4, -0.4, 1.2], "c": "amber", "shape": "torus", "size": 0.85, "ls": 0.68}], "links": [["iso", "hub"], ["nist", "hub"], ["eu", "hub"], ["def", "hub"], ["lists", "hub"], ["quant", "hub"]], "steps": ["all", "all", ["iso"], ["nist"], ["eu"], ["def"], ["def"], ["lists"], ["quant"], ["hub"], ["hub"], ["hub"]]}}, {"img": 13, "say": ["Now picture the whole chapter as rings around one thing. Patient safety sits in the centre.", "Closest to the data is encryption, including the new quantum-resistant kind. Next are the defences against attack. Then the ingredients lists. And around everything, governance and assurance.", "This is called defence in depth. No single ring keeps the patient safe. An attacker who breaks one ring meets the next.", "It does not promise that nothing can go wrong. It promises that no single failure is a disaster."], "scene": {"type": "graph", "title": "Defence in depth: no single failure should be a disaster", "nodes": [{"id": "patient", "label": "Patient\nsafety", "p": [0, 0.2, 1.0], "c": "green", "shape": "shield", "size": 1.2, "ls": 0.68, "spin": true}, {"id": "enc", "label": "Encryption", "p": [-4.4, 1.9, -0.6], "c": "cyan", "shape": "sphere", "size": 0.9}, {"id": "def", "label": "Defences\nagainst attack", "p": [-1.8, 3.3, -1.6], "c": "cyan", "shape": "box", "size": 0.9, "ls": 0.68}, {"id": "lists", "label": "Ingredients\nlists", "p": [1.8, 3.3, -1.6], "c": "amber", "shape": "slab", "size": 0.9, "ls": 0.68}, {"id": "gov", "label": "Governance\nand assurance", "p": [4.4, 1.9, -0.6], "c": "violet", "shape": "torus", "size": 0.95, "ls": 0.68}, {"id": "atk", "label": "Attacker", "p": [4.4, -0.3, 0.9], "c": "red", "shape": "ico", "size": 0.85}], "links": [["atk", "gov"], ["gov", "lists"], ["lists", "def"], ["def", "enc"], ["enc", "patient"]], "steps": ["all", ["patient"], ["patient", "enc"], ["def"], ["lists"], ["gov"], "all", "all", ["atk", "gov", "lists"], "all", "all"]}}, {"img": 15, "say": ["Trust in clinical AI is engineered, not assumed.", "Carry this mindset into your work. Ask not only whether a tool works. Ask how it could be made to fail, who might want it to, and what evidence would justify trusting it anyway.", "Well done. Now try the final case test."], "scene": {"type": "stairs", "title": "Trust is engineered, not assumed", "levels": [{"label": "Does it work?", "c": "slate"}, {"label": "How could it be\nmade to fail?", "c": "red"}, {"label": "Who might\nwant it to?", "c": "amber"}, {"label": "What evidence\njustifies trust?", "c": "green"}], "flat": false, "steps": ["all", "all", 0, 3, "all", "all"]}}], "keyPoint": "No rule or tool is perfect, so layer them. Ask how a tool could fail, who might want it to, and what evidence earns trust.", "plain": ["Every framework has limits. They shape judgement but do not replace it.", "Defence in depth: rings of protection around patient safety.", "No single failure should be a disaster.", "Ask: how could it fail, who would want it to, what evidence earns trust?"], "check": {"q": "An attacker gets past a hospital AI's supply-chain checks but is stopped by data checks and access controls. Which idea is at work?", "o": ["Defence in depth", "Harvest now, decrypt later", "Plan, do, check, act"], "a": 0, "e": "Layered rings mean an attacker who breaks one is met by the next.", "retry": {"q": "According to the chapter, what is the most important control of all?", "o": ["The newest encryption", "A culture where raising safety worries is rewarded", "A certificate on the wall"], "a": 1, "e": "Frameworks shape judgement. A culture that welcomes safety concerns underpins everything else."}}, "scenario": {"title": "The two-year-old list", "setting": "In a supplier meeting, a company shows you a bill of materials last updated two years ago, and says their single firewall 'makes everything else unnecessary'.", "steps": [{"prompt": "What do you think of the two-year-old list?", "choices": [{"t": "Lists never change, so it is fine", "s": 0, "fb": "No. Parts change constantly. An old list gives false comfort."}, {"t": "An out-of-date list may give false security", "s": 2, "fb": "Right. The list is only as good as the effort to keep it current."}, {"t": "It replaces the need for clinical testing", "s": 0, "fb": "No. It is one ring, not the whole defence."}]}, {"prompt": "And the single firewall claim?", "choices": [{"t": "One strong wall is best", "s": 0, "fb": "No. If that wall falls, nothing is left. That is the opposite of defence in depth."}, {"t": "Ask what happens if the firewall fails", "s": 2, "fb": "Right. Defence in depth means a second ring is always waiting."}, {"t": "Ask how expensive the firewall is", "s": 1, "fb": "Cost matters, but the safety question is what sits behind the wall."}]}, {"prompt": "A junior colleague wants to raise a safety worry about the tool but fears looking awkward. What do you do?", "choices": [{"t": "Tell them to wait until after the contract is signed", "s": 0, "fb": "No. A culture that rewards raising concerns is the most important control."}, {"t": "Encourage them to raise it now, and thank them", "s": 2, "fb": "Right. Safety worries raised early are the cheapest to fix."}, {"t": "Raise it yourself without mentioning them", "s": 1, "fb": "The worry gets heard, but the colleague learns to stay quiet."}]}]}, "lab": {"type": "rush", "title": "Myth or mindset?", "prompt": "Beat the clock: is each statement in line with the chapter, or a myth?", "seconds": 60, "buckets": ["In line with the chapter", "Myth"], "items": [{"t": "Accurate does not mean safe", "b": 0}, {"t": "An ISO 42001 certificate proves a model is safe", "b": 1}, {"t": "The NIST framework is voluntary", "b": 0}, {"t": "The law always keeps pace with technology", "b": 1}, {"t": "Every defence invites a new attack", "b": 0}, {"t": "One strong firewall makes everything else unnecessary", "b": 1}, {"t": "A two-year-old parts list still keeps you safe", "b": 1}, {"t": "A plan never carried out protects nobody", "b": 0}, {"t": "Frameworks replace clinical judgement", "b": 1}, {"t": "Raising a safety worry should be rewarded", "b": 0}, {"t": "No single failure should be a disaster", "b": 0}, {"t": "Data copied today can be unscrambled later", "b": 0}], "explain": "No rule or tool is perfect, so layer them and keep using your judgement. Ask how a tool could fail, who might want it to, and what evidence earns trust."}}], "test": [{"q": "A board member says 'our AI is the most accurate on the market, so it is safe'. Which reply fits this chapter?", "o": ["Agreed, accuracy means safety", "Accuracy is irrelevant", "Accuracy matters, but trust depends on security and evidence across the whole system"], "a": 2, "e": "A tool can pass every benchmark and still be unsafe.", "lesson": 0}, {"q": "Which of these is an example of security, rather than assurance?", "o": ["A documented test report", "Encrypting patient records", "A reasoned safety argument"], "a": 1, "e": "Security is protection. Testing and argument are assurance.", "lesson": 1}, {"q": "A supplier plans to add security 'after the tool proves itself'. What does the chapter say?", "o": ["Security must be built in from the first design decision", "Sensible, prove it first", "Security is only for cloud tools"], "a": 0, "e": "Security added late is expensive in software and dangerous in clinical AI.", "lesson": 1}, {"q": "A faultless readmission model sits on a server that keeps crashing, so results arrive hours late. What has failed?", "o": ["The system, even though the model is faultless", "The model", "Nothing, the model is accurate"], "a": 0, "e": "The model is only one ring. The computers it runs on are part of the system.", "lesson": 2}, {"q": "Which cycle does the ISO 42001 standard use?", "o": ["Govern, map, measure, manage", "Collect, clean, train, test", "Plan, do, check, act"], "a": 2, "e": "Plan, do, check, act is the ISO cycle. The NIST framework uses govern, map, measure, manage.", "lesson": 3}, {"q": "An attacker cannot reach your model but can upload images to the shared bank it learns from. Which attack is this?", "o": ["Evasion", "Model theft", "Data poisoning"], "a": 2, "e": "Poisoning corrupts the training data.", "lesson": 4}, {"q": "Someone works out whether a named patient's record was used to train a model. Which stage is under attack?", "o": ["The training data", "The model itself", "The output"], "a": 1, "e": "Finding out what the model learned from is an attack on the model, a form of theft.", "lesson": 4}, {"q": "A flaw is announced in a shared software library. What lets a hospital tell quickly whether its AI tool is affected?", "o": ["A bill of materials listing the tool's parts", "The supplier's brochure", "A longer contract"], "a": 0, "e": "An ingredients list gives traceability.", "lesson": 5}, {"q": "What does an AI bill of materials add to a software one?", "o": ["Datasets, learned model numbers and the base model", "Staff names", "Licence prices"], "a": 0, "e": "The AI list covers the parts that are special to AI.", "lesson": 5}, {"q": "In the V picture, what does the right arm represent?", "o": ["Requirements being broken down", "Testing that builds evidence up to clinical validation", "The project budget"], "a": 1, "e": "Requirements go down the left arm. Tests and evidence come up the right.", "lesson": 6}, {"q": "Your trust stores lifelong records. A director says quantum computers are decades away, so there is no rush. What is the flaw in that argument?", "o": ["Quantum computers already exist everywhere", "Records are deleted after a year", "Scrambled data copied today can be unscrambled later"], "a": 2, "e": "Harvest now, decrypt later means the risk starts the day data is copied.", "lesson": 7}, {"q": "A supplier says their tool is now 'completely safe' thanks to defence in depth. Is that right?", "o": ["No, it means no single failure is a disaster, not that nothing can go wrong", "Yes, defence in depth makes a tool invulnerable", "Yes, if they have a certificate too"], "a": 0, "e": "Defence in depth reduces risk to a level that can be justified and watched. It does not remove it.", "lesson": 8}]};
